  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var mode = p.get("mode") || "edit";
      var code = p.get("code") || "IMP-US-2024-018";
      if (mode === "create") {
        location.replace("进口商管理-MVP.html?action=create");
      } else {
        location.replace(

    })();
  </script>
