<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>销售产品 · 新增数据 · 海外仓</title>
  <style>
    :root {
      --bg: #f0f2f5; --card: #fff; --line: #e8e8e8;
      --text: rgba(0,0,0,.85); --sub: rgba(0,0,0,.45);
      --blue: #1890ff; --red: #ff4d4f; --green: #52c41a;
      --sider: #001529;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13px; color: var(--text); background: var(--bg); }
    button, input, select { font: inherit; }

    .layout { display: flex; min-height: 100vh; }
    .sider { width: 200px; background: var(--sider); color: rgba(255,255,255,.75); flex-shrink: 0; }
    .sider .logo { height: 48px; display: flex; align-items: center; padding: 0 16px; color: #fff; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,.1); }
    .sider .grp { padding: 10px 16px 4px; font-size: 11px; color: rgba(255,255,255,.35); }
    .sider a { display: block; padding: 8px 16px 8px 24px; color: rgba(255,255,255,.65); text-decoration: none; font-size: 12px; }
    .sider a.on, .sider a:hover { color: #fff; background: var(--blue); }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .top { height: 48px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px; gap: 12px; }
    .content { flex: 1; padding: 16px; position: relative; }

    .demo-tip {
      max-width: 1200px; margin: 0 auto 12px; padding: 8px 12px;
      background: #fffbe6; border: 1px solid #ffe58f; color: #ad6800; font-size: 12px; border-radius: 2px;
    }
    .demo-tip a { color: var(--blue); }

    .mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 24px 12px; overflow: auto; z-index: 10;
    }
    .modal {
      background: var(--card); width: min(1120px, 100%);
      border-radius: 2px; box-shadow: 0 4px 24px rgba(0,0,0,.15);
      margin: auto 0;
    }
    .modal-hd {
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-hd h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .modal-hd .tag-new {
      display: inline-block; margin-left: 6px; padding: 0 4px; font-size: 10px;
      color: #cf1322; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 2px; vertical-align: middle;
    }
    .modal-close { border: none; background: none; font-size: 18px; color: var(--sub); cursor: pointer; }

    .modal-bd { padding: 14px 16px 8px; max-height: calc(100vh - 160px); overflow: auto; }
    .sec-title { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: rgba(0,0,0,.75); }
    .form-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px 16px; margin-bottom: 14px;
    }
    @media (max-width: 800px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
    .field label .req { color: var(--red); margin-right: 2px; }
    .field input, .field select, .field textarea {
      width: 100%; height: 30px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 0 8px; background: #fff;
    }
    .field textarea { height: 52px; padding: 6px 8px; resize: vertical; }
    .field input[readonly], .field input:disabled, .field select:disabled { background: #f5f5f5; color: rgba(0,0,0,.45); }
    .field.highlight { position: relative; }
    .field.highlight::after {
      content: "NEW"; position: absolute; top: 0; right: 0;
      font-size: 10px; color: #cf1322; background: #fff1f0; border: 1px solid #ffa39e;
      padding: 0 4px; border-radius: 2px; line-height: 16px;
    }
    .wh-preview {
      grid-column: 1 / -1; padding: 8px 10px; background: #f6ffed; border: 1px solid #b7eb8f;
      border-radius: 2px; font-size: 12px; line-height: 1.65; color: #135200;
    }
    .wh-preview.hidden { display: none; }
    .wh-preview b { color: #389e0d; }

    .extra-sec { border-top: 1px solid var(--line); padding-top: 12px; }
    .extra-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 12px;
      font-size: 12px;
    }
    @media (max-width: 900px) { .extra-grid { grid-template-columns: repeat(2, 1fr); } }
    .extra-grid label { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }

    .modal-ft {
      padding: 10px 16px; border-top: 1px solid var(--line);
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .btn { height: 30px; padding: 0 14px; border-radius: 2px; cursor: pointer; border: 1px solid #d9d9d9; background: #fff; }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: rgba(0,0,0,.78); color: #fff; padding: 8px 14px; border-radius: 4px;
      display: none; z-index: 20; font-size: 12px;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sider">
      <div class="logo">腾信物流</div>
      <div class="grp">配置</div>
      <a href="#">基础资料</a>
      <a href="销售产品-新增数据-MVP.html" class="on">销售产品</a>
      <a href="销售产品编辑-港后客服分配方式-MVP.html">销售产品 · 港后客服</a>
      <a href="产品部门/报价组/私卡报价-AI报价规则配置-MVP.html">AI 报价规则</a>
    </aside>
    <div class="main">
      <header class="top"><strong>基础资料 · 销售产品</strong></header>
      <div class="content">
        <div class="demo-tip">
          原型：<strong>新增数据</strong>弹窗增加「海外仓」字段（红框位置）。<strong>一产品绑一仓类型</strong>（六仓之一）；同仓类型下可有多条地址，测距由后台取起运地址邮编。
          规则见 <a href="产品部门/报价组/散货AI询价报价-需求PRD.html#m1">散货 PRD · 一、销售产品海外仓</a>。
        </div>
      </div>
    </div>
  </div>

  <div class="mask" id="mask">
    <div class="modal" role="dialog" aria-labelledby="modalTitle">
      <div class="modal-hd">
        <h1 id="modalTitle">新增数据<span class="tag-new">NEW · 海外仓</span></h1>
        <button type="button" class="modal-close" id="btnClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-bd">
        <div class="sec-title">基本信息</div>
        <div class="form-grid">
          <div class="field"><label><span class="req">*</span>产品代码</label><input id="fCode" placeholder="如 PK2535" /></div>
          <div class="field"><label><span class="req">*</span>产品名称</label><input id="fName" placeholder="如 中美快运私人卡派(洛杉矶)" /></div>
          <div class="field"><label><span class="req">*</span>产品组</label><select><option>海运 (HYCP)</option><option>空运 (KYCP)</option><option>整柜 (FCL)</option></select></div>

          <div class="field"><label><span class="req">*</span>业务类型</label><select><option>自营(非打单)</option><option>代理</option></select></div>
          <div class="field"><label><span class="req">*</span>标签模板</label><select><option>请选择</option><option>FBA 标准</option></select></div>
          <div class="field"><label>派送种类</label><select><option>请选择</option><option>卡派</option><option>快递</option></select></div>

          <div class="field"><label><span class="req">*</span>派送方式</label><select><option>卡车派送</option><option>快递派送</option></select></div>
          <div class="field"><label>港后客服</label><select><option>请选择</option><option>Candy(FX)</option></select></div>
          <div class="field"><label>港前查询客服</label><select><option>请选择</option></select></div>

          <div class="field"><label>港后同行客服</label><select><option>请选择</option></select></div>
          <div class="field"><label>船公司</label><select><option>请选择</option></select></div>
          <div class="field"><label><span class="req">*</span>时效</label><input value="25 - 32" /></div>

          <div class="field"><label>起运港</label><select><option>请选择</option></select></div>
          <div class="field"><label>目的港</label><select><option>请选择</option></select></div>
          <div class="field"><label>货物类型</label><select><option>普货</option></select></div>

          <div class="field"><label>标签参数</label><input /></div>
          <div class="field"><label><span class="req">*</span>干线服务级别</label><select><option>普船</option><option>加班</option></select></div>
          <div class="field"><label>始发邮编</label><input /></div>

          <div class="field"><label>产品渠道分类</label><input /></div>
          <div class="field"><label><span class="req">*</span>周长计算公式</label><select><option>长+2×(宽+高)</option></select></div>
          <div class="field"><label>排序号</label><input type="number" value="0" /></div>

          <div class="field"><label>备注</label><input /></div>
          <div class="field"><label><span class="req">*</span>提货类型</label><select><option>客户自送</option><option>上门提货</option></select></div>
          <div class="field highlight">
            <label><span class="req">*</span>海外仓</label>
            <select id="fWh">
              <option value="">请选择海外仓</option>
              <option value="LA">洛杉矶海外仓</option>
              <option value="NY">纽约海外仓</option>
              <option value="SAV">萨凡纳海外仓</option>
              <option value="CHI">芝加哥海外仓</option>
              <option value="HOU">休斯顿海外仓</option>
              <option value="OAK">奥克兰海外仓</option>
            </select>
          </div>

          <div class="wh-preview hidden" id="whPreview">
            <b>询价带出（只读）</b>：海外仓地址与邮编将用于和<strong>收货邮编</strong>测距，不是国内交货仓。<br />
            仓名：<span id="pvName">—</span>　地址：<span id="pvAddr">—</span>　邮编：<span id="pvZip">—</span>
          </div>
        </div>

        <div class="extra-sec">
          <div class="sec-title">额外服务</div>
          <div class="extra-grid">
            <label><input type="checkbox" /> 一件代发</label>
            <label><input type="checkbox" /> 保险</label>
            <label><input type="checkbox" /> 报关</label>
            <label><input type="checkbox" /> 查验</label>
            <label><input type="checkbox" /> 产品附加+0.5/KG</label>
            <label><input type="checkbox" /> 指定UPS打单</label>
            <label><input type="checkbox" /> 指定FEDEX打单</label>
            <label><input type="checkbox" /> 指定卡派打单</label>
          </div>
        </div>
      </div>
      <div class="modal-ft">
        <button type="button" class="btn btn-primary" id="btnOk">确定</button>
        <button type="button" class="btn" id="btnCancel">关闭</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  (function () {
    var WH = {
      LA: { name: "洛杉矶海外仓", addr: "1495 E Locust St, Ontario, CA", zip: "91761" },
      NY: { name: "纽约海外仓", addr: "7 Slater Dr, Elizabeth, NJ", zip: "07206" },
      SAV: { name: "萨凡纳海外仓", addr: "248 Grange Rd, Savannah, GA", zip: "31407" },
      CHI: { name: "芝加哥海外仓", addr: "Chicago, IL", zip: "60601" },
      HOU: { name: "休斯顿海外仓", addr: "Houston, TX", zip: "77001" },
      OAK: { name: "奥克兰海外仓", addr: "Oakland, CA", zip: "94607" }
    };
    var toastEl = document.getElementById("toast");
    function toast(m) { toastEl.textContent = m; toastEl.classList.add("show"); setTimeout(function () { toastEl.classList.remove("show"); }, 2400); }

    function syncWhPreview() {
      var id = document.getElementById("fWh").value;
      var box = document.getElementById("whPreview");
      if (!id || !WH[id]) { box.classList.add("hidden"); return; }
      var w = WH[id];
      document.getElementById("pvName").textContent = w.name;
      document.getElementById("pvAddr").textContent = w.addr;
      document.getElementById("pvZip").textContent = w.zip;
      box.classList.remove("hidden");
    }

    document.getElementById("fWh").addEventListener("change", syncWhPreview);

    document.getElementById("btnOk").addEventListener("click", function () {
      var code = (document.getElementById("fCode").value || "").trim();
      var name = (document.getElementById("fName").value || "").trim();
      var wh = document.getElementById("fWh").value;
      if (!code) { toast("请填写产品代码"); return; }
      if (!name) { toast("请填写产品名称"); return; }
      if (!wh) { toast("请选择海外仓"); document.getElementById("fWh").focus(); return; }
      toast("已保存 · " + name + " → " + WH[wh].name + "（" + WH[wh].zip + "）");
    });

    function closeModal() { document.getElementById("mask").style.display = "none"; }
    document.getElementById("btnClose").addEventListener("click", closeModal);
    document.getElementById("btnCancel").addEventListener("click", closeModal);

    /* 演示：打开时预填散货卡派示例 */
    document.getElementById("fCode").value = "PK-LA-LCL";
    document.getElementById("fName").value = "中美快运私人卡派(洛杉矶)";
    document.getElementById("fWh").value = "LA";
    syncWhPreview();
  })();
  </script>
</body>
</html>
