<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>运单角标示例</title>
  <style>
    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f7fb;
      color: #333;
    }
    .page-title {
      margin-bottom: 18px;
      font-size: 22px;
      color: #222;
    }
    .table-wrap {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 14px 16px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid #f0f2f5;
    }
    th {
      background: #fafbfc;
      color: #666;
      font-weight: 600;
    }
    tr:hover {
      background: #fafafa;
    }
    .waybill-cell {
      position: relative;
      padding-right: 90px;
    }
    .badge {
      position: absolute;
      top: 50%;
      right: 18px;
      transform: translateY(-50%);
      min-width: 22px;
      height: 22px;
      line-height: 22px;
      padding: 0 8px;
      border-radius: 11px;
      background: linear-gradient(135deg, #ff4d4f, #ff7a45);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 4px 12px rgba(255,77,79,0.18);
    }
    .badge-dot {
      width: 10px;
      height: 10px;
      padding: 0;
      border-radius: 50%;
    }
    .status {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      color: #595959;
      background: #f5f7fa;
    }
    .toolbar {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .toolbar button {
      border: none;
      background: #1890ff;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background .2s;
    }
    .toolbar button:hover {
      background: #096dd9;
    }
  </style>
</head>
<body>
  <div class="page-title">运单列表角标效果示例</div>
  <div class="toolbar">
    <button id="refreshBtn">刷新角标</button>
    <button id="randomBtn">随机更改运单角标</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>运单号</th>
          <th>收货人</th>
          <th>状态</th>
          <th>交付时间</th>
        </tr>
      </thead>
      <tbody id="waybillTable">
        <!-- rows injected by JS -->
      </tbody>
    </table>
  </div>
  <script>
    const waybills = [
      { id: 'WB20260525001', consignor: '张三', status: '待处理', eta: '05-25 14:30', badge: 3 },
      { id: 'WB20260525002', consignor: '李四', status: '运输中', eta: '05-25 17:10', badge: 0 },
      { id: 'WB20260525003', consignor: '王五', status: '待签收', eta: '05-25 19:00', badge: 2 },
      { id: 'WB20260525004', consignor: '赵六', status: '异常', eta: '05-25 16:00', badge: 1 },
      { id: 'WB20260525005', consignor: '钱七', status: '已完成', eta: '05-24 21:40', badge: 0 }
    ];

    const statusClass = {
      '待处理': '#fff7e6',
      '运输中': '#e6f7ff',
      '待签收': '#f6ffed',
      '异常': '#fff1f0',
      '已完成': '#f0f0f0'
    };

    const statusColor = {
      '待处理': '#d48806',
      '运输中': '#1890ff',
      '待签收': '#52c41a',
      '异常': '#cf1322',
      '已完成': '#595959'
    };

    const tbody = document.getElementById('waybillTable');
    const refreshBtn = document.getElementById('refreshBtn');
    const randomBtn = document.getElementById('randomBtn');

    function renderRows() {
      tbody.innerHTML = '';
      waybills.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="waybill-cell">
            ${item.id}
            ${item.badge > 0 ? `<span class="badge">${item.badge}</span>` : ''}
          </td>
          <td>${item.consignor}</td>
          <td><span class="status" style="background:${statusClass[item.status]};color:${statusColor[item.status]};">${item.status}</span></td>
          <td>${item.eta}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function refreshBadges() {
      // 模拟从后端拉取最新角标数据
      waybills.forEach(item => {
        const delta = Math.round((Math.random() - 0.4) * 2);
        item.badge = Math.max(0, item.badge + delta);
      });
      renderRows();
    }

    refreshBtn.addEventListener('click', renderRows);
    randomBtn.addEventListener('click', refreshBadges);

    renderRows();
  </script>
</body>
</html>
