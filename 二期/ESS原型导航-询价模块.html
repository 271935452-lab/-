<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESS 询价模块 · 原型导航</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #fff;
      --line: #e5e7eb;
      --text: #111827;
      --sub: #6b7280;
      --primary: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }
    .hub { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
    .hub h1 { margin: 0 0 8px; font-size: 24px; }
    .hub .intro {
      margin: 0 0 20px; color: var(--sub); font-size: 14px; line-height: 1.65;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
    }
    @media (max-width: 640px) { .links { grid-template-columns: 1fr; } }
    .links a {
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 0;
      border-bottom: 1px dashed #dbeafe;
    }
    .links a:hover { text-decoration: underline; }
    .links a .tag {
      display: inline-block;
      margin-left: 6px;
      font-size: 11px;
      color: #b45309;
      background: #fef3c7;
      padding: 1px 6px;
      border-radius: 999px;
    }
    .flow {
      margin-top: 4px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: 13px;
      color: #475569;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="hub">
    <h1>ESS 询价模块 · 原型导航</h1>
    <p class="intro">
      本目录为 ESS 询价 / 报价 MVP 原型。左侧菜单在各子页自动注入；从此页可快速跳转全部页面。
      散货（LCL）与整柜（FCL）在列表与询价编辑中通过 Tab 切换。
    </p>

    <section class="card">
      <h2>列表</h2>
      <div class="links">
        <a href="ESS我的报价-列表-MVP.html">我的报价（业务员）</a>
        <a href="ESS询价报价-报价员列表-MVP.html">询价报价（报价员）</a>
      </div>
    </section>

    <section class="card">
      <h2>询价</h2>
      <div class="links">
        <a href="ESS询价编辑-MVP.html">询价编辑（散货 / 整柜）</a>
        <a href="ESS询价编辑-MVP.html#fcl">询价编辑 · 整柜模式<span class="tag">FCL</span></a>
      </div>
    </section>

    <section class="card">
      <h2>详情</h2>
      <div class="links">
        <a href="ESS整柜询价详情-MVP.html">整柜 · 询价方案详情<span class="tag">FCL</span></a>
        <a href="ESS整柜报价详情-MVP.html">整柜 · 报价详情<span class="tag">FCL</span></a>
      </div>
    </section>

    <section class="card">
      <h2>报价编辑</h2>
      <div class="links">
        <a href="ESS整柜报价编辑-MVP.html">整柜 · 报价编辑<span class="tag">FCL</span></a>
      </div>
    </section>

    <div class="flow">
      <strong>推荐浏览顺序：</strong>
      业务员列表 → 询价编辑 → 报价员列表 → 整柜报价编辑 → 整柜询价详情 / 报价详情。
      列表页顶部可切换「散货 / 整柜」维度。
    </div>
  </main>
  <link rel="stylesheet" href="ess-prototype-nav.css" />
  <script src="ess-prototype-nav.js" defer></script>
</body>
</html>
