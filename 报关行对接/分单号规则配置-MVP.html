    return st === "on"
      ? '<span class="badge on">启用</span>'
      : '<span class="badge off">停用</span>';
  }

  function tplName(id) {
    var t = TEMPLATES.filter(function (x) { return x.id === id; })[0];
    return t ? t.name : id;
  }

  function filtered() {
    var c = document.getElementById("qCarrier").value;
    var p = document.getElementById("qPort").value;
    var s = document.getElementById("qStatus").value;
    var kw = (document.getElementById("qKw").value || "").trim().toLowerCase();
    return RULES.filter(function (r) {
      if (c && r.carrier !== c) return false;
      if (p && r.port !== p) return false;
      if (s && r.status !== s) return false;
      if (kw) {
        var blob = (r.tpl + " " + r.desc + " " + r.formula + " " + r.carrier + " " + r.port).toLowerCase();
        if (blob.indexOf(kw) < 0) return false;
      }
      return true;
    });
  }

  function renderTable() {
    var rows = filtered();
    var body = document.getElementById("ruleBody");
    body.innerHTML = rows.map(function (r) {
      var sel = r.id === selectedId ? " is-selected" : "";
      return '<tr class="' + sel + '" data-id="' + r.id + '">' +
        '<td><input type="radio" name="rulePick" ' + (r.id === selectedId ? "checked" : "") + ' /></td>' +
        "<td><strong>" + r.carrier + "</strong></td>" +
        "<td>" + r.port + "</td>" +
        '<td><span class="tpl-code">' + r.tpl + "</span><div style=\"color:#8c8c8c;font-size:11px;margin-top:2px\">" + tplName(r.tpl) + "</div></td>" +
        "<td>" + r.desc + "</td>" +
        '<td class="mono">' + r.formula.replace(/\\n/g, "<br/>") + "</td>" +
        "<td>" + statusBadge(r.status) + "</td>" +
        "</tr>";
    }).join("") || '<tr><td colspan="7" style="text-align:center;color:#8c8c8c;padding:24px">无匹配规则</td></tr>';
  }

  function renderTpls() {
    document.getElementById("tplList").innerHTML = TEMPLATES.map(function (t) {
      return '<div class="tpl-item"><strong>' + t.id + "</strong> " + t.name +
        '<div style="color:#8c8c8c;margin-top:2px">' + t.tip + "</div></div>";
    }).join("");
    var sel = document.getElementById("fTpl");
    sel.innerHTML = TEMPLATES.map(function (t) {
      return '<option value="' + t.id + '">' + t.id + " · " + t.name + "</option>";
    }).join("");
  }

  function getSelected() {
    return RULES.filter(function (r) { return r.id === selectedId; })[0] || null;
  }

  function generateByRule(rule, bl, total, cust) {
    var out = [];
    var tpl = rule.tpl;
    bl = (bl || "").trim();
    total = Math.max(1, parseInt(total, 10) || 1);

    if (rule.status === "off") {
      return { warn: true, lines: ["规则已停用，不会被自动生成命中。"] };
    }
    if (tpl === "T0") {
      return { warn: true, lines: ["需申请/手填：无自动公式。\\n请走申请池或「绑定分单号」。"] };
    }
    if (tpl === "T7") {
      return { ok: true, lines: ["模板 T7：分单号 = 客户单号\\n示例：票1…" + total + " → " + (cust || "（客户单号）")] };
    }

    for (var i = 0; i < total; i++) {
      var code = "";
      var note = "";
      if (tpl === "T1") {
        code = bl.slice(0, -1) + String(i);
        if (code.length !== bl.length) note = "（位数告警）";
      } else if (tpl === "T1b") {
        if (!/0$/.test(bl)) return { bad: true, lines: ["提单末位非 0，无法自动（需手填）。"] };
        code = bl.slice(0, -1) + String(i + 1);
      } else if (tpl === "T2" || tpl === "T2x") {
        if (tpl === "T2x" && i >= 26) {
          return { bad: true, lines: out.concat(["票" + (i + 1) + "：超出 A–Z，阻断自动"]) };
        }
        code = bl + LETTERS[i];
      } else if (tpl === "T2z") {
        code = (i + 1 === total) ? (bl + "Z") : (bl + LETTERS[i]);
        if (i + 1 === total) note = "（末票 Z）";
      } else if (tpl === "T3") {
        code = i === 0 ? bl : (bl + LETTERS[i - 1]);
      } else if (tpl === "T4") {
        code = i === 0 ? bl : (bl + String(i).padStart(2, "0"));
      } else if (tpl === "T5") {
        if (i === 0) code = bl;
        else code = bl.replace(/GLV/i, "") + "A" + String(i).padStart(2, "0");
      } else if (tpl === "T6") {
        code = bl.replace(/^EGLV/i, "") + LETTERS[i];
      } else {
        code = bl + "-" + (i + 1);
      }
      out.push("票" + (i + 1) + "：" + code + note);
    }
    return { ok: true, lines: ["命中 " + rule.carrier + " · " + rule.port + " · " + rule.tpl].concat(out) };
  }

  function runTry() {
    var rule = getSelected();
    var box = document.getElementById("tryOut");
    if (!rule) {
      box.className = "try-out warn";
      box.textContent = "请先选择一条规则。";
      return;
    }
    var res = generateByRule(
      rule,
      document.getElementById("tryBl").value,
      document.getElementById("tryTotal").value,
      document.getElementById("tryCust").value
    );
    box.className = "try-out" + (res.bad ? " bad" : res.warn ? " warn" : "");
    box.textContent = res.lines.join("\n");
  }

  function openEdit(rule, isNew) {
    editId = isNew ? null : rule.id;
    document.getElementById("editTitle").textContent = isNew ? "新增规则" : ("编辑规则 · " + rule.carrier + " / " + rule.port);
    document.getElementById("fCarrier").value = rule.carrier;
    document.getElementById("fPort").value = rule.port;
    document.getElementById("fTpl").value = rule.tpl;
    document.getElementById("fDesc").value = rule.desc;
    document.getElementById("fFormula").value = rule.formula.replace(/\\n/g, "\n");
    document.getElementById("fStart").value = rule.start;
    document.getElementById("fMax").value = rule.max;
    document.getElementById("fStatus").value = rule.status;
    document.getElementById("editMask").classList.add("open");
    document.getElementById("editMask").setAttribute("aria-hidden", "false");
  }

  function closeEdit() {
    document.getElementById("editMask").classList.remove("open");
    document.getElementById("editMask").setAttribute("aria-hidden", "true");
  }

  document.getElementById("ruleBody").addEventListener("click", function (e) {
    var tr = e.target.closest("tr[data-id]");
    if (!tr) return;
    selectedId = tr.getAttribute("data-id");
    renderTable();
  });

  document.getElementById("btnSearch").onclick = renderTable;
  ["qCarrier", "qPort", "qStatus"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", renderTable);
  });
  document.getElementById("qKw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") renderTable();
  });

  document.getElementById("btnAdd").onclick = function () {
    openEdit({
      carrier: "美森", port: "上海", mode: "auto", tpl: "T1", status: "on",
      desc: "", formula: "", start: 0, max: 0
    }, true);
  };
  document.getElementById("btnEdit").onclick = function () {
    var r = getSelected();
    if (!r) return toast("请先选择规则");
    openEdit(r, false);
  };
  document.getElementById("btnDup").onclick = function () {
    var r = getSelected();
    if (!r) return toast("请先选择规则");
    var copy = JSON.parse(JSON.stringify(r));
    copy.id = "r" + (Date.now() % 100000);
    copy.port = copy.port + "（副本）";
    copy.status = "off";
    RULES.unshift(copy);
    selectedId = copy.id;
    renderTable();
    toast("已复制为停用规则，可编辑后启用");
  };
  document.getElementById("btnToggle").onclick = function () {
    var r = getSelected();
    if (!r) return toast("请先选择规则");
    r.status = r.status === "on" ? "off" : "on";
    renderTable();
    toast(r.carrier + " · " + r.port + " 已" + (r.status === "on" ? "启用" : "停用"));
  };
  document.getElementById("btnTry").onclick = runTry;

  document.getElementById("editClose").onclick = closeEdit;
  document.getElementById("editCancel").onclick = closeEdit;
  document.getElementById("editMask").addEventListener("click", function (e) {
    if (e.target === document.getElementById("editMask")) closeEdit();
  });
  document.getElementById("editSave").onclick = function () {
    var payload = {
      carrier: document.getElementById("fCarrier").value,
      port: document.getElementById("fPort").value,
      tpl: document.getElementById("fTpl").value,
      desc: document.getElementById("fDesc").value.trim(),
      formula: document.getElementById("fFormula").value.trim().replace(/\n/g, "\\n"),
      start: parseInt(document.getElementById("fStart").value, 10) || 0,
      max: parseInt(document.getElementById("fMax").value, 10) || 0,
      status: document.getElementById("fStatus").value
    };
    if (!payload.desc) return toast("请填写规则说明");
    if (editId) {
      var r = RULES.filter(function (x) { return x.id === editId; })[0];
      Object.assign(r, payload);
      selectedId = editId;
      toast("已保存规则");
    } else {
      payload.id = "r" + (Date.now() % 100000);
      RULES.unshift(payload);
      selectedId = payload.id;
      toast("已新增规则");
    }
    closeEdit();
    renderTable();
  };

  renderTpls();
  renderTable();
})();
  </script>
</body>
</html>
