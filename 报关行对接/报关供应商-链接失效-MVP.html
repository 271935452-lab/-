<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>协作链接无效</title>
  <link rel="stylesheet" href="customs-supplier-portal.css" />
  <style>
    body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; background: #f0f2f5; min-height: 100vh; }
  </style>
</head>
<body data-cb-nav="off">
  <div class="sp-portal">
    <header class="sp-top">
      <div>
        <h1>报关资料协作</h1>
        <div class="meta">头程物流 · 报关行协作入口</div>
      </div>
    </header>
    <main class="sp-main">
      <div class="sp-expired">
        <h2>链接已失效或无权访问</h2>
        <p id="reason">该协作链接可能已过期、已被使用完成，或任务已改走 API 对接。请联系头程报关客服重新获取链接。</p>
        <p style="font-size:12px;color:rgba(0,0,0,.45)">无需注册账号；每次任务由头程方单独发放安全链接。</p>
      </div>
    </main>
  </div>
  <script>
    var r = new URLSearchParams(location.search).get("reason");
    if (r === "api") {
      document.getElementById("reason").textContent =
        "该报关行已启用 API 对接，请通过报关行系统回传资料，不再使用协作链接。";
    }
  </script>
</body>
</html>
