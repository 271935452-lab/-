<!doctype html>
<html lang="zh-CN" data-ess-app="mobile">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />
  <title>散货询价详情 · APP</title>
  <link rel="stylesheet" href="ess-app-mobile.css" />
  <style>
    :root {
      --bg: #f0f0f0;
      --card: #fff;
      --text: #111827;
      --sub: #9ca3af;
      --line: #e5e7eb;
      --primary: #2563eb;
      --green: #16a34a;
      --orange: #ea580c;
      --red: #dc2626;
      --gray: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
    }
    .app-hd {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .nav-row {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      height: 48px;
      padding: 0 8px;
    }
    .nav-row .back {
      border: none;
      background: none;
      font-size: 22px;
      color: var(--text);
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }
    .nav-row .title {
      margin: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }
    .nav-row .sub {
      text-align: right;
      font-size: 11px;
      color: var(--sub);
      line-height: 1.2;
    }
    .demo-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 12px;
      background: #fffbeb;
      border-bottom: 1px solid #fde68a;
      scrollbar-width: none;
    }
    .demo-bar::-webkit-scrollbar { display: none; }
    .demo-bar button {
      flex-shrink: 0;
      border: 1px solid #fcd34d;
      background: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      color: #92400e;
    }
    .demo-bar button.active {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #fff;
    }
    .basic {
      background: var(--card);
      padding: 14px;
      margin-top: 10px;
    }
    .basic-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .basic-row + .basic-row { margin-top: 8px; }
    .route {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }
    .status {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 600;
    }
    .status.s-pending { color: var(--orange); }
    .status.s-reject { color: var(--red); }
    .status.s-quoted { color: var(--green); }
    .status.s-done { color: var(--gray); }
    .cargo { font-size: 14px; color: var(--text); }
    .meta-line { font-size: 12px; color: var(--sub); line-height: 1.55; }
    .reject-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      font-size: 13px;
      color: #991b1b;
      line-height: 1.55;
    }
    .hidden { display: none !important; }
    .hero {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 0 12px 10px;
      background: var(--card);
    }
    .hero-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      min-width: 0;
    }
    .hero-card:nth-child(1) { background: #fff7ed; }
    .hero-card:nth-child(2) { background: #f5f3ff; }
    .hero-card:nth-child(3) { background: #ecfeff; }
    .hero-card .k { font-size: 11px; color: var(--sub); }
    .hero-card .v {
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hero-card .m {
      font-size: 11px;
      color: var(--sub);
      margin-top: 2px;
      line-height: 1.45;
    }
    .tip-box {
      margin: 10px 12px 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      font-size: 12px;
      color: #1d4ed8;
      line-height: 1.6;
    }
    .tip-box.warn {
      background: #fff7ed;
      border-color: #fdba74;
      color: #9a3412;
    }
    .tip-box.ok {
      background: #f0fdf4;
      border-color: #86efac;
      color: #166534;
    }
    .sec {
      margin: 10px 12px;
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.06);
    }
    .sec-hd {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
      font-weight: 600;
    }
    .empty-quote {
      padding: 32px 16px;
      text-align: center;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.65;
    }
    .qcard {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .qcard:last-child { border-bottom: none; }
    .qcard.picked { background: #f8fbff; box-shadow: inset 3px 0 0 var(--primary); }
    .qcard.locked { background: #f0fdf4; box-shadow: inset 3px 0 0 var(--green); cursor: default; }
    .qcard.dim { opacity: 0.55; cursor: default; }
    .qhd {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .qhd input { margin-top: 3px; flex-shrink: 0; }
    .qname { font-size: 14px; font-weight: 600; line-height: 1.45; }
    .tag-ch {
      display: inline-block;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      vertical-align: middle;
    }
    .tag-ok {
      display: inline-block;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #86efac;
      vertical-align: middle;
    }
    .cheap {
      display: inline-block;
      margin-left: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
    }
    .qmeta { font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
    .price-unit {
      margin-top: 10px;
      max-width: 200px;
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff7ed;
      border: 2px solid #f97316;
    }
    .price-unit .lab { font-size: 11px; color: var(--sub); font-weight: 600; }
    .price-unit .num {
      font-size: 26px;
      font-weight: 800;
      color: #c2410c;
      line-height: 1.15;
      margin-top: 2px;
    }
    .page-tabs {
      display: flex;
      background: var(--card);
      margin-top: 10px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .page-tab {
      flex: 1;
      border: none;
      background: none;
      padding: 12px 8px;
      font: inherit;
      font-size: 15px;
      color: var(--sub);
      cursor: pointer;
      position: relative;
    }
    .page-tab.active { color: var(--primary); font-weight: 600; }
    .page-tab.active::after {
      content: "";
      position: absolute;
      left: 25%;
      right: 25%;
      bottom: 0;
      height: 2px;
      background: var(--primary);
    }
    .panel { display: none; padding: 10px 12px; }
    .panel.active { display: block; }
    .timeline {
      background: var(--card);
      border-radius: 10px;
      padding: 14px;
    }
    .tl-item {
      position: relative;
      padding-left: 18px;
      padding-bottom: 16px;
    }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-item::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }
    .tl-item.pending::before { background: #cbd5e1; }
    .tl-item::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 18px;
      bottom: 0;
      width: 2px;
      background: var(--line);
    }
    .tl-item:last-child::after { display: none; }
    .tl-item .name { font-size: 14px; font-weight: 600; }
    .tl-item .time { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .footer-bar {
      position: relative;
      display: flex;
      gap: 10px;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 8px 12px;
    }
    .footer-bar button {
      flex: 1;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }
    .footer-bar .secondary { background: #f3f4f6; color: var(--text); }
    .footer-bar .primary { background: var(--primary); color: #fff; font-weight: 600; }
    .footer-bar .primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .footer-bar.is-hidden { display: none; }
    .mini-toast {
      position: fixed;
      left: 50%;
      bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 20px);
      opacity: 0;
      background: rgba(26, 29, 36, 0.88);
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform .3s, opacity .3s;
      pointer-events: none;
      z-index: 80;
    }
    .mini-toast.show { transform: translate(-50%, 0); opacity: 1; }
    @media (max-width: 360px) {
      .hero { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="app-hd">
    <div class="nav-row">
      <button type="button" class="back" id="btnBack" aria-label="返回">‹</button>
      <h1 class="title">询价详情</h1>
      <span class="sub" id="pageNo">—</span>
    </div>
    <div class="demo-bar" aria-label="演示状态切换">
      <button type="button" data-state="pending">待报价</button>
      <button type="button" data-state="reject">已打回</button>
      <button type="button" data-state="quoted" class="active">已报价</button>
      <button type="button" data-state="done">已完结</button>
    </div>
  </header>

  <section class="basic" aria-label="基本信息">
    <div class="basic-row">
      <div class="route" id="basicRoute">(美国)92374</div>
      <div class="status s-quoted" id="basicStatus">人工已报价</div>
    </div>
    <div class="basic-row">
      <div class="cargo" id="basicCargo">625KG * 2.50m³</div>
    </div>
    <div class="basic-row">
      <div class="meta-line" id="basicMeta">义乌总仓 · 散货(LCL) · 询价员：王报价</div>
    </div>
    <div class="reject-box hidden" id="rejectBox"></div>
  </section>

  <div class="hero">
    <div class="hero-card">
      <div class="k">交货仓</div>
      <div class="v" id="heroWh">义乌总仓</div>
      <div class="m">国内交货</div>
    </div>
    <div class="hero-card">
      <div class="k">目的地</div>
      <div class="v" id="heroDest">92374</div>
      <div class="m" id="heroDestSub">美国 · US</div>
    </div>
    <div class="hero-card">
      <div class="k">货量</div>
      <div class="v" id="heroWt">625 KG</div>
      <div class="m" id="heroVol">2.50 m³</div>
    </div>
  </div>

  <div class="tip-box" id="tipBox">报价员核对确认后，各渠道单价将显示于此。多渠道请单选后再确认。</div>

  <div class="page-tabs" role="tablist">
    <button type="button" class="page-tab active" data-panel="quotes" role="tab">报价信息</button>
    <button type="button" class="page-tab" data-panel="follow" role="tab">跟进记录</button>
  </div>

  <section class="panel active" id="panelQuotes" aria-label="报价信息">
    <div class="sec">
      <div class="sec-hd">渠道报价 · 单选确认</div>
      <div id="quoteList"></div>
    </div>
  </section>

  <section class="panel" id="panelFollow" aria-label="跟进记录">
    <div class="timeline" id="timeline"></div>
  </section>

  <footer class="footer-bar" id="footerBar">
    <button type="button" class="primary" id="btnConfirm">确认报价</button>
  </footer>

  <div class="mini-toast" id="miniToast" aria-live="polite"></div>

  <script>
    (function () {
      var CASES = {
        XJ1779516168576: {
          route: "(美国)92374",
          cargo: "625KG * 2.50m³",
          wh: "义乌总仓",
          dest: "92374",
          destSub: "Redlands, CA · 商业有卸货台",
          wt: "625 KG",
          vol: "2.50 m³",
          clerk: "王报价",
          reject: "",
          quotes: [
            { id: "SP-LA-LCL", channel: "中美快运私人卡派(洛杉矶)", unit: 5, cheap: true, valid: "2026-05-20 至 2026-05-27" },
            { id: "SP-OAK-LCL", channel: "中美快运私人卡派(奥克兰)", unit: 7, cheap: false, valid: "2026-05-20 至 2026-05-27" },
            { id: "SP-LA-AIR", channel: "美国空派 LAX", unit: 9, cheap: false, valid: "2026-05-20 至 2026-05-27" }
          ]
        },
        XJ1774402551939: {
          route: "(美国)74532-9865",
          cargo: "12.54KG * 1.042m³",
          wh: "福永仓",
          dest: "74532-9865",
          destSub: "美国 · US",
          wt: "12.54 KG",
          vol: "1.042 m³",
          clerk: "王报价",
          reject: "",
          quotes: [
            { id: "SP-LA-LCL", channel: "中美快运私人卡派(洛杉矶)", unit: 6, cheap: true, valid: "2026-10-17 至 2026-10-24" }
          ]
        },
        XJ1778226168576: {
          route: "(美国)61604",
          cargo: "1200KG * 8.00m³",
          wh: "宁波仓",
          dest: "61604",
          destSub: "Belleville, IL · 住宅",
          wt: "1200 KG",
          vol: "8.00 m³",
          clerk: "待分配",
          reject: "",
          quotes: []
        },
        XJ1777001234567: {
          route: "(美国)92374",
          cargo: "87KG * 1.20m³",
          wh: "福永仓",
          dest: "92374",
          destSub: "美国 · US",
          wt: "87 KG",
          vol: "1.20 m³",
          clerk: "王报价",
          reject: "产品打回：请补充带电说明",
          quotes: []
        },
        XJ1776001111222: {
          route: "(美国)92374",
          cargo: "45KG * 0.35m³",
          wh: "义乌总仓",
          dest: "92374",
          destSub: "美国 · US",
          wt: "45 KG",
          vol: "0.35 m³",
          clerk: "王报价",
          reject: "",
          quotes: [
            { id: "SP-LA-LCL", channel: "中美快运私人卡派(洛杉矶)", unit: 32.5, cheap: true, valid: "2026-05-10 至 2026-05-17" }
          ],
          confirmedId: "SP-LA-LCL"
        }
      };

      var STATUS_MAP = {
        pending: { text: "待报价", cls: "s-pending" },
        reject: { text: "已打回", cls: "s-reject" },
        quoted: { text: "人工已报价", cls: "s-quoted" },
        done: { text: "已完结", cls: "s-done" }
      };

      var TIMELINE = {
        pending: [
          { name: "创建询价", time: "05-22 08:30", who: "操作人：张立明" },
          { name: "发起询价", time: "05-22 08:31", who: "等待报价员接单" },
          { name: "待报价", time: "—", who: "报价员尚未回传", pending: true }
        ],
        reject: [
          { name: "创建询价", time: "05-18 14:22", who: "操作人：张立明" },
          { name: "发起询价", time: "05-18 14:23", who: "操作人：张立明" },
          { name: "产品打回", time: "05-18 15:10", who: "操作人：王报价" }
        ],
        quoted: [
          { name: "创建询价", time: "05-20 09:15", who: "操作人：张立明" },
          { name: "发起询价", time: "05-20 09:16", who: "操作人：张立明" },
          { name: "报价员核对回传", time: "05-20 10:02", who: "操作人：袁华君" }
        ],
        done: [
          { name: "创建询价", time: "05-10 16:00", who: "操作人：张立明" },
          { name: "报价员核对回传", time: "05-11 09:20", who: "操作人：袁华君" },
          { name: "业务员确认报价", time: "05-11 10:05", who: "操作人：张立明" },
          { name: "已完结", time: "05-12 16:00", who: "已复制给客户" }
        ]
      };

      var xjId = (new URLSearchParams(location.search).get("xj") || "XJ1779516168576").trim();
      var caseData = CASES[xjId] || CASES.XJ1779516168576;
      var currentState = "quoted";
      var pickId = "";
      var bizConfirmed = false;

      function showToast(text) {
        var el = document.getElementById("miniToast");
        el.textContent = text;
        el.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () { el.classList.remove("show"); }, 2200);
      }

      function bindCase() {
        document.getElementById("pageNo").textContent = xjId.slice(-6);
        document.getElementById("basicRoute").textContent = caseData.route;
        document.getElementById("basicCargo").textContent = caseData.cargo;
        document.getElementById("basicMeta").textContent = caseData.wh + " · 散货(LCL) · 询价员：" + caseData.clerk;
        document.getElementById("heroWh").textContent = caseData.wh;
        document.getElementById("heroDest").textContent = caseData.dest;
        document.getElementById("heroDestSub").textContent = caseData.destSub;
        document.getElementById("heroWt").textContent = caseData.wt;
        document.getElementById("heroVol").textContent = caseData.vol;
        document.getElementById("rejectBox").textContent = caseData.reject ? "打回原因：" + caseData.reject : "";
        if (caseData.confirmedId) {
          bizConfirmed = true;
          pickId = caseData.confirmedId;
        }
      }

      function initPick() {
        var quotes = caseData.quotes || [];
        if (!pickId && quotes.length) {
          var cheap = quotes.find(function (q) { return q.cheap; });
          pickId = cheap ? cheap.id : quotes[0].id;
        }
      }

      function renderQuotes() {
        var list = document.getElementById("quoteList");
        var tip = document.getElementById("tipBox");
        var quotes = caseData.quotes || [];

        if (currentState === "pending") {
          list.innerHTML = '<div class="empty-quote">报价员尚未核对确认，本页暂无单价。<br />请稍后在列表刷新，或联系报价员。</div>';
          tip.className = "tip-box warn";
          tip.textContent = "当前仍为「待报价」：AI / 报价员核对过程业务员无感知，确认前不展示单价。";
          return;
        }
        if (currentState === "reject") {
          list.innerHTML = '<div class="empty-quote">询价已打回，请编辑后重新提交。</div>';
          tip.className = "tip-box warn";
          tip.textContent = "打回后需补充资料并重新发起询价。";
          return;
        }
        if (!quotes.length) {
          list.innerHTML = '<div class="empty-quote">暂无渠道报价。</div>';
          tip.className = "tip-box warn";
          tip.textContent = "暂无报价数据。";
          return;
        }

        if (bizConfirmed || currentState === "done") {
          tip.className = "tip-box ok";
          tip.textContent = "已确认 1 条渠道报价。绑定运单由报价员在报价员详情完成。";
        } else {
          tip.className = "tip-box";
          tip.textContent = quotes.length > 1
            ? "报价员已回传 " + quotes.length + " 条渠道价，请单选 1 条后确认。"
            : "报价员已回传 1 条渠道价，确认即可。";
        }

        list.innerHTML = quotes.map(function (q) {
          var selected = q.id === pickId;
          var cls = "qcard";
          if (bizConfirmed || currentState === "done") cls += selected ? " locked" : " dim";
          else if (selected) cls += " picked";
          var radio = (bizConfirmed || currentState === "done")
            ? ""
            : '<input type="radio" name="chPick"' + (selected ? " checked" : "") + ' aria-label="选择渠道" />';
          return (
            '<div class="' + cls + '" data-id="' + q.id + '">' +
              '<div class="qhd">' + radio +
                '<div><div class="qname">' + q.channel +
                  '<span class="tag-ch">销售产品</span>' +
                  (selected && (bizConfirmed || currentState === "done") ? '<span class="tag-ok">已确认</span>' : "") +
                  (q.cheap ? '<span class="cheap">本票最便宜</span>' : "") +
                '</div>' +
                '<div class="qmeta">有效期 ' + q.valid + "</div></div>" +
              "</div>" +
              '<div class="price-unit"><div class="lab">单价（USD/KG）</div><div class="num">USD ' + q.unit + "</div></div>" +
            "</div>"
          );
        }).join("");

        if (!bizConfirmed && currentState === "quoted") {
          list.querySelectorAll(".qcard").forEach(function (card) {
            card.addEventListener("click", function () {
              pickId = card.getAttribute("data-id");
              renderQuotes();
              renderFooter();
            });
          });
        }
      }

      function renderTimeline() {
        var items = TIMELINE[currentState] || [];
        document.getElementById("timeline").innerHTML = items.map(function (item) {
          return (
            '<div class="tl-item' + (item.pending ? " pending" : "") + '">' +
              '<div class="name">' + item.name + "</div>" +
              '<div class="time">' + item.time + (item.who ? " · " + item.who : "") + "</div>" +
            "</div>"
          );
        }).join("");
      }

      function renderFooter() {
        var bar = document.getElementById("footerBar");
        bar.classList.remove("is-hidden");

        if (currentState === "reject") {
          bar.innerHTML =
            '<button type="button" class="secondary" data-action="edit">编辑询价</button>' +
            '<button type="button" class="primary" data-action="resubmit">重新提交</button>';
          return;
        }
        if (currentState === "pending") {
          bar.innerHTML = '<button type="button" class="primary" disabled>待报价</button>';
          return;
        }
        if (currentState === "done" || bizConfirmed) {
          bar.classList.add("is-hidden");
          bar.innerHTML = "";
          return;
        }
        bar.innerHTML = '<button type="button" class="primary" data-action="confirm"' + (pickId ? "" : " disabled") + ">确认报价</button>";
      }

      function goEdit() {
        location.href = "../产品部门/报价组/ESS询价编辑-APP-散货-MVP.html#lcl";
      }

      function applyState(state) {
        if (!STATUS_MAP[state]) state = "quoted";
        currentState = state;
        if (state === "done" && caseData.confirmedId) {
          bizConfirmed = true;
          pickId = caseData.confirmedId;
        }
        var st = STATUS_MAP[state];
        var statusEl = document.getElementById("basicStatus");
        statusEl.textContent = st.text;
        statusEl.className = "status " + st.cls;
        document.getElementById("rejectBox").classList.toggle("hidden", state !== "reject");
        document.querySelectorAll(".demo-bar button").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-state") === state);
        });
        renderQuotes();
        renderTimeline();
        renderFooter();
        try { history.replaceState(null, "", location.pathname + location.search + "#" + state); } catch (_) {}
      }

      document.querySelectorAll(".page-tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          document.querySelectorAll(".page-tab").forEach(function (t) { t.classList.remove("active"); });
          document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
          tab.classList.add("active");
          document.getElementById("panel" + (tab.getAttribute("data-panel") === "follow" ? "Follow" : "Quotes")).classList.add("active");
        });
      });

      document.querySelectorAll(".demo-bar button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (caseData.confirmedId && btn.getAttribute("data-state") === "quoted") {
            bizConfirmed = false;
            pickId = caseData.confirmedId;
          }
          applyState(btn.getAttribute("data-state"));
        });
      });

      document.getElementById("footerBar").addEventListener("click", function (e) {
        var action = e.target.getAttribute("data-action");
        if (!action) return;
        if (action === "edit") {
          goEdit();
          return;
        }
        if (action === "resubmit") {
          alert("【MVP演示】重新提交散货询价");
          return;
        }
        if (action === "confirm") {
          var q = (caseData.quotes || []).find(function (x) { return x.id === pickId; });
          if (!q) return;
          bizConfirmed = true;
          applyState("done");
          showToast("已确认：" + q.channel + " · USD " + q.unit + "/KG");
        }
      });

      document.getElementById("btnBack").addEventListener("click", function () {
        location.href = "ESS询价报价-APP-列表-MVP.html#lcl";
      });

      bindCase();
      initPick();
      var hash = (location.hash || "").replace("#", "");
      applyState(STATUS_MAP[hash] ? hash : (caseData.confirmedId ? "done" : (caseData.quotes.length ? "quoted" : "pending")));
    })();
  </script>

    <span class="ess-prd-chip">PRD · 散货询价详情 · APP</span>
  </div>
