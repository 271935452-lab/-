<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仓库 PDA · 首页（MVP）</title>
  <link rel="stylesheet" href="wh-pda-common.css" />
  <style>
    .proto-wrap { max-width: 520px; margin: 0 auto; padding: 16px 12px 72px; }
    .proto-wrap .proto-head { margin-bottom: 12px; }
    .proto-wrap .proto-head h1 { font-size: 18px; }
    .proto-wrap .proto-head p { font-size: 13px; }
    .phone-shell { max-width: 100%; }
    .phone-inner { height: min(720px, calc(100vh - 100px)); }
  </style>
</head>
<body>
  <div class="proto-wrap">
    <div class="proto-head">
      <h1>仓库 PDA · 工作台首页</h1>
      <p>托上件数相关入口已高亮；点击图标进入对应原型页。</p>
    </div>

    <div class="phone-shell">
      <div class="phone-inner">
        <div class="status-bar"><span>11:06</span><span>PDA</span></div>
        <header class="app-header">
          <span></span>
          <h1 class="title">首页</h1>
          <span></span>
        </header>

        <div class="pda-home-screen">
          <div class="menu-section">
            <div class="menu-grid" style="padding-top:8px">
              <a class="menu-item is-active" href="签入上托-托上件数-MVP.html">
                <span class="menu-ico">📥</span>
                签入上托
              </a>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="手动签入">手动签入</button>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="无运单登记">无运单登记</button>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="收货尺寸复核">收货尺寸复核</button>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="出货尺寸复核">出货尺寸复核</button>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="运单查询">运单查询</button>
            </div>
          </div>

          <div class="menu-section">
            <div class="menu-section-hd">在库管理</div>
            <div class="menu-grid">
              <a class="menu-item is-active" href="下托-件数核对-MVP.html">
                <span class="menu-ico">📤</span>
                下托
              </a>
              <a class="menu-item is-active" href="正常上托-件数核对-MVP.html">
                <span class="menu-ico">📋</span>
                正常上托
              </a>
              <a class="menu-item is-active" href="换托-件数核对-MVP.html">
                <span class="menu-ico">🔄</span>
                换托
              </a>
              <a class="menu-item is-active" href="找货核对扫描-件数核对-MVP.html">
                <span class="badge-new">件</span>
                <span class="menu-ico">🔍</span>
                找货核对扫描
              </a>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="找货核对扫描F">找货核对扫描F</button>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="找货核对扫描K">找货核对扫描K</button>
            </div>
          </div>

          <div class="menu-section">
            <div class="menu-section-hd">出库</div>
            <div class="menu-grid">
              <a class="menu-item is-active" href="装柜扫描-件数核对-MVP.html">
                <span class="badge-new">件</span>
                <span class="menu-ico">📦</span>
                装柜扫描
              </a>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="装柜扫描F">装柜扫描F</button>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="装柜扫描K">装柜扫描K</button>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="装柜完成">装柜完成</button>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="按票出库扫描">按票出库扫描</button>
              <button type="button" class="menu-item is-disabled" data-wh-pda-stub="换单登记">换单登记</button>
            </div>
          </div>
        </div>

        <nav class="pda-tabbar" aria-label="底部导航">
          <button type="button" class="pda-tab is-active" data-href="仓库PDA-首页-MVP.html">
            <span class="tab-ico">🏠</span>
            工作台
          </button>
          <button type="button" class="pda-tab is-disabled" data-wh-pda-stub="今日总览">
            <span class="tab-ico">📊</span>
            今日总览
          </button>
          <button type="button" class="pda-tab is-disabled" data-wh-pda-stub="个人中心">
            <span class="tab-ico">👤</span>
            个人中心
          </button>
        </nav>
      </div>
    </div>
  </div>

  <script src="wh-pda-nav.js"></script>
</body>
</html>
