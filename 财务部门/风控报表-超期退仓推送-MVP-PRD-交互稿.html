<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>超期退仓 RISK-006 · PRD（逐点交互稿）</title>
  <style>
    :root { --line: #e2e8f0; --text: #0f172a; --sub: #64748b; --blue: #2563eb; --pin: #ff8a00; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 14px/1.65 "Microsoft YaHei", sans-serif;
      color: var(--text); background: #f8fafc;
    }
    a { color: var(--blue); }
    .page { max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; }
    .hero {
      background: linear-gradient(135deg, #1e3a5f, #2563eb); color: #fff;
      border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
    }
    .hero h1 { margin: 0 0 8px; font-size: 20px; }
    .hero p { margin: 0; font-size: 13px; opacity: .95; line-height: 1.6; }
    .hero a { color: #fff; }
    .callout {
      background: #fff7ed; border: 1px solid #fdba74; border-radius: 8px;
      padding: 10px 12px; font-size: 13px; margin-bottom: 14px; line-height: 1.6;
    }
    h2.sec { font-size: 17px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
    .point {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px; margin: 10px 0; cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .point:hover { border-color: #cbd5e1; }
    .point.is-active, .point:target {
      border-color: var(--pin); box-shadow: 0 0 0 2px rgba(255, 138, 0, .22);
    }
    .point h3 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .pin-no {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 26px; height: 26px; border-radius: 50%; background: var(--pin); color: #fff;
      font-size: 13px; font-weight: 700; flex: none;
    }
    .kind {
      display: inline-block; font-size: 11px; color: #2a6bbd; background: #eff6ff;
      padding: 3px 8px; border-radius: 4px; margin-bottom: 8px;
    }
    .sum { margin: 0 0 8px; color: var(--sub); font-size: 13px; }
    .detail-wrap { display: none; margin-top: 8px; }
    .point.is-open .detail-wrap, .point:target .detail-wrap { display: block; }
    .detail { display: grid; grid-template-columns: 52px 1fr; gap: 6px 10px; font-size: 13px; margin: 4px 0; }
    .detail b { color: #475569; }
    .detail p { margin: 0; }
    .feat-page {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px; margin: 10px 0 16px;
    }
    .feat-page h4 { margin: 0 0 8px; font-size: 15px; }
    .feat-page ul { margin: 8px 0 0; padding-left: 1.25em; font-size: 13px; }
    .foot { text-align: center; font-size: 12px; color: var(--sub); margin-top: 20px; }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1>超期退仓 RISK-006 · PRD（逐点交互稿）</h1>
      <p>
        编号与原型页橙色数字一致。推荐用
        <a href="超期退仓-完整交互原型.html">完整交互原型</a>：点页面数字，右侧展开本条说明。
        开发与测试以本文逐点为准；历史长稿/skill 版不再从导航入口维护。
      </p>
    </header>

    <p class="callout">
      橙色数字与 <a href="超期退仓-完整交互原型.html">完整交互原型</a> 一致；每页编号从 <strong>1</strong> 连续递增。
      点击逐点条目展开「为啥做 / 页面上 / 系统里」；地址栏 <code>#note-searchBar</code> 可直达锚点。
    </p>

    <h2 class="sec" id="feature">功能说明</h2>
    <div id="featurePages"></div>

    <h2 class="sec" id="dev-points">逐点开发说明</h2>

    <h3 class="sec" style="font-size:15px;margin-top:0" id="push">推送列表</h3>
    <div id="pushPoints"></div>

    <h3 class="sec" style="font-size:15px" id="cfg">规则配置</h3>
    <div id="cfgPoints"></div>

    <p class="foot">与 risk006-review-points.js 同步 · 编号按页连续 1…n</p>
  </div>

  <script src="risk006-review-points.js"></script>
  <script>
(function () {
  var labels = ["为啥做", "页面上", "系统里"];
  var points = window.RISK006_REVIEW_POINTS || [];

  function renderFeatures() {
    var box = document.getElementById("featurePages");
    if (!box) return;
    var pages = window.RISK006_FEATURE_PAGES || [];
    box.innerHTML = pages.map(function (f) {
      return "<div class=\"feat-page\" id=\"feature-page-" + f.page + "\">" +
        "<h4>" + f.title + "</h4>" +
        "<p class=\"sum\">" + (f.summary || "") + "</p>" +
        "<ul>" + (f.bullets || []).map(function (b) { return "<li>" + b + "</li>"; }).join("") + "</ul></div>";
    }).join("");
  }

  function render(elId, page) {
    var box = document.getElementById(elId);
    if (!box) return;
    var pinIds = (window.RISK006_REVIEW_PIN_IDS || {})[page] || [];
    var byId = {};
    points.forEach(function (p) { if (p.page === page) byId[p.id] = p; });
    box.innerHTML = pinIds.map(function (id) {
      var p = byId[id];
      if (!p) return "";
      var title = (p.title || "").replace(/^[①②③④⑤⑥⑦⑧⑩⑪⑫⑬⑭⑮⑯⑰⑱]\s*/, "");
      return "<article class=\"point\" id=\"note-" + p.id + "\" tabindex=\"0\">" +
        "<h3><span class=\"pin-no\">" + p.pin + "</span>" + title + "</h3>" +
        "<div class=\"kind\">" + p.kind + "</div>" +
        "<p class=\"sum\">" + (p.summary || "") + "</p>" +
        "<div class=\"detail-wrap\">" +
        labels.map(function (k, i) {
          return "<div class=\"detail\"><b>" + k + "</b><p>" + (p.body[i] || "—") + "</p></div>";
        }).join("") +
        "<p style=\"margin:8px 0 0;font-size:11px;color:#94a3b8\">锚点 id：<code>" + p.id + "</code></p>" +
        "</div></article>";
    }).join("");
  }

  renderFeatures();

  function openPoint(id, scroll) {
    document.querySelectorAll(".point").forEach(function (p) {
      var on = p.id === "note-" + id;
      p.classList.toggle("is-open", on);
      p.classList.toggle("is-active", on);
    });
    if (scroll) {
      var el = document.getElementById("note-" + id);
      if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  function bindClick(container) {
    container.addEventListener("click", function (e) {
      var art = e.target.closest(".point");
      if (!art) return;
      var id = art.id.replace(/^note-/, "");
      var wasOpen = art.classList.contains("is-open");
      document.querySelectorAll(".point").forEach(function (p) {
        p.classList.remove("is-open", "is-active");
      });
      if (!wasOpen) openPoint(id, false);
      history.replaceState(null, "", "#note-" + id);
    });
  }

  render("pushPoints", 0);
  render("cfgPoints", 1);
  bindClick(document.getElementById("pushPoints"));
  bindClick(document.getElementById("cfgPoints"));

  function fromHash() {
    var h = (location.hash || "").replace(/^#/, "");
    if (h.indexOf("note-") === 0) {
      openPoint(h.slice(5), true);
    }
  }
  fromHash();
  window.addEventListener("hashchange", fromHash);
})();
  </script>
</body>
</html>
