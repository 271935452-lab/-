<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>唐斌看板专题 · MVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* 参考 Stripe Dashboard / Mercury 财务看板：一层主指标 + KPI 卡 + 疏朗图表网格 */
    :root {
      --ink: #0c1222;
      --text: #1a2332;
      --sub: #64748b;
      --muted: #94a3b8;
      --line: #e2e8f0;
      --line-soft: #f1f5f9;
      --card: #ffffff;
      --teal: #0f766e;
      --teal-soft: #ecfdf8;
      --blue: #0369a1;
      --amber: #c2410c;
      --green: #15803d;
      --red: #b91c1c;
      --shadow: 0 1px 2px rgba(15, 23, 42, .05);
      --radius: 12px;
      --font: "Plus Jakarta Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); font: 13px/1.5 var(--font);
      background:
        radial-gradient(1200px 480px at 8% -10%, rgba(15, 118, 110, .09), transparent 55%),
        radial-gradient(900px 420px at 100% 0%, rgba(3, 105, 161, .07), transparent 50%),
        linear-gradient(180deg, #f7f9fc 0%, #eef2f7 100%);
    }
    .topnav {
      height: 48px; display: flex; align-items: center; gap: 14px;
      padding: 0 20px; background: rgba(12, 18, 34, .94); color: #e2e8f0;
      backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20;
    }
    .topnav .brand { font-weight: 800; letter-spacing: -.02em; font-size: 14px; color: #fff; }
    .topnav .crumb { font-size: 12px; color: #94a3b8; }
    .topnav a { color: #99f6e4; text-decoration: none; font-size: 12px; font-weight: 600; }
    .topnav .right { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 11px; color: #94a3b8; }
    .layout { max-width: 1440px; margin: 0 auto; padding: 20px 20px 48px; }
    .page-hd {
      display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
      gap: 12px; margin-bottom: 16px;
    }
    .page-hd h1 {
      margin: 0 0 4px; font-size: 26px; font-weight: 800; letter-spacing: -.03em; color: var(--ink);
    }
    .page-hd .meta { margin: 0; font-size: 12px; color: var(--sub); max-width: 640px; line-height: 1.55; }
    .mode-switch {
      display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
      background: #fff; margin-bottom: 8px;
    }
    .mode-switch button {
      border: 0; background: #fff; padding: 8px 14px; font: inherit; font-weight: 700;
      font-size: 12px; color: var(--sub); cursor: pointer;
    }
    .mode-switch button.on { background: var(--ink); color: #fff; }
    .hd-aside { text-align: right; }
    .src-tag {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 6px;
      font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 8px;
      background: var(--card); color: var(--sub); border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .src-tag::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--teal);
    }
    .updated { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .panel {
      background: rgba(255,255,255,.72); border: 1px solid var(--line);
      border-radius: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
      backdrop-filter: blur(10px); overflow: hidden;
    }
    .main-tabs {
      display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 10px 0;
      border-bottom: 1px solid var(--line); background: rgba(248, 250, 252, .9);
    }
    .main-tab {
      padding: 12px 14px; border: none; background: none; font: inherit;
      font-size: 13px; font-weight: 600; color: var(--sub); cursor: pointer; position: relative;
      border-radius: 8px 8px 0 0; transition: color .15s, background .15s;
    }
    .main-tab:hover { color: var(--ink); background: rgba(15, 118, 110, .04); }
    .main-tab.active { color: var(--teal); }
    .main-tab.active::after {
      content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px;
      height: 2px; background: var(--teal); border-radius: 2px 2px 0 0;
    }
    .sub-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 0; }
    .sub-tab {
      padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; font: inherit; font-size: 12px; font-weight: 600; color: var(--sub); cursor: pointer;
      transition: .15s;
    }
    .sub-tab:hover { border-color: #cbd5e1; color: var(--ink); }
    .sub-tab.active {
      border-color: transparent; color: #fff; background: var(--ink);
    }
    .filter-bd { padding: 12px 16px 8px; }
    .filter-grid {
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px 12px; padding: 12px; border: 1px solid var(--line-soft);
      border-radius: 12px; background: var(--line-soft);
    }
    @media (max-width: 1100px) { .filter-grid { grid-template-columns: repeat(3, 1fr); } }
    .filter-item label {
      display: block; font-size: 11px; font-weight: 600; color: var(--muted);
      margin-bottom: 5px; letter-spacing: .02em; text-transform: none;
    }
    .filter-item input, .filter-item select {
      width: 100%; height: 34px; border: 1px solid var(--line);
      border-radius: 8px; padding: 0 10px; font: inherit; background: #fff; color: var(--text);
    }
    .filter-item input:focus, .filter-item select:focus {
      outline: none; border-color: #5eead4; box-shadow: 0 0 0 3px rgba(15, 118, 110, .12);
    }
    .filter-actions {
      padding: 0 16px 12px; display: flex; gap: 8px; justify-content: flex-end;
    }
    .btn {
      height: 34px; padding: 0 14px; border-radius: 8px; font: inherit; font-weight: 600;
      border: 1px solid var(--line); background: #fff; color: var(--text); cursor: pointer;
    }
    .btn:hover { background: var(--line-soft); }
    .btn-primary {
      background: var(--ink); border-color: var(--ink); color: #fff;
    }
    .btn-primary:hover { background: #1e293b; border-color: #1e293b; color: #fff; }
    .note-box {
      margin: 12px 16px 0; padding: 10px 12px; border-radius: 10px;
      background: var(--teal-soft); border: 1px solid #99f6e4;
      font-size: 12px; color: #115e59; line-height: 1.55;
    }
    .board-title {
      padding: 16px 16px 8px; font-size: 15px; font-weight: 800; color: var(--ink);
      letter-spacing: -.02em; margin: 0;
    }
    .board-title span { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 8px; }
    .kpi-strip {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 8px 16px 4px;
    }
    @media (max-width: 1100px) { .kpi-strip { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) { .kpi-strip { grid-template-columns: repeat(2, 1fr); } }
    .kpi {
      border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
      background: var(--card); box-shadow: var(--shadow);
      transition: border-color .15s;
    }
    .kpi:hover { border-color: #cbd5e1; }
    .kpi:first-child {
      background: linear-gradient(145deg, #0c1222 0%, #134e4a 100%);
      border-color: transparent; color: #fff;
    }
    .kpi:first-child .kpi-label { color: #99f6e4; }
    .kpi:first-child .kpi-value { color: #fff; }
    .kpi:first-child .kpi-delta { color: #a7f3d0; }
    .kpi-label { font-size: 11px; color: var(--sub); font-weight: 600; letter-spacing: .01em; }
    .kpi-value {
      font-size: 22px; font-weight: 800; margin-top: 6px; letter-spacing: -.03em;
      font-variant-numeric: tabular-nums; font-family: var(--font); color: var(--ink);
    }
    .kpi-value.ok { color: var(--green); }
    .kpi-value.warn { color: var(--amber); }
    .kpi-value.bad { color: var(--red); }
    .kpi-delta { font-size: 11px; margin-top: 4px; color: var(--muted); font-weight: 600; }
    .kpi-delta.up { color: var(--green); }
    .kpi-delta.down { color: var(--red); }
    .chart-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px 16px;
    }
    .chart-grid.third { grid-template-columns: 1fr 1fr 1fr; }
    .chart-grid.stack2 { grid-template-columns: 1.25fr .75fr; }
    @media (max-width: 1100px) {
      .chart-grid, .chart-grid.third, .chart-grid.stack2 { grid-template-columns: 1fr; }
    }
    .chart-card {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--card);
      padding: 14px 14px 10px; min-height: 290px; display: flex; flex-direction: column;
      box-shadow: var(--shadow);
    }
    .chart-card.tall { min-height: 350px; }
    .chart-card.span2 { grid-column: 1 / -1; }
    .chart-hd {
      font-size: 13px; font-weight: 700; margin-bottom: 2px; color: var(--ink);
      text-align: left; letter-spacing: -.01em; padding: 0 2px 8px;
      border-bottom: 1px solid var(--line-soft);
    }
    .chart-hd .hint {
      display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 3px;
    }
    .chart-box { position: relative; flex: 1; min-height: 210px; padding: 8px 2px 0; }
    .chart-box canvas { width: 100% !important; height: 100% !important; }
    .table-wrap {
      overflow-x: auto; padding: 0 16px 16px; margin: 0 16px 16px;
      border: 1px solid var(--line); border-radius: var(--radius); background: #fff;
      box-shadow: var(--shadow);
    }
    table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 12px; }
    th, td {
      padding: 10px 12px; border-bottom: 1px solid var(--line-soft);
      text-align: left; white-space: nowrap;
    }
    th {
      background: #f8fafc; color: var(--sub); font-weight: 700; font-size: 11px;
      letter-spacing: .02em; position: sticky; top: 0;
    }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: #f8fafc; }
    .num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 11.5px; }
    .chip-row {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 4px 16px 0;
    }
    .chip-row .lab {
      font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 2px;
    }
    .chip {
      border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 4px 10px; font: inherit; font-size: 12px; font-weight: 600;
      color: var(--sub); cursor: pointer;
    }
    .chip:hover { border-color: #cbd5e1; color: var(--ink); }
    .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    .team-cards {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px;
      padding: 8px 16px 12px;
    }
    .team-card {
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; box-shadow: var(--shadow);
    }
    .team-card .name { font-weight: 800; font-size: 13px; color: var(--ink); margin-bottom: 8px; }
    .team-card .row {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 12px; color: var(--sub); margin: 3px 0;
    }
    .team-card .row b { color: var(--ink); font-variant-numeric: tabular-nums; font-family: var(--mono); font-weight: 700; }
    .team-card .rate { font-size: 20px; font-weight: 800; margin-top: 8px; letter-spacing: -.02em; }
    .team-card .rate.ok { color: #0F766E; }
    .team-card .rate.warn { color: #D97706; }
    .team-card .rate.over { color: #DC2626; }
    @media (max-width: 1100px) { .team-cards { grid-template-columns: repeat(2, 1fr); } }

    .insight {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--card);
      padding: 14px 14px 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
    }
    .insight h4 { margin: 0 0 4px; font-size: 13px; color: var(--ink); }
    .insight .item {
      padding: 8px 10px; border-radius: 8px; background: var(--line-soft); font-size: 12px; line-height: 1.5;
    }
    .insight .item b { color: var(--teal); }
    .matrix th:first-child, .matrix td:first-child {
      position: sticky; left: 0; background: #fff; z-index: 1; font-weight: 700;
    }
    .matrix thead th:first-child { background: #f8fafc; z-index: 2; }
    .small-multiples {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px 16px;
    }
    @media (max-width: 800px) { .small-multiples { grid-template-columns: 1fr; } }
    .small-multiples .chart-card { min-height: 220px; }
    .small-multiples .chart-box { min-height: 160px; }
    .hm-wrap { padding: 8px 16px 16px; overflow-x: auto; }
    .hm {
      border-collapse: separate; border-spacing: 3px; min-width: 920px; width: 100%;
    }
    .hm th, .hm td {
      border: 0; padding: 6px 4px; text-align: center; font-size: 11px;
      border-radius: 4px; font-variant-numeric: tabular-nums;
    }
    .hm th { background: transparent; color: var(--sub); font-weight: 700; position: static; }
    .hm td.name, .hm th.name { text-align: left; font-weight: 700; color: var(--ink); white-space: nowrap; }
    .hm td.on, .hm th.on { outline: 2px solid var(--ink); outline-offset: -1px; }
    .hm-legend { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--sub); padding: 0 16px 4px; }
    .hm-legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px);
      background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px;
      font-size: 12px; font-weight: 600; opacity: 0; transition: .25s; z-index: 99; pointer-events: none;
      box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div data-fin-hub style="position:sticky;top:0;z-index:9999;background:#163b63;color:#fff;padding:7px 14px;font:12px/1.4 'Microsoft YaHei','PingFang SC',sans-serif"><a href="财务部门-模块导航.html" style="color:#fff;font-weight:700;text-decoration:none">← 财务部门导航</a></div>

  <div class="layout">
    <div class="page-hd">
      <div>
        <div class="mode-switch" id="modeSwitch">
          <button type="button" data-mode="focus" class="on">新版 · 聚焦</button>
          <button type="button" data-mode="classic">原版 · 铺开</button>
        </div>

        <p class="meta" id="modeMeta">新版一次只回答一个问题。原版把各图铺在同一屏，财务评审时可来回切换对比。</p>
      </div>

  <script>
(function () {
  /* Stripe / Mercury 财务看板色板（保留可读对比，不用 Excel 默认） */
  var PAL = ["#0F766E", "#EA580C", "#64748B", "#CA8A04", "#0284C7", "#16A34A", "#0F172A", "#B45309"];
  var MONTHS = ["1月","2月","3月","4月","5月","6月","7月","8月","9月"];
  var chartObjs = [];
  var state = {
    main: "analysis",
    sub: { analysis: "board1", inspect: "month", product: "overview" },
    cut: {
      bc: "gap",
      a1: "complete",
      a2: "table",
      a3: "kpi",
      fcl: "carrier",
      insM: "rate",
      insW: "dom",
      ch: "quad"
    },
    mode: "focus",
    pd: {
      metric: "margin",
      volMode: "share",
      tails: ["卡派", "UPS"],
      depts: ["苏州", "宁波", "义乌直客", "深圳直客"],
      years: ["2025年", "2026年"]
    }
  };

  var MODULES = [
    { id: "broadcast", name: "一、数据播报", src: "营销数据播报--2026（最新模板7.23唐）.xlsx" },
    { id: "analysis", name: "二、经营分析", src: "看板1 · 公司完成/排名/港口/渠道/整柜" },
    { id: "fcl", name: "三、整柜", src: "苏州数据 · 船司柜量 / 目的港" },
    { id: "inspect", name: "四、查验", src: "2026年查验统计.xlsx · 月度/每周看板图" },
    { id: "product", name: "五、产品部", src: "产品部2026年最新.xlsx · 看板图" },
    { id: "channel", name: "六、渠道", src: "数据分析-渠道.xlsx · 渠道图" }
  ];

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 2000);
  }

  function destroyCharts() {
    chartObjs.forEach(function (c) { try { c.destroy(); } catch (e) {} });
    chartObjs = [];
  }

  /* —— 图表公共配置（轻网格、圆角柱、底部图例） —— */
  var XL_FONT = { family: "'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif", size: 11, color: "#64748B" };
  var XL_GRID = { color: "#F1F5F9", drawBorder: false, lineWidth: 1 };
  var XL_LEGEND = {
    position: "bottom",
    labels: {
      boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: "circle",
      font: { size: 11, family: "'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif", weight: "600" },
      color: "#64748B", padding: 14
    }
  };

  /* 柱顶/点旁数值标签（对齐 Excel 数据标签） */
  var dataLabelPlugin = {
    id: "xlLabels",
    afterDatasetsDraw: function (chart) {
      var cfg = (chart.options.plugins && chart.options.plugins.xlLabels) || {};
      if (cfg.display === false) return;
      var ctx = chart.ctx;
      ctx.save();
      ctx.font = "600 10px 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = "#64748B";
      ctx.textAlign = "center";
      chart.data.datasets.forEach(function (ds, di) {
        if (ds._hideLabels) return;
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        meta.data.forEach(function (el, i) {
          var v = ds.data[i];
          if (v == null || v === "") return;
          var pos = el.tooltipPosition();
          var txt = cfg.suffix && ds.yAxisID === "y1" ? (v + "%") : String(v);
          if (chart.options.indexAxis === "y") {
            ctx.textAlign = "left";
            ctx.fillText(txt, pos.x + 4, pos.y + 3);
          } else if (ds.type === "line" || chart.config.type === "line") {
            ctx.textAlign = "center";
            ctx.fillText(txt, pos.x, pos.y - 8);
          } else if (chart.config.type === "pie" || chart.config.type === "doughnut") {
            /* pie handled separately */
          } else {
            ctx.textAlign = "center";
            ctx.fillText(txt, pos.x, pos.y - 6);
          }
        });
      });
      ctx.restore();
    }
  };

  /* 环图中心完成率（Excel 完成率环图常见写法） */
  var donutCenterPlugin = {
    id: "xlDonutCenter",
    afterDraw: function (chart) {
      var cfg = (chart.options.plugins && chart.options.plugins.xlDonutCenter) || {};
      if (!cfg.text) return;
      var meta = chart.getDatasetMeta(0);
      if (!meta || !meta.data || !meta.data[0]) return;
      var x = meta.data[0].x, y = meta.data[0].y;
      var ctx = chart.ctx;
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#0F172A";
      ctx.font = "800 22px 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif";
      ctx.fillText(cfg.text, x, y - (cfg.sub ? 8 : 0));
      if (cfg.sub) {
        ctx.fillStyle = "#94A3B8";
        ctx.font = "600 11px 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif";
        ctx.fillText(cfg.sub, x, y + 14);
      }
      ctx.restore();
    }
  };

  /* 饼/环百分比标签 */
  var pieLabelPlugin = {
    id: "xlPieLabels",
    afterDatasetsDraw: function (chart) {
      if (chart.config.type !== "pie" && chart.config.type !== "doughnut") return;
      var cfg = (chart.options.plugins && chart.options.plugins.xlPieLabels) || {};
      if (cfg.display === false) return;
      var ctx = chart.ctx;
      var ds = chart.data.datasets[0];
      var total = ds.data.reduce(function (a, b) { return a + b; }, 0) || 1;
      var meta = chart.getDatasetMeta(0);
      ctx.save();
      ctx.font = "10px 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = "#475569";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      meta.data.forEach(function (arc, i) {
        var v = ds.data[i];
        var pct = Math.round(v / total * 100);
        if (pct < 4) return;
        var ang = (arc.startAngle + arc.endAngle) / 2;
        var r = (arc.innerRadius + arc.outerRadius) / 2;
        var x = arc.x + Math.cos(ang) * r;
        var y = arc.y + Math.sin(ang) * r;
        ctx.fillStyle = "#fff";
        ctx.font = "700 11px 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif";
        ctx.fillText(pct + "%", x, y);
      });
      ctx.restore();
    }
  };

  function mkChart(canvasId, cfg) {

  function doughnut(id, labels, data, colors, centerText) {

      options: {

            : (labels[0] && labels[0].indexOf("完成") >= 0 ? { text: done + "%", sub: labels[0] } : null),
          xlPieLabels: { display: !centerText && !(labels[0] && String(labels[0]).indexOf("完成") >= 0) },
          xlLabels: { display: false },
          tooltip: { callbacks: { label: function (x) { return x.label + "：" + x.raw + "%"; } } }

    return mkChart(id, {

  function bar(id, labels, datasets, horizontal) {

            '<button type="button" class="chip' + (state.pd.volMode === "share" ? " on" : "") + '" data-pd="volMode" data-val="share">占比（结构）</button>' +
            '<button type="button" class="chip' + (state.pd.volMode === "abs" ? " on" : "") + '" data-pd="volMode" data-val="abs">绝对值（规模）</button></div>' +
          '<div class="chart-grid">' +
            card(state.pd.volMode === "share" ? "各月尾端结构差在私卡和整柜，不在 FEDEX" : "货量规模逐月抬升，私卡与整柜贡献最大",
              state.pd.volMode === "share" ? "100% 堆叠，只比结构" : "堆叠绝对值，比规模", "pdVol", "tall span2") +
          "</div>" +
          '<div class="table-wrap matrix"><table><thead><tr><th>尾端 \\ 月</th>' +
            PD_MONTH8.map(function (c) { return '<th class="num">' + c + "</th>"; }).join("") +
          "</tr></thead><tbody>" + volRows + "</tbody></table></div>" +
          '<div class="board-title">④ 渠道 · 规模与利率 <span>散点 + 部门结构</span></div>' +
          chipRow("对比部门", "dept", Object.keys(PD_MIX)) +
          '<div class="chart-grid">' +
            card("整柜又大又赚；清提派利率高但规模小", "横轴毛利、纵轴毛利率，十字为中位数", "pdScatter", "tall") +
            card("部门之间差在结构，不在谁的柱子更高", "100% 堆叠，同一刻度", "pdMixDept", "tall") +
          "</div>" +
          '<div class="table-wrap"><table><thead><tr><th>产品渠道</th><th class="num">毛利</th><th class="num">毛利率</th></tr></thead><tbody>' +
            chRows + "</tbody></table></div>" +
          '<div class="board-title">⑤ 周货量历年对比 <span>共用纵轴 0–1400</span></div>' +
          chipRow("年份", "year", ["2023年", "2024年", "2025年", "2026年"]) +
          '<div class="small-multiples">' +
            state.pd.years.map(function (y, i) {
              return '<div class="chart-card"><div class="chart-hd">' + y +
                (y === "2026年" ? '<span class="hint">本年</span>' : "") +
                '</div><div class="chart-box"><canvas id="pdWeek' + i + '"></canvas></div></div>';
            }).join("") +
          "</div>" +
          '<div class="table-wrap matrix"><table><thead><tr><th>年份 \\ 周</th>' +
            PD_WEEKS.map(function (w) { return '<th class="num">' + w + "</th>"; }).join("") +
          "</tr></thead><tbody>" + yRows + "</tbody></table></div>";
      },
      paint: function () {
        barLine("pdMix", MONTHS,
          [{ label: "应收", data: [820, 780, 860, 840, 900, 920, 910, 940, 954] },
           { label: "产品部毛利", data: [98, 92, 108, 102, 118, 122, 116, 120, 124] }],
          [{ label: "毛利率%", data: [12.0, 11.8, 12.6, 12.1, 13.1, 13.3, 12.7, 12.8, 13.0] }], null, null, true);
        var keys = Object.keys(PD_VOL);
        var series = keys.map(function (name) { return { label: name, data: PD_VOL[name].slice() }; });
        if (state.pd.volMode === "share") {
          PD_MONTH8.forEach(function (_, i) {
            var sum = 0;
            keys.forEach(function (k) { sum += PD_VOL[k][i]; });
            keys.forEach(function (k, ki) {
              series[ki].data[i] = sum ? Math.round(PD_VOL[k][i] / sum * 1000) / 10 : 0;
            });
          });
        }
        stackedBar("pdVol", PD_MONTH8, series, false, state.pd.volMode === "share");
        var gps = PD_CH.map(function (c) { return c.gp; }).sort(function (a, b) { return a - b; });
        var rates = PD_CH.map(function (c) { return c.rate; }).sort(function (a, b) { return a - b; });
        var medX = gps[Math.floor(gps.length / 2)];
        var medY = rates[Math.floor(rates.length / 2)];
        mkChart("pdScatter", {
          type: "scatter",
          data: {
            datasets: [{
              label: "渠道",
              data: PD_CH.map(function (c) { return { x: c.gp, y: c.rate, name: c.n }; }),
              backgroundColor: "#0F766E",
              pointRadius: 7, pointHoverRadius: 9
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              xlLabels: { display: false },
              tooltip: {
                callbacks: {
                  label: function (x) {
                    var p = x.raw;
                    return p.name + " · 毛利 " + p.x + " · 利率 " + p.y + "%";
                  }
                }
              }
            },
            scales: {
              x: {
                title: { display: true, text: "毛利", font: XL_FONT, color: "#64748B" },
                ticks: { font: XL_FONT }, grid: XL_GRID, border: { display: false }
              },
              y: {
                title: { display: true, text: "毛利率 %", font: XL_FONT, color: "#64748B" },
                ticks: { font: XL_FONT }, grid: XL_GRID, border: { display: false }
              }
            }
          },
          plugins: [{
            id: "pdQuadClassic",
            afterDraw: function (chart) {
              var xScale = chart.scales.x, yScale = chart.scales.y;
              var ctx = chart.ctx;
              var x = xScale.getPixelForValue(medX);
              var y = yScale.getPixelForValue(medY);
              ctx.save();
              ctx.strokeStyle = "#94A3B8";
              ctx.setLineDash([4, 4]);
              ctx.beginPath();
              ctx.moveTo(x, yScale.top); ctx.lineTo(x, yScale.bottom);
              ctx.moveTo(xScale.left, y); ctx.lineTo(xScale.right, y);
              ctx.stroke();
              ctx.setLineDash([]);
              ctx.font = "600 10px 'PingFang SC','Microsoft YaHei',sans-serif";
              chart.getDatasetMeta(0).data.forEach(function (pt, i) {
                ctx.fillStyle = "#0F172A";
                ctx.fillText(PD_CH[i].n, pt.x + 6, pt.y - 6);
              });
              ctx.restore();
            }
          }]
        });
        stackedBar("pdMixDept", state.pd.depts, PD_MIX_LABELS.map(function (lab, i) {
          return {
            label: lab,
            data: state.pd.depts.map(function (d) { return PD_MIX[d][i]; })
          };
        }), true, true);
        var yMax = 1400;
        state.pd.years.forEach(function (y, i) {
          var on = y === "2026年";
          mkChart("pdWeek" + i, {
            type: "line",
            data: {
              labels: PD_WEEKS,
              datasets: [{
                label: y, data: PD_YEAR[y],
                borderColor: on ? "#0F766E" : "#94A3B8",
                backgroundColor: "transparent",
                borderWidth: on ? 2.5 : 1.5,
                pointRadius: 2, tension: 0.25, fill: false
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { display: false }, xlLabels: { display: false } },
              scales: {
                y: { min: 0, max: yMax, ticks: { font: XL_FONT }, grid: XL_GRID, border: { display: false } },
                x: { ticks: { font: XL_FONT, maxRotation: 0, autoSkip: true }, grid: { display: false }, border: { display: false } }
              }
            }
          });
        });
      }
    },
    channel: {
      html: function () {
        return note("原版铺开：三张结构环图和代理、部门、业务员图同时展示。") +
          kpis([
            { label: "货量", value: "2,660" }, { label: "销售额", value: "396万" },
            { label: "应付", value: "328万" }, { label: "毛利", value: "68万", cls: "ok" },
            { label: "毛利率", value: "17.2%", cls: "ok" }, { label: "运单数", value: "128" }
          ]) +
          '<div class="chart-grid third">' +
            card("货量结构", "", "chD1") + card("销售额结构", "", "chD2") + card("毛利结构", "", "chD3") +
          "</div>" +
          '<div class="chart-grid">' +
            card("代理 · 货量 / 销售额 / 毛利", "柱+折", "chMix", "tall") + card("部门货量", "", "chDept") +
          "</div>" +
          '<div class="chart-grid">' +
            card("业务员货量 TOP", "", "chSales") + card("代理货量对比", "", "chAgent") +
          "</div>" +
          '<div class="table-wrap"><table><thead><tr><th>运单号</th><th>状态</th><th>客户</th><th>服务商</th><th>销售产品</th><th>签入仓</th><th>业务员</th><th>部门</th><th>签入时间</th></tr></thead>' +
          "<tbody><tr><td>TX-001</td><td>已签入</td><td>海拓</td><td>伟成国际</td><td>美海卡派</td><td>4DS</td><td>张苏宁</td><td>苏州一部</td><td>2026-09-18</td></tr>" +
          "<tr><td>TX-018</td><td>转运中</td><td>联洲</td><td>伟成国际</td><td>美海卡派</td><td>美库</td><td>李婷</td><td>苏州一部</td><td>2026-09-19</td></tr></tbody></table></div>";
      },
      paint: function () {
        doughnut("chD1", ["伟成", "环世", "德莎", "其他"], [48, 28, 14, 10]);
        doughnut("chD2", ["伟成", "环世", "德莎", "其他"], [47, 30, 13, 10]);
        doughnut("chD3", ["伟成", "环世", "德莎", "其他"], [50, 28, 12, 10]);
        barLine("chMix", ["伟成国际","环世供应链","德莎物流","中外运","合创"],
          [{ label: "货量", data: [1280, 960, 420, 380, 220] }, { label: "销售额", data: [186, 142, 68, 58, 36] }],
          [{ label: "毛利", data: [34, 24, 10, 9, 5] }], null, null, true);
        bar("chDept", ["销售一部","销售二部","销售三部","销售四部","销售五部","宁波"], [{ label: "货量", data: [620, 540, 480, 410, 360, 250] }]);
        bar("chSales", ["陈炎","李可","黄小丽","王仁韬","徐建","陈燚"], [{ label: "货量", data: [186, 172, 158, 142, 130, 118] }], true);
        bar("chAgent", ["伟成国际","环世供应链","德莎物流","中外运","合创"], [
          { label: "货量", data: [1280, 960, 420, 380, 220] },
          { label: "应付", data: [152, 118, 58, 50, 32] }
        ]);
      }
    }
  };

  var VIEWS = {
    broadcast: { html: viewBroadcast, paint: paintBroadcast },
    analysis: { html: viewAnalysis, paint: paintAnalysis },
    fcl: { html: viewFcl, paint: paintFcl },
    inspect: { html: viewInspect, paint: paintInspect },
    product: { html: viewProduct, paint: paintProduct },
    channel: { html: viewChannel, paint: paintChannel }
  };

  function renderMainTabs() {
    document.getElementById("mainTabs").innerHTML = MODULES.map(function (m) {
      return '<button type="button" class="main-tab' + (state.main === m.id ? " active" : "") + '" data-main="' + m.id + '">' + m.name + '</button>';
    }).join("");
    var mod = MODULES.filter(function (m) { return m.id === state.main; })[0];
    var modeName = state.mode === "classic" ? "原版铺开" : "新版聚焦";
    document.getElementById("srcTag").textContent = modeName + " · 来源图：" + mod.src;
    var meta = document.getElementById("modeMeta");
    if (meta) {
      meta.textContent = state.mode === "classic"
        ? "当前是原版：各图铺在同一屏，方便和财务对一下「原来怎么看」。"
        : "当前是新版：一次只回答一个问题。评审对比请切到「原版 · 铺开」。";
    }
    document.querySelectorAll("#modeSwitch button").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-mode") === state.mode);
    });
  }

  function bindChrome() {
    document.querySelectorAll("[data-sub]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.sub[state.main] = btn.getAttribute("data-sub");
        render();
      });
    });
    document.querySelectorAll("[data-cut]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.cut[btn.getAttribute("data-cut")] = btn.getAttribute("data-val");
        render();
      });
    });
    document.querySelectorAll("[data-pd]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var kind = btn.getAttribute("data-pd");
        var val = btn.getAttribute("data-val");
        if (kind === "metric") {
          state.pd.metric = val;
        } else if (kind === "volMode") {
          state.pd.volMode = val;
        } else if (kind === "tail") {
          var ti = state.pd.tails.indexOf(val);
          if (ti >= 0) state.pd.tails.splice(ti, 1);
          else state.pd.tails.push(val);
        } else if (kind === "dept") {
          var di = state.pd.depts.indexOf(val);
          if (di >= 0) {
            if (state.pd.depts.length === 1) { toast("至少保留一个部门"); return; }
            state.pd.depts.splice(di, 1);
          } else if (state.pd.depts.length >= 6) {
            toast("最多对比 6 个部门");
            return;
          } else state.pd.depts.push(val);
        } else if (kind === "year") {
          var yi = state.pd.years.indexOf(val);
          if (yi >= 0) {
            if (state.pd.years.length === 1) { toast("至少保留一个年份"); return; }
            state.pd.years.splice(yi, 1);
          } else state.pd.years.push(val);
        }
        render();
      });
    });
    var q = document.getElementById("btnQ");
    if (q) q.onclick = function () { toast("已按筛选刷新（演示）"); render(); };
    var r = document.getElementById("btnR");
    if (r) r.onclick = function () { toast("已重置"); };
    var e = document.getElementById("btnE");
    if (e) e.onclick = function () { toast("演示：导出 Excel"); };
  }

  function render() {
    destroyCharts();
    renderMainTabs();
    var v = (state.mode === "classic" ? CLASSIC : VIEWS)[state.main];
    document.getElementById("viewRoot").innerHTML = v.html();
    bindChrome();
    requestAnimationFrame(function () { v.paint(); });
  }

  document.getElementById("modeSwitch").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-mode]");
    if (!btn) return;
    state.mode = btn.getAttribute("data-mode");
    render();
  });

  document.getElementById("mainTabs").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-main]");
    if (!btn) return;
    state.main = btn.getAttribute("data-main");
    render();
  });

  render();
})();
  </script>
</body>
</html>
