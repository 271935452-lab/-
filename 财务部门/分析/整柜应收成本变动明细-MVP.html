function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c];
  });
}
function money(n) {
  var t = Math.abs(n).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? "-" : "") + t;
}
function dayOf(str) {
  if (!str) return "";
  var m = String(str).match(/(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : "";
}
function inRange(day, a, b) {
  if (!day) return !(a || b);
  if (a && day < a) return false;
  if (b && day > b) return false;
  return true;
}

    if (sales && r.sales !== sales) return false;
    if (wb && r.wb.toUpperCase().indexOf(wb) < 0) return false;
    if (fee && r.feeType !== fee) return false;
    if (charger && r.charger !== charger) return false;
    if (side && r.side !== side) return false;
    return true;
  });
}
function calcSum(list) {
  var ar = 0, cost = 0, up = 0, down = 0;
  var unlockByWb = {};
  list.forEach(function (r) {
    if (r.side === "应收") ar += r.settle;
    else cost += r.settle;
    if (r.settle >= 0) up += 1; else down += 1;
    unlockByWb[r.wb] = r.unlockCnt || 0;
  });
  var unlockWb = 0, unlockSum = 0;
  Object.keys(unlockByWb).forEach(function (wb) {
    var n = unlockByWb[wb] || 0;
    if (n > 0) unlockWb += 1;
    unlockSum += n;
  });
  return { ar: ar, cost: cost, up: up, down: down, unlockWb: unlockWb, unlockSum: unlockSum };
}
function renderFoot(list) {
  var s = calcSum(list);
  var arCls = s.ar < 0 ? "neg" : "pos";
  var costCls = s.cost < 0 ? "neg" : "pos";
  document.getElementById("tfoot").innerHTML =
    "<tr>" +
    '<td><button type="button" class="pin" data-pin="5" title="列下合计">5</button><span class="lab">匹配行数</span><span class="val">' + list.length + "</span></td>" +
    "<td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>" +
    '<td class="num"><span class="lab">加收行 / 冲减行</span><span class="val">' + s.up + " / " + s.down + "</span></td>" +
    "<td></td>" +
    '<td class="num"><span class="lab">应收合计</span><span class="val ' + arCls + '">' + money(s.ar) + '</span><span class="lab" style="margin-top:6px">成本合计</span><span class="val ' + costCls + '">' + money(s.cost) + "</span></td>" +
    "<td></td>" +
    '<td class="num"><span class="lab">有解锁运单 / 解锁合计</span><span class="val">' + s.unlockWb + " / " + s.unlockSum + "</span></td>" +
    "</tr>";
}
function render() {
  var list = filtered();
  var html = "";
  list.forEach(function (r, i) {
    var amtCls = r.amt < 0 ? "neg" : "pos";
    var sideCls = r.side === "应收" ? "ar" : "cost";

      '<td class="mono">' + esc(r.bl) + "</td>" +

      "<td>" + esc(r.charger) + "</td>" +
      '<td class="num">' + (r.unlockCnt || 0) + "</td>" +
      "</tr>";
  });
  document.getElementById("tbody").innerHTML = html ||
    '<tr><td colspan="21" style="text-align:center;color:#8c8c8c;padding:28px">无匹配变动记录</td></tr>';
  renderFoot(list);
  document.getElementById("pagerText").textContent = "共 " + list.length + " 条 · 仅整柜运单";
}
