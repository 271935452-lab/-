<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9810 拆分规则配置 · MVP</title>
  <style>
    :root { --nav: #001529; --primary: #1890ff; --line: #e8e8e8; --text: #262626; --muted: #8c8c8c; --new: #cf1322; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.5 "Microsoft YaHei", sans-serif; background: #f0f2f5; color: var(--text); }
    a { color: var(--primary); }
    .hub {
      position: sticky; top: 0; z-index: 50; background: #163b63; color: #fff;
      padding: 7px 14px; font-size: 12px;
    }
    .hub a { color: #91d5ff; text-decoration: none; margin-right: 8px; }
    .topbar {
      height: 40px; background: var(--nav); color: #fff; display: flex; align-items: center;
      padding: 0 12px; gap: 8px;
    }
    .topbar .on { color: #fa8c16; font-weight: 700; }
    .main { max-width: 1080px; margin: 0 auto; padding: 12px 14px 32px; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 12px; }
    .panel-hd {
      padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 700;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .mark-legend {
      display: inline-block; margin-left: auto; padding: 2px 8px; border-radius: 4px;
      background: #fff7ed; color: #c2410c; font-size: 12px; font-weight: 600;
    }
    .panel-bd { padding: 12px 14px; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
    .tabs button {
      border: none; background: #fafafa; padding: 10px 18px; cursor: pointer; font: inherit;
      border-right: 1px solid var(--line);
    }
    .tabs button.on { background: #fff; color: var(--primary); font-weight: 700; box-shadow: inset 0 -2px 0 var(--primary); }
    .row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 12px; }
    .row label { color: var(--muted); font-size: 12px; }
    select, input[type="number"], input[type="text"] {
      height: 28px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 0 8px; font: inherit;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #f0f0f0; padding: 8px 10px; text-align: left; vertical-align: middle; }
    th { background: #fafafa; font-weight: 600; }
    td.num input { width: 88px; text-align: right; }
    td.tax input { width: 56px; text-align: right; }
    .btn {
      height: 28px; padding: 0 12px; border: 1px solid #d9d9d9; background: #fff;
      border-radius: 2px; cursor: pointer; font: inherit;
    }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .mk {
      display: inline-block; padding: 0 5px; height: 16px; line-height: 14px;
      border-radius: 2px; font-size: 10px; font-weight: 700; border: 1px solid #ffa39e;
      color: var(--new); background: #fff1f0; vertical-align: middle;
    }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.55; margin: 0 0 10px; }
    .split { display: grid; grid-template-columns: 260px 1fr; gap: 12px; min-height: 320px; }
    .plist { border: 1px solid var(--line); border-radius: 4px; overflow: auto; max-height: 400px; }
    .plist button {
      display: block; width: 100%; text-align: left; border: none; background: #fff;
      padding: 8px 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font: inherit;
    }
    .plist button.on { background: #e6f7ff; color: #096dd9; font-weight: 600; }
    .plist button .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
    .tag { font-size: 10px; padding: 0 4px; border-radius: 2px; background: #f5f5f5; color: #8c8c8c; margin-left: 4px; }
    .tag.t25 { background: #e6f7ff; color: #096dd9; }
    .toast {
      position: fixed; top: 48px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.78); color: #fff; padding: 8px 16px; border-radius: 4px;
      opacity: 0; pointer-events: none; transition: .2s; z-index: 200;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="hub">
  <a href="../财务部门-模块导航.html#s-bill">← 财务导航</a>
  <a href="../PRD对照-9810费用拆分/9810拆分规则配置-PRD-交互稿.html">配置页 PRD（橙圈 1～8）</a>
  <a href="../PRD对照-9810费用拆分/请款单管理-PRD-交互稿.html">请款单 PRD</a>
  <a href="请款单管理-指定票件整合-MVP.html">请款单管理</a>
</div>
<div class="topbar">
  <span>腾信物流</span>
  <span class="on">财务 · 9810 拆分规则配置</span>
</div>
<div class="main">
  <div class="panel">
    <div class="panel-hd">
      9810 拆分规则配置
      <span class="mark-legend">橙色编号 · 逐点说明 1～8</span>
    </div>
    <div class="tabs" role="tablist" id="cfgTabScope">
      <button type="button" class="on" data-tab="general" id="tabGeneral">通用配置</button>
      <button type="button" data-tab="product" id="tabProduct">按销售产品配置 <span class="mk">NEW</span></button>
    </div>
    <div class="panel-bd">
      <div class="row">
        <label>计费维度
          <select id="basisPick">
            <option value="vol" selected>按方数</option>
            <option value="wgt">按计费重</option>
          </select>
        </label>
        <span id="basisUnitHint" style="font-size:12px;color:#595959">单价单位：元/方</span>
        <button type="button" class="btn primary" id="btnSave">保存</button>
      </div>

      <div id="paneGeneral">
        <table>
          <thead>
            <tr>
              <th>费用类型（默认三行）</th>
              <th>税率 %</th>
              <th id="thUnitPrice">单价基数</th>
              <th>说明</th>
            </tr>
          </thead>
          <tbody id="gridGeneral"></tbody>
        </table>
      </div>

      <div id="paneProduct" style="display:none">
        <div class="split">
          <div>
            <div class="row" style="margin-bottom:8px">
              <button type="button" class="btn" id="btnAddProd">＋ 销售产品</button>
            </div>
            <div class="plist" id="prodList"></div>
          </div>
          <div>
            <p class="hint" id="prodEditHint">选中左侧销售产品，维护<strong>专配</strong>单价；勾选「未维护字段继承通用」时，空项回落通用配置。</p>
            <div id="prodProductMeta" style="margin-bottom:10px">
              <label style="display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;cursor:pointer">
                <input type="checkbox" id="chkInheritGeneral" checked /> 未填写的单价/税率继承<strong>通用配置</strong>
              </label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
                <input type="checkbox" id="chkT25Tab" /> 归入导出弹窗「中美 &amp; T25」页签
              </label>
            </div>
            <div id="prodEditPane">
            <table>
              <thead>
                <tr>
                  <th>费用类型</th>
                  <th>税率 %</th>
                  <th>单价基数</th>
                  <th>说明</th>
                </tr>
              </thead>
              <tbody id="gridProduct"></tbody>
            </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  const ROW_DEF = [
    { key: "inland", name: "国内道路货物运输费", tax: 9, vol: { general: 100, t25: 20 }, wgt: { general: 0.54, t25: 0.215 }, note: "内陆段默认单价" },
    { key: "port", name: "港杂费", tax: 6, vol: { general: 40, t25: 40 }, wgt: { general: 0.43, t25: 0.43 }, note: "港杂单价" },
    { key: "customs", name: "代理报关费", tax: 6, vol: null, wgt: null, note: "不配置单价；导出时取运单实际报关费基数" }
  ];

  const products = [
    { id: "P-T25", code: "中美T25", name: "中美专线 T25", t25Tab: true, inherit: true,
      vol: { inland: 20, port: 40 }, wgt: { inland: 0.215, port: 0.43 }, tax: { inland: 9, port: 6, customs: 6 } },
    { id: "P-SEA", code: "OTHER-SEA", name: "其他海运（组默认）", t25Tab: false, inherit: true,
      vol: { inland: 100, port: 40 }, wgt: { inland: 0.54, port: 0.43 }, tax: { inland: 9, port: 6, customs: 6 } },
    { id: "P-EU", code: "EU-LINE", name: "欧线海运", t25Tab: false, inherit: true,
      vol: { inland: 120, port: 45 }, wgt: { inland: 0.58, port: 0.45 }, tax: { inland: 9, port: 6, customs: 6 } }
  ];

  let general = {
    vol: { inland: 100, port: 40, tax: { inland: 9, port: 6, customs: 6 } },
    wgt: { inland: 0.54, port: 0.43, tax: { inland: 9, port: 6, customs: 6 } }
  };

  let activeTab = "general";
  let activeProdId = products[0].id;

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2200);
  }

  function basis() { return document.getElementById("basisPick").value; }

  function renderGeneralGrid() {
    const b = basis();
    const g = general[b];
    document.getElementById("thUnitPrice").textContent = b === "vol" ? "单价基数（元/方）" : "单价基数（元/KG）";
    document.getElementById("basisUnitHint").textContent = b === "vol" ? "单价单位：元/方" : "单价单位：元/KG";
    document.getElementById("gridGeneral").innerHTML = ROW_DEF.map(r => {
      if (r.key === "customs") {
        return `<tr><td>${r.name}</td><td class="tax"><input data-g="tax-${r.key}" value="${g.tax[r.key]}" /></td><td class="num">—</td><td>${r.note}</td></tr>`;
      }
      return `<tr><td>${r.name}</td><td class="tax"><input data-g="tax-${r.key}" value="${g.tax[r.key]}" /></td><td class="num"><input data-g="price-${r.key}" value="${g[r.key]}" step="0.001" /></td><td>${r.note}</td></tr>`;
    }).join("");
  }

  function renderProdList() {
    document.getElementById("prodList").innerHTML = products.map(p => `
      <button type="button" class="${p.id === activeProdId ? "on" : ""}" data-id="${p.id}">
        ${p.name}
        <span class="sub">${p.code}${p.t25Tab ? ' <span class="tag t25">T25页签</span>' : ""}</span>
      </button>`).join("");
    document.querySelectorAll("#prodList button").forEach(btn => {
      btn.onclick = () => { activeProdId = btn.dataset.id; renderProdList(); renderProductGrid(); };
    });
  }

  function activeProd() { return products.find(p => p.id === activeProdId) || products[0]; }

  function renderProductGrid() {
    const p = activeProd();
    const b = basis();
    document.getElementById("chkInheritGeneral").checked = p.inherit;
    document.getElementById("chkT25Tab").checked = p.t25Tab;
    document.getElementById("prodEditHint").innerHTML =
      `正在编辑：<strong>${p.name}</strong>（${p.code}）`;
    const prices = p[b] || {};
    const taxes = p.tax || {};
    document.getElementById("gridProduct").innerHTML = ROW_DEF.map(r => {
      if (r.key === "customs") {
        return `<tr><td>${r.name}</td><td class="tax"><input data-p="tax-${r.key}" value="${taxes[r.key] ?? ""}" placeholder="继承" /></td><td class="num">—</td><td>${r.note}</td></tr>`;
      }
      const ph = p.inherit ? "继承" : "";
      return `<tr><td>${r.name}</td><td class="tax"><input data-p="tax-${r.key}" value="${taxes[r.key] ?? ""}" placeholder="${ph}" /></td><td class="num"><input data-p="price-${r.key}" value="${prices[r.key] ?? ""}" step="0.001" placeholder="${ph}" /></td><td>${r.note}</td></tr>`;
    }).join("");
  }

  function readGeneralFromDom() {
    const b = basis();
    const g = general[b];
    document.querySelectorAll("#gridGeneral input[data-g]").forEach(inp => {
      const [_, kind, key] = inp.dataset.g.split("-");
      const v = inp.value.trim();
      if (kind === "tax") g.tax[key] = Number(v) || 0;
      else g[key] = Number(v) || 0;
    });
  }

  function readProductFromDom() {
    const p = activeProd();
    const b = basis();
    if (!p[b]) p[b] = {};
    if (!p.tax) p.tax = {};
    document.querySelectorAll("#gridProduct input[data-p]").forEach(inp => {
      const [_, kind, key] = inp.dataset.p.split("-");
      const v = inp.value.trim();
      if (!v) {
        if (kind === "tax") delete p.tax[key];
        else delete p[b][key];
        return;
      }
      if (kind === "tax") p.tax[key] = Number(v) || 0;
      else p[b][key] = Number(v) || 0;
    });
    p.inherit = document.getElementById("chkInheritGeneral").checked;
    p.t25Tab = document.getElementById("chkT25Tab").checked;
  }

  document.querySelectorAll(".tabs button").forEach(btn => {
    btn.onclick = () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b === btn));
      document.getElementById("paneGeneral").style.display = activeTab === "general" ? "" : "none";
      document.getElementById("paneProduct").style.display = activeTab === "product" ? "" : "none";
      if (activeTab === "product") { renderProdList(); renderProductGrid(); }
      else renderGeneralGrid();
    };
  });

  document.getElementById("basisPick").onchange = () => {
    if (activeTab === "general") renderGeneralGrid();
    else renderProductGrid();
  };

  document.getElementById("btnSave").onclick = () => {
    if (activeTab === "general") readGeneralFromDom();
    else readProductFromDom();
    toast(activeTab === "general" ? "通用配置已保存" : "销售产品配置已保存 · " + activeProd().code);
  };

  document.getElementById("chkInheritGeneral").onchange = () => { readProductFromDom(); renderProductGrid(); };
  document.getElementById("chkT25Tab").onchange = readProductFromDom;

  document.getElementById("btnAddProd").onclick = () => {
    const code = prompt("销售产品编码", "NEW-PROD");
    if (!code) return;
    const name = prompt("销售产品名称", code) || code;
    products.push({
      id: "P-" + Date.now(), code, name, t25Tab: false, inherit: true,
      vol: {}, wgt: {}, tax: {}
    });
    activeProdId = products[products.length - 1].id;
    renderProdList();
    renderProductGrid();
    toast("已新增 · 请填写专配后保存");
  };

  renderGeneralGrid();
</script>
<script src="9810cfg-review-bridge.js" data-page="0"></script>
</body>
</html>
