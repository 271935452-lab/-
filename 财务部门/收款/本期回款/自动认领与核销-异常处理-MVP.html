+1)+'. '+points[Number(li.dataset.point)][0],points[Number(li.dataset.point)][1])});function mark(target,index){if(!target)return;target.style.position='relative';const pin=document.createElement('span');pin.className='pin';pin.textContent=index+1;pin.title='点击查看 PRD 说明';pin.tabIndex=0;pin.style.cssText+=';position:absolute;right:-8px;top:-8px;z-index:2';const show=e=>{e.preventDefault();e.stopPropagation();open((index+1)+'. '+points[index][0],points[index][1])};pin.addEventListener('click',show);pin.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){show(e)}});target.appendChild(pin)}mark(document.getElementById('tabs'),0);mark(document.querySelector('.filters'),1);const marks={'查看水单':2,'查看真实流水':3,'重新匹配':4,'指派处理人':5,'驳回':6,'人工确认认领':7,'审批客户放行':8,'驳回疑似重复':9,'导出':10,'操作日志':10};document.querySelectorAll('[data-action]').forEach(btn=>mark(btn,marks[btn.dataset.action]));draw();

const pointDetails=[
 '<h3>前端与状态</h3><p>四个主状态按水单互斥：自动认领异常、已比对待核销、已核销、已驳回。“待放行审批”仅按放行状态筛选，可与任一未核销状态并存。</p><h3>流转</h3><p>付款主体或付款账户未唯一匹配→自动认领异常；认领成功但核销条件不满足→已比对待核销；条件全部满足→已核销；财务驳回→已驳回。放行同意不等于核销。</p><p><b>PRD：</b>状态、页签与流转。</p>',
 '<h3>前端</h3><p>客户、回款编号、真实流水、运单、时间、状态、异常类型、币别、处理人、付款主体、放行状态支持组合筛选。列表一行仅为一张水单，回款编号只展示一个。</p><h3>数据</h3><p>运单、请款单、费用项保留在核销校验详情，不作为列表字段；导出沿用当前筛选和财务数据权限。</p><p><b>PRD：</b>筛选与列表字段。</p>',
 '<h3>查看水单</h3><p>只读展示原始水单、AI识别金额、确认金额、付款主体、付款/收款账户和付款时间。工作台操作不得覆盖原始识别数据。</p><p><b>PRD：</b>水单信息与识别值。</p>',
 '<h3>查看真实流水</h3><p>只读展示流水号、凭证金额、付款主体/账户、付款时间、我方收款账户、币别。手工新增凭证不得参与自动认领、重新匹配和自动核销。</p><p><b>PRD：</b>真实流水匹配。</p>',
 '<h3>重新匹配</h3><p>选择记录后直接按完整条件重跑，不弹窗：先校验付款主体、付款账户（前四位+后四位），再校验付款时间48小时、我方账户后四位、币种、金额、账单及费用项唯一分配；同时写操作日志。</p><p><b>PRD：</b>自动认领与自动核销规则。</p>',
 '<h3>指派处理人</h3><p>候选仅限员工管理中在职且具备财务收款权限的人员。保存处理人、指派人、时间和备注，不改变业务状态、放行状态或核销结果。</p><p><b>PRD：</b>权限与操作日志。</p>',
 '<h3>驳回</h3><p>驳回原因必填。确认后水单进入已驳回；原水单、真实流水、识别结果和日志都保留。业务不得在原申请补资料或重提，必须重新发起申请。</p><p><b>PRD：</b>驳回处理。</p>',
 '<h3>人工确认认领</h3><p>仅自动认领异常可操作。财务可另存认领客户、付款主体、付款/收款账户、付款时间、到账金额、币别；无唯一流水或多候选时必须选择真实流水。</p><h3>后端</h3><p>记录原始值、调整前后值、原因、操作人和时间，不覆盖水单或流水原值；保存后重跑认领和核销。</p><p><b>PRD：</b>人工确认认领。</p>',
 '<h3>审批客户放行</h3><p>仅处理申请放行且未达门槛的记录。审批按回款申请一次提交，列表仍逐水单展示。同意只更新放行状态、解锁客户下单，不代表已核销；驳回保留未放行。</p><h3>撤销</h3><p>已放行但未实际核销时可撤销放行，原因必填并重新锁定；已核销须在现网收款管理撤销核销。</p><p><b>PRD：</b>放行规则与撤销。</p>',
 '<h3>导出与日志</h3><p>导出当前筛选范围和当前数据权限，不改业务状态。日志按回款编号记录上传、识别、认领、重新匹配、指派、驳回、放行、核销的操作人、时间、原因和前后值。</p><p><b>PRD：</b>导出与审计。</p>'
];

points[0][2]='<h3>处理状态与页签流转</h3><p>列表一行是一张水单；“自动认领异常、已比对待核销、已核销、已驳回”互斥。待放行审批是放行状态待办，可与未核销状态并存。</p><h3>一张水单核销多个账单</h3><ol><li><b>自动认领异常：</b>仅付款主体或付款账户（前四位+后四位）不匹配、无唯一真实流水或有多个流水候选时进入；<b>金额不匹配不属于自动认领异常</b>。</li><li><b>人工确认认领：</b>财务针对这一张水单确认客户和唯一真实流水；不存在“在认领环节选择多张水单”。水单可在后续核销阶段关联多个账单。</li><li><b>自动已核销：</b>认领成功后，真实流水可分配金额与多个账单/运单/费用项待核金额合计完全相等，且同客户、同币种、时间、我方收款账户及费用项唯一分配均满足。</li><li><b>已比对待核销：</b>已经认领，但金额、币种、账单状态、时间、我方收款账户或费用项分配任一不满足时进入；例如到账金额与多个账单合计不相等。</li><li><b>手动核销：</b>工作台不提供入口，财务在现网收款管理按“真实流水 → 请款单 → 运单 → 费用项 → 分配金额”处理，结果与日志回写工作台。</li></ol><h3>多张水单核销一个账单</h3><ol><li>每张水单必须分别完成自动或人工确认认领，不能先按回款申请把多张水单金额汇总后自动认领。</li><li>所有参与水单均已唯一认领后，才汇总可分配金额与同一账单/费用项待核金额比对；完全相等且其余自动核销条件满足，相关水单均自动已核销。</li><li>任一水单认领失败，仅该水单进入自动认领异常；其他水单继续独立处理。均已认领但汇总金额不等、币种不一致或分配歧义时，相关水单进入已比对待核销。</li><li>金额小于或大于待核金额均不得自动核销，也不得自动转客户余额；由财务在现网收款管理手工分配。</li></ol><p><b>对应 PRD：</b>6. 自动认领、自动核销与放行规则；6.1 多水单、多账单与人工核销场景。</p>';

points[7][2]='<h3>审批客户放行（申请单整体审批）</h3><p>待放行审批页签按回款申请单统计，一行代表一个申请单。进入后展开该申请下全部待审批水单；水单确认金额合计与申请单关联的到期未结算账单金额计算放行比例。</p><h3>审批前查看水单</h3><p>每张水单都可在当前审批弹窗内查看水单图片、付款主体、付款/收款账户、付款时间、AI 识别金额与确认金额，不退出审批、不丢失审批意见。</p><h3>审批结果</h3><p>同意：申请单放行状态=已放行、客户下单解锁；驳回：申请单放行状态=放行已驳回、客户保持锁定。两种结果同步回显给申请下每张水单，但不改变认领/核销处理状态；审批不直接核销。</p><p><b>对应 PRD：</b>5. 审批客户放行；3.1 页签与操作。</p>';
points[8][2]='<h3>撤销放行（申请单整体）</h3><p><b>入口：</b>在“全部”页签通过放行状态筛选“已放行”，选中该回款申请下任意一张水单后点击“撤销放行”。不单独设置撤销放行页签。</p><h3>前置条件</h3><p>申请单放行状态必须为已放行，且申请下没有任何已核销或部分核销水单；否则按钮禁用，并提示先到现网收款管理撤销核销。</p><h3>提交与结果</h3><p>撤销原因必填。确认后申请单放行状态=已撤销放行，客户下单重新锁定；该申请下水单的自动认领异常、已比对待核销等处理状态保持原值。业务如需放行，可在原申请单重新发起放行申请；全程写操作日志。</p><p><b>对应 PRD：</b>3.2 放行申请单口径；5. 撤销放行。</p>';

points[0][2]='<h3>处理状态与页签流转</h3><p>列表一行是一张水单；“自动认领异常、已比对待核销、已核销、已驳回”互斥。“待放行审批”是放行状态待办，可与未核销状态并存。</p><h3>认领与核销的边界</h3><ol><li><b>自动认领：</b>只根据付款主体和付款账户（前四位+后四位）唯一确定认领客户；<b>不校验金额，不锁定或绑定真实流水</b>。</li><li><b>自动认领异常：</b>仅付款主体或付款账户无法唯一匹配客户时进入。该页签的“真实流水号”统一显示 <b>—</b>。</li><li><b>已比对待核销：</b>客户已认领，但财务审核/核销比对时真实流水、付款时间、我方收款账户、金额、币种、账单或费用项分配任一不满足时进入。该页签的“真实流水号”统一显示 <b>—</b>，避免误解为已绑定流水。</li><li><b>已核销：</b>审核匹配与自动核销条件均满足，或现网收款管理人工核销完成并回写后进入。</li></ol><h3>一张水单核销多个账单</h3><ol><li>水单先完成客户认领；随后在审核/核销阶段将真实流水可分配金额与多个账单、运单、费用项的待核金额合计比对。</li><li>金额、币种、账单状态、付款时间、我方收款账户和费用项唯一分配全部满足，自动已核销；任一不满足，进入已比对待核销。</li><li>金额小于或大于待核金额均不得自动核销，也不得自动转客户余额；财务在现网收款管理按“真实流水 → 请款单 → 运单 → 费用项 → 分配金额”处理。</li></ol><h3>多张水单核销一个账单</h3><ol><li>每张水单分别按付款主体、付款账户确认客户，不按申请单汇总金额做认领。</li><li>后续审核阶段可以汇总多张水单的可分配金额与同一账单/费用项比对；完全相等且其他自动核销条件均满足，相关水单均自动已核销。</li><li>任一水单客户认领失败，仅该水单进入自动认领异常；已认领但合计不等、币种不一致或分配歧义时，相关水单进入已比对待核销。</li></ol><h3>每个页签可执行的功能</h3><table class="modal-table"><thead><tr><th>页签</th><th>可操作功能</th><th>限制/结果</th></tr></thead><tbody><tr><td>自动认领异常</td><td>查看详情、重新匹配、指派、人工确认认领、驳回、导出</td><td>人工确认认领只确认客户；不选择真实流水、不能人工核销。</td></tr><tr><td>已比对待核销</td><td>查看详情、指派、驳回、导出；待放行审批时可审批放行；已放行且未核销时可撤销放行</td><td>真实流水和金额由财务审核；人工核销去现网收款管理，回写后变为已核销。</td></tr><tr><td>已核销</td><td>查看详情、导出</td><td>只读；撤销核销去现网收款管理，不能撤销放行。</td></tr><tr><td>已驳回</td><td>查看详情、导出</td><td>只读；业务需新建回款申请。</td></tr><tr><td>待放行审批</td><td>查看详情、审批放行、驳回、指派、导出</td><td>同意只更新放行状态并解锁客户；核销状态不变。</td></tr></tbody></table><p><b>对应 PRD：</b>3.1 状态、页签与可操作功能；6. 自动认领、自动核销与放行规则；6.1 多水单、多账单与人工核销场景。</p>';

points[10][2]='<h3>列表字段逻辑</h3><p>列表一行对应一张水单；“待放行审批”页签例外，按回款申请单汇总展示。回款编号是当前列表唯一主编号；关联请款单、运单、费用项仅在详情查看，不在列表重复展示。</p><table class="modal-table"><thead><tr><th>字段</th><th>口径与来源</th><th>展示/流转规则</th></tr></thead><tbody><tr><td>处理状态</td><td>水单处理记录的系统状态。</td><td>自动认领异常、已比对待核销、已核销、已驳回四种状态互斥；决定主页面签。</td></tr><tr><td>异常类型 / 异常原因</td><td>规则引擎按触发条件输出；财务不可直接改写。</td><td>付款主体、付款账户无法唯一匹配客户属于自动认领异常；真实流水、时间、收款账户、金额、币种、账单或费用项不满足属于已比对待核销。</td></tr><tr><td>真实流水号</td><td>银行/支付平台流水，来自收款管理。</td><td>自动认领异常、已比对待核销显示 <b>-</b>，因为尚未完成财务审核匹配；已核销显示最终核销关联流水号。</td></tr><tr><td>申请客户</td><td>回款申请创建时保存的客户快照。</td><td>只读；自动/人工认领确认的是认领客户，认领过程不锁定金额或真实流水。</td></tr><tr><td>业务员 / 客服 / 提交人</td><td>申请关联业务人员和创建人。</td><td>只读，用于来源追溯与数据权限；不等于财务当前处理人。</td></tr><tr><td>当前处理人</td><td>“指派处理人”保存的具备财务收款权限的在职人员。</td><td>未指派显示 <b>-</b>；只在指派时改变，重新匹配、放行、核销不自动更换；已核销、已驳回保留最后处理人。</td></tr><tr><td>付款主体 / 付款账号</td><td>水单 AI 识别与业务确认值。</td><td>用于按付款主体、付款账号前四位+后四位确认客户；原始值不可覆盖，人工调整另存前后值与原因。</td></tr><tr><td>付款时间 / 收款账号</td><td>付款时间优先水单 AI 识别，缺失时取上传时间并保存来源；收款账号来自水单识别。</td><td>均在财务审核/核销比对阶段与真实流水、我方账户校验；不满足时不得自动核销。</td></tr><tr><td>真实到账金额 / 关联账单金额</td><td>水单确认金额与预核销关联账单的待核销金额。</td><td>自动认领不使用金额；财务审核时再比对。完全相等且其他条件满足才自动核销；偏大、偏小或无法唯一分配进入已比对待核销，不自动转客户余额。</td></tr><tr><td>放行状态</td><td>回款申请单的独立放行记录。</td><td>未申请放行、待放行审批、已放行、放行已驳回、已撤销放行；不改变水单的核销处理状态。</td></tr></tbody></table><p><b>对应 PRD：</b>3. 状态、页签与字典；4.2 列表字段；4.3 列表字段逻辑。</p>';

(()=>{const nav=document.getElementById('frameNav'),list=document.getElementById('frameNavList'),head=nav.querySelector('.frame-tray-head span'),pin=document.getElementById('pinNav');const current=location.pathname.split('/').pop()||'';const menus={finance:[['▤','请款单管理','请款单管理-指定票件整合-MVP.html'],['⚠','回款处理工作台','自动认领与核销-异常处理-MVP.html'],['▣','客户账单与水单','客户端首页-客户账单与水单识别-MVP.html']],prd:[['◫','回款流程图','回款核销协同工作台-业务财务-MVP.html#process'],['▦','确认场景','回款核销协同工作台-业务财务-MVP.html#scenarios'],['☷','异常、打回与字典','回款异常与打回类型-MVP.html'],['▤','请款单交互 PRD','请款单管理-回款申请-交互PRD.html'],['⚠','回款工作台交互 PRD','财务异常工作台-回款核销-交互PRD.html'],['✓','财务签字清单','回款核销-业务签字清单.html'],['↻','本次更新记录','回款核销-本次更新记录.html']]};let kind='finance',pinned=false;function render(){head.textContent=kind==='finance'?'财务':'PRD';list.innerHTML='<div class="frame-menu-group">'+(kind==='finance'?'回款功能':'流程与交付件')+'</div>'+menus[kind].map(item=>'<button type="button" class="frame-menu-item '+(item[2].split('#')[0]===current?'active':'')+'" data-href="'+item[2]+'"><i>'+item[0]+'</i><span>'+item[1]+'</span></button>').join('');nav.querySelectorAll('.frame-root').forEach(btn=>btn.classList.toggle('active',btn.dataset.navKind===kind))}function open(next,keep){kind=next||kind;if(keep!==undefined)pinned=keep;nav.classList.add('open');nav.classList.toggle('pinned',pinned);pin.textContent=pinned?'×':'⌁';render()}function close(){if(!pinned)nav.classList.remove('open')}nav.querySelectorAll('.frame-root').forEach(btn=>{btn.addEventListener('mouseenter',()=>open(btn.dataset.navKind,false));btn.addEventListener('focus',()=>open(btn.dataset.navKind,false));btn.addEventListener('click',()=>open(btn.dataset.navKind,true))});nav.addEventListener('mouseenter',()=>open(kind,pinned));nav.addEventListener('mouseleave',close);pin.addEventListener('click',()=>open(kind,!pinned));nav.querySelector('.frame-logo').addEventListener('click',()=>{pinned=false;nav.classList.remove('pinned','open')});list.addEventListener('click',e=>{const button=e.target.closest('[data-href]');if(button)location.href=button.dataset.href});render()})();
/*
 * 交互恢复兜底：历史迭代为同一按钮叠加了多层监听，部分监听在捕获阶段
 * 截断了业务动作。以下仅替换工具栏按钮节点，保留页面、数据和 PRD 编号，
 * 使按钮本体只走业务弹窗；橙色序号才打开 PRD 说明。
 */
(()=>{
  const toolbar=document.querySelector('.toolbar');
  if(!toolbar) return;
  const pointByAction={'查看水单与真实流水':2,'重新匹配':3,'指派处理人':4,'驳回':5,'人工确认认领':6,'审批客户放行':7,'撤销放行':8,'导出':9};
  function runAction(action){
    const r=record();
    if(!r&&action!=='导出'){
      showModal('请选择记录','<p>请先在列表中选择一条水单记录。</p>');
      return;
    }
    if(action==='重新匹配'){
      if(r.state==='自动认领异常'){
        r.state='已比对待核销';
        r.type='核销条件未满足';
        r.reason='重新匹配成功，等待财务审核匹配';
        r.suggestion='请在财务审核/收款管理阶段匹配流水与金额';
      }else{
        r.reason='已执行全量重新匹配';
        r.suggestion='请查看最新认领与核销校验结果';
      }
      document.querySelector('.notice').textContent='已对 '+r.id+' 执行全量重新匹配，并追加操作日志。';
      draw();
      return;
    }
    if(action==='导出'&&!r){
      showModal('导出','<p>将按当前筛选条件及当前财务数据权限导出，不修改任何回款状态。</p>'+actionButtons('创建导出任务','export'));
      return;
    }
    showAction(action);
  }
  toolbar.querySelectorAll('[data-action]').forEach(oldButton=>{
    const action=oldButton.dataset.action;
    const button=oldButton.cloneNode(true);
    button.querySelectorAll('.pin').forEach(pin=>pin.remove());
    oldButton.replaceWith(button);
    button.addEventListener('click',event=>{
      if(event.target.closest('.pin')) return;
      event.preventDefault();
      runAction(action);
    });
    const pointIndex=pointByAction[action];
    if(pointIndex===undefined) return;
    const pin=document.createElement('button');
    pin.type='button';
    pin.className='pin';
    pin.textContent=String(pointIndex+1);
    pin.title='查看 PRD 说明';
    pin.style.cssText='position:absolute;right:-8px;top:-8px;z-index:2';
    button.style.position='relative';
    pin.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      open((pointIndex+1)+'. '+points[pointIndex][0],points[pointIndex][1]);
    });
    button.appendChild(pin);
  });
})();
</script>
