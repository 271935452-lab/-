<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户管理 · 编辑 MVP</title>
  <link rel="stylesheet" href="../二期/ess-prototype-prd.css" />
  <style>
    :root {
      --bg: #f0f2f5; --card: #fff; --line: #e8e8e8;
      --text: rgba(0,0,0,.85); --sub: rgba(0,0,0,.45); --blue: #1890ff; --req: #ff4d4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 13px; color: var(--text); background: var(--bg);
    }
    button, input, select, textarea { font: inherit; }

    .page { min-height: 100vh; padding: 16px; }
    .demo-bar {
      max-width: 1200px; margin: 0 auto 12px; padding: 8px 12px;
      background: #fffbe6; border: 1px solid #ffe58f; font-size: 12px; color: #ad6800;
    }

    .mask {
      max-width: 1200px; margin: 0 auto; background: rgba(0,0,0,.45);
      border-radius: 2px; padding: 20px 12px;
    }
    .modal {
      background: var(--card); border-radius: 2px; box-shadow: 0 4px 24px rgba(0,0,0,.15);
      max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column;
      max-height: calc(100vh - 48px);
    }
    .modal-hd {
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .modal-hd h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .modal-close { border: none; background: none; font-size: 20px; color: var(--sub); cursor: pointer; }

    .modal-bd { padding: 12px 16px; overflow: auto; flex: 1; }
    .form-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 14px;
    }
    @media (max-width: 960px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }

    .section-title {
      grid-column: 1 / -1; margin: 6px 0 2px; padding-top: 10px;
      border-top: 1px dashed #f0f0f0; font-size: 13px; font-weight: 600;
    }
    .section-title:first-child { border-top: none; padding-top: 0; margin-top: 0; }

    .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
    .req { color: var(--req); margin-right: 2px; }
    .field-hint { font-size: 11px; color: var(--sub); margin-top: 4px; line-height: 1.45; }
    .field input, .field select, .field textarea {
      width: 100%; height: 30px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 0 8px;
    }
    .field textarea { height: auto; min-height: 56px; padding: 6px 8px; resize: vertical; }
    .field.span-2 { grid-column: span 2; }
    .field.span-4 { grid-column: 1 / -1; }
    .field input[readonly] { background: #fafafa; color: var(--sub); }

    .modal-ft {
      padding: 10px 16px; border-top: 1px solid var(--line);
      display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
    }
    .btn {
      height: 32px; padding: 0 16px; border-radius: 2px; cursor: pointer;
      border: 1px solid #d9d9d9; background: #fff;
    }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  </style>
</head>
<body data-fcl-nav="core-flow-v3">
  <div class="page">
    <div class="demo-bar">
      <strong>客户主档</strong>含隐私/财务字段 · 整柜岗位绑定已迁至独立子表
      <a href="整柜客户岗位绑定-MVP.html" style="margin-left:8px;color:#1890ff">整柜客户岗位绑定 →</a>
    </div>

    <div class="mask">
      <div class="modal" role="dialog" aria-labelledby="modalTitle">
        <div class="modal-hd">
          <h1 id="modalTitle">编辑数据</h1>
          <button type="button" class="modal-close" aria-label="关闭">×</button>
        </div>
        <div class="modal-bd">
          <div class="form-grid">
            <div class="section-title">基本信息</div>
            <div class="field">
              <label><span class="req">*</span>客户简称</label>
              <input type="text" value="宁波乐生" />
            </div>
            <div class="field span-2">
              <label><span class="req">*</span>客户全称</label>
              <input type="text" value="宁波乐生国际贸易有限公司" />
            </div>
            <div class="field">
              <label>客户电话</label>
              <input type="text" value="0574-88888888" />
            </div>
            <div class="field">
              <label>客户类别</label>
              <select><option selected>直客</option><option>同行</option></select>
            </div>
            <div class="field">
              <label>客户属性</label>
              <select><option>正式客户</option></select>
            </div>
            <div class="field">
              <label>客户状态</label>
              <select><option selected>启用</option><option>停用</option></select>
            </div>
            <div class="field">
              <label>所在地区</label>
              <input type="text" value="浙江省宁波市" />
            </div>
            <div class="field span-4">
              <label>详细地址</label>
              <textarea>浙江省宁波市鄞州区某某路 88 号</textarea>
            </div>

            <div class="section-title">系统信息</div>
            <div class="field">
              <label>客户代码</label>
              <input type="text" readonly value="CUST-NB-001" />
            </div>
            <div class="field">
              <label>登录帐号</label>
              <input type="text" value="nblesheng" />
            </div>
            <div class="field">
              <label>登录密码</label>
              <input type="password" value="******" />
            </div>
            <div class="field">
              <label>产品组</label>
              <select><option>海运+整柜</option></select>
            </div>
            <div class="field">
              <label>业务员<span class="req">*</span></label>
              <select id="custSalesperson"><option selected>任杰</option><option>王敏</option></select>
            </div>
            <div class="field">
              <label>客服</label>
              <select><option>Olaf(青)</option></select>
            </div>
            <div class="field span-2">
              <label class="hint-inline" style="font-size:11px;color:var(--sub)">散货客服仍用主档；整柜四岗（客服/订舱员/报关员/海外对接）见「整柜客户岗位绑定」，<strong>默认跟随业务员团队</strong>。</label>
            </div>

            <div class="section-title">整柜岗位（外链）</div>
            <div class="field span-4">
              <label>整柜客户岗位绑定</label>
              <div style="display:flex;align-items:center;gap:10px;min-height:30px">
                <input type="text" readonly value="绑定业务员：任杰 · 默认继承其岗位团队 · 可客户侧修改" style="flex:1" />
                <a href="整柜客户岗位绑定-MVP.html" class="btn btn-primary" style="display:inline-flex;align-items:center;text-decoration:none;height:30px;padding:0 12px">前往配置</a>
              </div>
              <p class="field-hint" style="font-size:11px;color:var(--sub);margin:6px 0 0;line-height:1.5">
                客户绑业务员 → 默认继承业务员整柜团队 → 可改；<strong>运单权限跟客户最终配置</strong>。不在此页维护四岗人员。
              </p>
            </div>

            <div class="section-title">财务信息</div>
            <div class="field">
              <label>结算模式</label>
              <select><option>月结</option></select>
            </div>
            <div class="field">
              <label>结算周期</label>
              <select><option>30 天</option></select>
            </div>
            <div class="field">
              <label>信用额度</label>
              <input type="text" value="500000" />
            </div>
            <div class="field">
              <label>币种</label>
              <select><option>CNY</option><option>USD</option></select>
            </div>
            <div class="field">
              <label>开户名</label>
              <input type="text" />
            </div>
            <div class="field">
              <label>开户行</label>
              <input type="text" />
            </div>
            <div class="field span-2">
              <label>银行账号</label>
              <input type="text" />
            </div>
          </div>
        </div>
        <footer class="modal-ft">
          <button type="button" class="btn">取消</button>
          <button type="button" class="btn btn-primary">确定</button>
        </footer>
      </div>
    </div>
  </div>

  <div class="ess-prd-source" hidden aria-hidden="true" data-prd-href="客户管理-编辑-权限配置-MVP-PRD.html">
    <span class="ess-prd-chip">PRD · 客户管理 · 与整柜岗位子表关系</span>
  </div>
  <script src="../二期/ess-prototype-prd.js"></script>
  <link rel="stylesheet" href="../二期/ess-prototype-nav.css" />
  <script src="fcl-core-flow-v3-nav.js" defer></script>
</body>
</html>
