<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>查验报表 · 国内/国外周分析 · MVP</title>
  <link rel="stylesheet" href="../../二期/ess-prototype-prd.css" />
  <style>
    :root {
      --bg: #f0f2f5; --card: #fff; --line: #e8e8e8;
      --text: rgba(0,0,0,.85); --sub: rgba(0,0,0,.45);
      --blue: #1890ff; --green: #52c41a; --red: #ff4d4f; --orange: #fa8c16; --purple: #722ed1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 13px; color: var(--text); background: var(--bg);
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .topbar {
      height: 48px; background: #001529; color: #fff;
      display: flex; align-items: center; padding: 0 16px; gap: 24px;
    }
    .topbar .logo { font-weight: 700; letter-spacing: .5px; }
    .topbar .nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
    .topbar .nav a {
      color: rgba(255,255,255,.75); text-decoration: none;
      padding: 6px 10px; border-radius: 2px; font-size: 12px;
    }
    .topbar .nav a.on, .topbar .nav a:hover { color: #fff; background: rgba(255,255,255,.12); }
    .topbar .right { color: rgba(255,255,255,.55); font-size: 12px; }
    .layout { max-width: 1520px; margin: 0 auto; padding: 16px; }
    body.ess-prd-page:not(.ess-prd-collapsed) .layout { max-width: none; }

    .page-hd { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .page-hd h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .page-hd .sub { margin: 4px 0 0; color: var(--sub); font-size: 12px; line-height: 1.55; max-width: 920px; }
    .page-hd .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .page-hd .links a {
      color: var(--blue); font-size: 12px; padding: 4px 8px;
      border: 1px solid #91d5ff; border-radius: 2px; background: #e6f7ff; text-decoration: none;
    }

    .badge {
      display: inline-block; padding: 0 6px; border-radius: 2px; font-size: 10px;
      font-weight: 700; line-height: 18px; vertical-align: middle; margin-left: 4px;
    }
    .badge.new { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }

    .panel {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 2px; margin-bottom: 12px;
    }
    .filter-bd { padding: 14px 16px 10px; }
    .filter-grid {
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px 16px;
    }
    @media (max-width: 1100px) { .filter-grid { grid-template-columns: repeat(3, 1fr); } }
    .filter-item label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
    .filter-item input, .filter-item select {
      width: 100%; height: 32px; border: 1px solid #d9d9d9;
      border-radius: 2px; padding: 0 8px; font: inherit;
    }
    .filter-item-span2 { grid-column: span 2; }
    .date-range {
      display: flex; align-items: center; gap: 8px;
    }
    .date-range input { flex: 1; min-width: 0; }
    .date-range > span { color: var(--sub); font-size: 12px; flex: none; }
    .filter-actions {
      padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap;
      justify-content: flex-end; align-items: center;
    }
    .btn {
      height: 32px; padding: 0 14px; border-radius: 2px;
      border: 1px solid #d9d9d9; background: #fff; font: inherit; cursor: pointer;
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-primary:hover { color: #fff; opacity: .92; }
    .btn-ok { background: var(--green); border-color: var(--green); color: #fff; }
    .btn-ok:hover { color: #fff; opacity: .92; }

    .dim-tabs {
      display: flex; border-bottom: 1px solid var(--line); background: #fafafa; padding: 0 16px; flex-wrap: wrap;
    }
    .dim-tab {
      padding: 12px 16px; border: none; background: none; font: inherit; font-size: 13px;
      color: var(--sub); cursor: pointer; position: relative;
    }
    .dim-tab.active { color: var(--blue); font-weight: 600; }
    .dim-tab.active::after {
      content: ""; position: absolute; left: 16px; right: 16px; bottom: 0;
      height: 2px; background: var(--blue);
    }
    .dim-tab .cnt {
      display: inline-block; margin-left: 4px; padding: 0 6px; height: 18px; line-height: 18px;
      border-radius: 9px; background: #f0f0f0; font-size: 11px; font-weight: 600;
    }
    .dim-tab.active .cnt { background: #e6f7ff; color: var(--blue); }

    .kpi-row {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 16px;
    }
    @media (max-width: 1200px) { .kpi-row { grid-template-columns: repeat(3, 1fr); } }
    .kpi-row.five { grid-template-columns: repeat(5, 1fr); }
    .kpi {
      border: 1px solid var(--line); border-radius: 2px; padding: 14px 16px; background: #fafafa;
    }
    .kpi-label { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
    .kpi-value { font-size: 22px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .kpi-value.ok { color: var(--green); }
    .kpi-value.warn { color: var(--orange); }
    .kpi-value.bad { color: var(--red); }
    .kpi-value.purple { color: var(--purple); }
    .kpi-sub { font-size: 11px; color: var(--sub); margin-top: 6px; }

    .sec-hd {
      padding: 10px 16px; border-bottom: 1px solid var(--line);
      font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .sec-hd .hint { font-weight: 400; font-size: 12px; color: var(--sub); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1100px; font-size: 12px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; text-align: left; white-space: nowrap; }
    th { background: #fafafa; color: var(--sub); font-weight: 600; }
    tr:hover td { background: #fafafa; }
    td.wrap { white-space: normal; max-width: 280px; line-height: 1.45; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .tag {
      display: inline-block; padding: 1px 8px; border-radius: 2px; font-size: 11px;
      font-weight: 600; border: 1px solid;
    }
    .tag-ck { color: #d46b08; background: #fff7e6; border-color: #ffd591; }
    .tag-pass { color: #389e0d; background: #f6ffed; border-color: #b7eb8f; }
    .tag-ticket { color: #c41d7f; background: #fff0f6; border-color: #ffadd2; }
    .tag-dom { color: #096dd9; background: #e6f7ff; border-color: #91d5ff; }
    .tag-os { color: #531dab; background: #f9f0ff; border-color: #d3adf7; }
    .tag-gray { color: #8c8c8c; background: #fafafa; border-color: #d9d9d9; }
    .tag-dump { color: #cf1322; background: #fff1f0; border-color: #ffa39e; }
    .tag-ok { color: #389e0d; background: #f6ffed; border-color: #b7eb8f; }
    .muted { color: var(--sub); }
    .link-btn {
      border: none; background: none; color: var(--blue); cursor: pointer; padding: 0 4px; font: inherit; font-size: 12px;
    }

    /* 周分析布局 */
    .week-grid {
      display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; padding: 16px;
    }
    @media (max-width: 1100px) { .week-grid { grid-template-columns: 1fr; } }
    .week-card {
      border: 1px solid var(--line); border-radius: 2px; padding: 14px; background: #fff;
    }
    .week-card h4 {
      margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .pie-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .pie {
      width: 120px; height: 120px; border-radius: 50%;
      flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }
    .pie-legend { flex: 1; min-width: 180px; font-size: 12px; }
    .pie-legend .row {
      display: flex; justify-content: space-between; gap: 8px; padding: 3px 0;
      border-bottom: 1px dashed #f0f0f0;
    }
    .pie-legend .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
    }
    .stat-table { width: 100%; min-width: 0; margin-top: 10px; }
    .stat-table th, .stat-table td { padding: 6px 8px; }
    .bar-cell { min-width: 100px; }
    .hbar {
      height: 10px; background: #f5f5f5; border-radius: 2px; overflow: hidden;
    }
    .hbar > i { display: block; height: 100%; background: #1890ff; }
    .hbar > i.ck { background: #fa8c16; }
    .note-box {
      margin: 0 16px 16px; padding: 12px 14px; background: #f6ffed;
      border: 1px solid #b7eb8f; border-radius: 2px; font-size: 12px; line-height: 1.7; color: #135200;
    }
    .note-box.os { background: #f9f0ff; border-color: #d3adf7; color: #22075e; }
    .note-box h5 { margin: 0 0 6px; font-size: 13px; }
    .note-box .case { margin: 4px 0 0; padding-left: 12px; border-left: 3px solid #91d5ff; }
    .note-box.os .case { border-left-color: #b37feb; }
    .note-box .case b { color: #003a8c; }
    .note-box.os .case b { color: #531dab; }
    .dual-split {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 16px;
    }
    @media (max-width: 1100px) { .dual-split { grid-template-columns: 1fr; } }

    .tl {
      display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .tl-step {
      display: inline-block; padding: 1px 6px; border-radius: 2px;
      border: 1px solid #d9d9d9; background: #fafafa; color: #595959;
    }
    .tl-step.done { background: #f6ffed; border-color: #b7eb8f; color: #389e0d; }
    .tl-step.cur { background: #fff7e6; border-color: #ffd591; color: #d46b08; }
    .tl-step.wait { color: #bfbfbf; border-style: dashed; }
    .tl-arrow { color: #bfbfbf; font-size: 10px; }
    .dur-ok { color: #389e0d; font-weight: 600; }
    .dur-warn { color: #d46b08; font-weight: 600; }
    .dur-bad { color: #cf1322; font-weight: 600; }
    .area-tabs {
      display: flex; gap: 0; margin: 0 16px 12px; border-bottom: 1px solid var(--line);
    }
    .area-tabs.hidden { display: none; }
    .area-tab {
      position: relative; padding: 8px 18px; border: none; background: transparent;
      cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .area-tab .cnt {
      display: inline-block; margin-left: 4px; padding: 0 6px; height: 18px; line-height: 18px;
      border-radius: 9px; background: #f5f5f5; font-size: 11px; font-weight: 600;
    }
    .area-tab.active { font-weight: 600; }
    .area-tab[data-area="国内"].active { color: #0050b3; border-bottom-color: #1890ff; }
    .area-tab[data-area="国内"].active .cnt { background: #e6f7ff; color: #0050b3; }
    .area-tab[data-area="国外"].active { color: #531dab; border-bottom-color: #722ed1; }
    .area-tab[data-area="国外"].active .cnt { background: #f9f0ff; color: #531dab; }
    .area-tab .tip { display: block; font-size: 10px; font-weight: 400; color: var(--muted); margin-top: 1px; }
    .tbd {
      display: inline-block; margin-left: 4px; padding: 0 4px; font-size: 10px; font-weight: 700;
      color: #cf1322; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 2px;
      vertical-align: middle;
    }
    .remark-cell { white-space: normal; max-width: 200px; line-height: 1.45; font-size: 12px; }
    .reason-cell {
      white-space: normal; min-width: 280px; max-width: 420px; width: 320px;
      line-height: 1.4; font-size: 12px;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
      overflow: hidden; word-break: break-word;
    }
    .tag-dual {
      color: #c41d7f; background: #fff0f6; border: 1px solid #ffadd2; cursor: pointer;
      font-weight: 600;
    }
    .tag-dual:hover { filter: brightness(0.97); }
    tr.flash-peer td { background: #fff0f6 !important; animation: peerFlash 1.6s ease; }
    @keyframes peerFlash {
      0%, 100% { background: transparent; }
      20%, 60% { background: #fff0f6; }
    }

    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(80px);
      background: rgba(0,0,0,.78); color: #fff; padding: 10px 16px; border-radius: 4px;
      font-size: 13px; z-index: 2000; opacity: 0; transition: .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .ess-prd-side h3 { margin: 14px 0 6px; font-size: 13px; }
    .ess-prd-side ul { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.65; }
    .ess-prd-side p { font-size: 12px; line-height: 1.65; margin: 0 0 8px; }
    #weekPanel { display: none; }
    #weekPanel.show { display: block; }
    #tablePanel { display: none; }
    #tablePanel.show { display: block; }
  </style>
</head>

  <script>
(function () {
  var dim = "week";
  var areaTab = "国内";
  var TODAY = "2026-08-06";

  /** 顶部筛了区域用筛选项；未筛（全部）则用下方国内/国外页签 */
  function effectiveArea() {
    return $("qArea").value || areaTab;
  }

  function syncAreaTabs() {
    var tabs = $("areaTabs");
    if (!tabs) return;
    /* 周分析不分国内/国外子页签；进度/运单在「全部」时才分 */
    var show = !$("qArea").value && (dim === "prog" || dim === "wb");
    tabs.classList.toggle("hidden", !show);
    document.querySelectorAll(".area-tab").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-area") === areaTab);
    });
    var list = filteredBl();
    $("cntAreaDom").textContent = list.filter(function (r) { return r.area === "国内"; }).length;
    $("cntAreaOs").textContent = list.filter(function (r) { return r.area === "国外"; }).length;
  }

  function viewWb() {
    var area = effectiveArea();
    return filteredWb().filter(function (r) { return r.area === area; });
  }

  /* 周汇总（对齐 Excel 总计口径，含正常柜） */
  var WEEK_META = {

    if (dual) {
      var cntr = dual.getAttribute("data-dual-cntr");
      var to = dual.getAttribute("data-dual-to");
      var peer = BL.find(function (r) { return r.cntr === cntr && r.area === to; });
      areaTab = to;
      $("qArea").value = "";
      $("qKw").value = cntr;
      if (peer && peer.week) $("qWeek").value = peer.week;
      if (dim === "week" || dim === "sum") dim = "prog";
      render();
      setTimeout(function () {
        var tr = document.querySelector("tr[data-cntr='" + cntr + "']");
        if (tr) {
          tr.classList.add("flash-peer");
          tr.scrollIntoView({ block: "center", behavior: "smooth" });
        }
      }, 80);
      toast("已跳转" + to + " · " + cntr + (peer ? (" · " + (peer.outcome || peer.st)) : ""));
      return;
    }
    var goWb = e.target.closest("[data-go-wb]");
    if (goWb) {
      var wb = goWb.getAttribute("data-go-wb");
      if (!wb) { toast("本票无关联运单"); return; }
      dim = "wb";
      $("qKw").value = wb;
      render();
      toast("已切换运单维度 · " + wb);
      return;
    }
    var goProg = e.target.closest("[data-go-prog]");
    if (goProg) {
      dim = "prog";
      $("qKw").value = goProg.getAttribute("data-go-prog");
      render();
      toast("已切换查验进度");
      return;
    }
    var bl = e.target.closest("[data-bl]");
    if (bl) toast("示意：轨迹时间轴 · " + bl.getAttribute("data-bl"));
  }
  $("tablePanel").addEventListener("click", onTableClick);

  $("essPrdFab").onclick = function () {
    document.body.classList.remove("ess-prd-collapsed");
    document.body.classList.add("ess-prd-open");
  };
  function closePrd() {
    document.body.classList.add("ess-prd-collapsed");
    document.body.classList.remove("ess-prd-open");
  }
  $("essPrdClose").onclick = closePrd;
  $("essPrdBackdrop").onclick = closePrd;

  try { render(); } catch (e) { console.error(e); }
})();
  </script>
  <script src="../ess-branch-back.js" defer></script>
</body>
</html>
