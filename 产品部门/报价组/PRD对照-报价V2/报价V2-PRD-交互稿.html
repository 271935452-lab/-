<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报价 V2 · PRD（逐点交互稿 · 总览）</title>
  <link rel="stylesheet" href="../quote-v2-prd-interactive.css" />
</head>
<body>
  <div class="page">
    <p class="top-links">
      <a href="../报价组-导航.html#s-v2">← V2 导航</a> ·
      <a href="../散货AI询价报价-需求PRD.html">组总 PRD</a>
    </p>
    <header class="hero">
      <h1>报价 V2 · PRD（逐点交互稿）</h1>
      <p>
        写法对齐 <a href="../../财务部门/风控报表-超期退仓推送-MVP-PRD-交互稿.html">超期退仓 RISK-006 交互稿</a>：
        各原型页橙色数字与本文逐点一致，点数字或点条目展开「为啥做 / 页面上 / 系统里」。
        数据同源 <code>quote-v2-review-points.js</code>。
      </p>
    </header>
    <p class="callout">
      <strong>模块导航</strong>（每页编号从 1 起）：业务员询价 1.1～1.4、询价详情、报价员核实、地址库、海外履约回写。
    </p>
    <div class="nav-grid" id="pageNav"></div>

    <h2 class="sec">全文 · 功能说明（按页）</h2>
    <div id="allFeatures"></div>

    <p class="foot">QUOTE-V2 · 与 quote-v2-review-points.js 同步</p>
  </div>
  <script src="../quote-v2-review-points.js"></script>
  <script>
(function () {
  var links = window.QUOTE_V2_PAGE_LINKS || [];
  var nav = document.getElementById("pageNav");
  if (nav) {
    nav.innerHTML = links.map(function (x) {
      return '<a href="../' + x.prd + '"><strong>' + x.label + '</strong> · 原型 <code>' + x.proto + '</code></a>';
    }).join("");
  }
  var box = document.getElementById("allFeatures");
  var pages = window.QUOTE_V2_FEATURE_PAGES || [];
  if (box) {
    box.innerHTML = pages.map(function (f) {
      var link = links.filter(function (l) { return l.page === f.page; })[0];
      var prd = link ? '<a href="../' + link.prd + '">本页逐点 →</a> · ' : "";
      var proto = link ? '<a href="../' + link.proto + '">打开原型</a>' : "";
      return '<div class="feat-page" id="feat-' + f.page + '">' +
        '<h4>page ' + f.page + ' · ' + f.title + '</h4>' +
        '<p class="sum">' + f.summary + '</p>' + prd + proto +
        '<ul>' + (f.bullets || []).map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul></div>';
    }).join("");
  }
})();
  </script>
</body>
</html>
