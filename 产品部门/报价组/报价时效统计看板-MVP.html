<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报价时效统计看板 · MVP</title>
  <link rel="stylesheet" href="../../二期/ess-prototype-prd.css" />
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #fff;
      --line: #e8e8e8;
      --text: rgba(0,0,0,.85);
      --sub: rgba(0,0,0,.45);
      --blue: #1890ff;
      --green: #52c41a;
      --red: #ff4d4f;
      --orange: #fa8c16;
      --purple: #722ed1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 13px; color: var(--text); background: var(--bg);
    }
    .layout { max-width: 1400px; margin: 0 auto; padding: 16px; }
    body.ess-prd-page:not(.ess-prd-collapsed) .layout { max-width: none; margin: 0; padding: 16px 16px 32px 16px; }
    .page-hd { margin-bottom: 12px; }
    .page-hd h1 { margin: 0; font-size: 18px; font-weight: 600; }

    .panel {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 2px; margin-bottom: 12px;
    }
    .filter-bd { padding: 14px 16px 10px; }
    .filter-grid {
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px 16px;
    }
    @media (max-width: 1100px) { .filter-grid { grid-template-columns: repeat(3, 1fr); } }
    .filter-item label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
    .filter-item input, .filter-item select {
      width: 100%; height: 32px; border: 1px solid #d9d9d9;
      border-radius: 2px; padding: 0 8px; font: inherit;
    }
    .filter-actions {
      padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap;
      justify-content: flex-end; align-items: center;
    }
    .btn {
      height: 32px; padding: 0 14px; border-radius: 2px;
      border: 1px solid #d9d9d9; background: #fff; font: inherit; cursor: pointer;
    }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }

    .dim-tabs {
      display: flex; border-bottom: 1px solid var(--line); background: #fafafa; padding: 0 16px;
    }
    .dim-tab {
      padding: 12px 20px; border: none; background: none; font: inherit; font-size: 14px;
      color: var(--sub); cursor: pointer; position: relative;
    }
    .dim-tab.active { color: var(--blue); font-weight: 600; }
    .dim-tab.active::after {
      content: ""; position: absolute; left: 20px; right: 20px; bottom: 0;
      height: 2px; background: var(--blue);
    }
    .tag-fcl, .tag-lcl {
      display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 10px; margin-left: 6px;
    }
    .tag-fcl { background: #f9f0ff; color: var(--purple); border: 1px solid #d3adf7; }
    .tag-lcl { background: #e6f7ff; color: var(--blue); border: 1px solid #91d5ff; }

    .kpi-row {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 16px;
    }
    @media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
    .kpi-row.query-highlight { background: #f6ffed; border-bottom: 1px solid #b7eb8f; }
    .kpi {
      border: 1px solid var(--line); border-radius: 2px; padding: 14px 16px; background: #fafafa;
    }
    .kpi-label { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
    .kpi-value { font-size: 26px; font-weight: 700; line-height: 1.2; }
    .kpi-value.ok { color: var(--green); }
    .kpi-value.warn { color: var(--orange); }
    .kpi-value.bad { color: var(--red); }
    .kpi-sub { font-size: 11px; color: var(--sub); margin-top: 6px; }

    .sec-hd {
      padding: 10px 16px; border-bottom: 1px solid var(--line);
      font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    }
    .sec-hd .hint { font-weight: 400; font-size: 12px; color: var(--sub); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; font-size: 12px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; text-align: left; white-space: nowrap; }
    th { background: #fafafa; color: var(--sub); font-weight: 500; }
    tr:hover td { background: #fafafa; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .badge {
      display: inline-block; padding: 1px 8px; border-radius: 2px; font-size: 11px;
    }
    .badge-ok { background: #f6ffed; color: var(--green); border: 1px solid #b7eb8f; }
    .badge-warn { background: #fff7e6; color: var(--orange); border: 1px solid #ffd591; }
    .badge-bad { background: #fff1f0; color: var(--red); border: 1px solid #ffa39e; }
    .bar-cell { min-width: 120px; }
    .bar-track { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; border-radius: 4px; }
    .bar-fill.ok { background: var(--green); }
    .bar-fill.warn { background: var(--orange); }
    .bar-fill.bad { background: var(--red); }
    .link { color: var(--blue); cursor: pointer; }
    .link:hover { text-decoration: underline; }
    .link-muted { color: var(--sub); cursor: default; }
    tr.row-drill { cursor: pointer; }
    tr.row-drill:hover td { background: #e6f7ff; }
    tr.row-drill.row-expanded td { background: #e6f7ff; }

    .inline-detail td {
      padding: 0 !important;
      background: #fafafa;
      border-bottom: 1px solid var(--line);
    }
    .inline-detail-inner {
      padding: 10px 16px 14px 32px;
      border-left: 3px solid var(--blue);
      background: #f7fbff;
    }
    .inline-detail-hd {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; font-size: 12px; color: var(--sub);
    }
    .inline-detail-hd strong { color: var(--text); }
    .inline-detail table { min-width: 860px; background: #fff; border: 1px solid var(--line); }
    .inline-detail table th { font-size: 11px; }
    .inline-detail table td { font-size: 11px; white-space: nowrap; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="page-hd">
      <p style="margin:0 0 8px;font-size:13px;"><a href="报价组-导航.html">← 报价组导航</a></p>
      <h1>报价时效统计看板</h1>
    </div>

    <section class="panel">
      <div class="filter-bd">
        <div class="filter-grid">
          <div class="filter-item">
            <label>统计月份</label>
            <input type="month" id="statMonth" value="2026-07" />
          </div>
          <div class="filter-item">
            <label>统计日期</label>
            <input type="date" id="statDate" value="2026-07-24" />
          </div>
          <div class="filter-item">
            <label>报价员</label>
            <select id="quoterFilter">
              <option value="">全部</option>
              <option>张三</option>
              <option>李四</option>
              <option>王五</option>
              <option>赵六</option>
            </select>
          </div>
          <div class="filter-item">
            <label>是否超时</label>
            <select id="timeoutFilter">
              <option value="">全部</option>
              <option value="1">仅超时(&gt;20min)</option>
              <option value="0">仅未超时</option>
            </select>
          </div>
          <div class="filter-item">
            <label>询价单号</label>
            <input type="text" placeholder="模糊搜索" />
          </div>
          <div class="filter-item">
            <label>业务员</label>
            <input type="text" placeholder="可选" />
          </div>
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" type="button" onclick="refreshData()">查询</button>
        <button class="btn" type="button">重置</button>
        <button class="btn" type="button">导出 Excel</button>
      </div>
    </section>

    <section class="panel">
      <div class="dim-tabs">
        <button class="dim-tab active" type="button" data-dim="lcl" onclick="switchDim('lcl')">
          散货<span class="tag-lcl">LCL</span>
        </button>
        <button class="dim-tab" type="button" data-dim="fcl" onclick="switchDim('fcl')">
          整柜<span class="tag-fcl">FCL</span>
        </button>
      </div>

      <div class="kpi-row query-highlight" id="kpiRow"></div>
    </section>

    <section class="panel">
      <div class="sec-hd">
        <span id="summaryTitle">当前查询 · 按报价员汇总</span>
        <span class="hint" id="dimHint2">· 散货 · 2026年7月 · 点击行查看明细</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="summaryHead">
            <tr>
              <th>报价员</th>
              <th class="num">有效询价票数</th>
              <th class="num">超时票数</th>
              <th class="num">达成率</th>
              <th class="num">平均时长</th>
              <th>考核结果</th>
              <th class="bar-cell">达成率可视化</th>
            </tr>
          </thead>
          <tbody id="summaryBody"></tbody>
          <tfoot id="summaryFoot"></tfoot>
        </table>
      </div>
    </section>
  </div>

  <script>
    const LUNCH_START = 11 * 60 + 30;
    const LUNCH_END = 13 * 60;
    const LUNCH_DEDUCT = 90;
    const SLA_MIN = 20;
    const ACHIEVE_TARGET = 90; // 月度考核：20min内占比 ≥90%
    const WORK_START = 9 * 60;
    const WORK_END = 18 * 60;

    const MOCK = {
      fcl: {
        summary: [
          { name: "张三", count: 186, avg: 15.8, timeout: 14 },
          { name: "李四", count: 142, avg: 21.2, timeout: 22 },
          { name: "王五", count: 98, avg: 13.9, timeout: 6 },
          { name: "赵六", count: 54, avg: 17.4, timeout: 6 },
        ],
        details: {
          "张三": [
            { no: "XJ-FCL-240701", type: "整柜", sales: "陈业务", submit: "2026-07-24 09:12", done: "2026-07-24 09:28", plans: 1, raw: 16, lunch: 0, dest: "LA 直送" },
            { no: "XJ-FCL-240708", type: "整柜", sales: "刘业务", submit: "2026-07-24 10:05", done: "2026-07-24 10:35", plans: 2, raw: 30, lunch: 0, dest: "NY 拆柜" },
            { no: "XJ-FCL-240715", type: "整柜", sales: "周业务", submit: "2026-07-24 14:20", done: "2026-07-24 14:38", plans: 1, raw: 18, lunch: 0, dest: "CHI 直送" },
          ],
          "李四": [
            { no: "XJ-FCL-240702", type: "整柜", sales: "吴业务", submit: "2026-07-24 09:45", done: "2026-07-24 10:18", plans: 3, raw: 33, lunch: 0, dest: "SAV 直送" },
            { no: "XJ-FCL-240710", type: "整柜", sales: "郑业务", submit: "2026-07-24 11:00", done: "2026-07-24 13:25", plans: 2, raw: 145, lunch: 90, dest: "HOU 拆柜" },
          ],
        },
      },
      lcl: {
        summary: [
          { name: "张三", count: 248, avg: 17.2, timeout: 18 },
          { name: "赵六", count: 196, avg: 11.8, timeout: 8 },
          { name: "李四", count: 88, avg: 24.6, timeout: 19 },
        ],
        details: {
          "张三": [
            { no: "XJ-LCL-240801", type: "散货", sales: "孙业务", submit: "2026-07-24 09:30", done: "2026-07-24 09:48", plans: 1, raw: 18, lunch: 0, dest: "LAX 卡派" },
            { no: "XJ-LCL-240809", type: "散货", sales: "钱业务", submit: "2026-07-24 15:10", done: "2026-07-24 15:42", plans: 2, raw: 32, lunch: 0, dest: "NJ 私仓" },
          ],
          "赵六": [
            { no: "XJ-LCL-240815", type: "散货", sales: "冯业务", submit: "2026-07-24 10:20", done: "2026-07-24 10:32", plans: 1, raw: 12, lunch: 0, dest: "SEA 快递" },
          ],
        },
      },
    };

    let currentDim = "lcl";
    let expandedQuoter = null;
    const SUMMARY_COLS = 7;

    function achieveRate(count, timeout) {
      if (!count) return 0;
      return ((count - timeout) / count) * 100;
    }

    function effectiveMin(raw, lunch) {
      return Math.max(0, raw - lunch);
    }

    function assessBadge(rate) {
      if (rate >= ACHIEVE_TARGET) return '<span class="badge badge-ok">达标</span>';
      if (rate >= ACHIEVE_TARGET - 5) return '<span class="badge badge-warn">接近</span>';
      return '<span class="badge badge-bad">未达标</span>';
    }

    function achieveBarClass(rate) {
      if (rate >= ACHIEVE_TARGET) return "ok";
      if (rate >= ACHIEVE_TARGET - 5) return "warn";
      return "bad";
    }

    function kpiAchieveClass(rate) {
      if (rate >= ACHIEVE_TARGET) return "ok";
      if (rate >= ACHIEVE_TARGET - 5) return "warn";
      return "bad";
    }

    function getData() {
      const raw = MOCK[currentDim];
      const quoter = document.getElementById("quoterFilter").value;
      let summary = raw.summary;
      if (quoter) {
        summary = summary.filter(r => r.name === quoter);
      }
      return { summary, details: raw.details };
    }

    function monthLabel() {
      const v = document.getElementById("statMonth").value || "2026-07";
      const [y, m] = v.split("-");
      return `${y}年${parseInt(m, 10)}月`;
    }

    function dateLabel() {
      const v = document.getElementById("statDate").value;
      if (!v) return "";
      const [y, m, d] = v.split("-");
      return `${parseInt(m, 10)}月${parseInt(d, 10)}日`;
    }

    function queryScopeText() {
      const dimLabel = currentDim === "fcl" ? "整柜" : "散货";
      const quoter = document.getElementById("quoterFilter").value || "全部报价员";
      const timeout = document.getElementById("timeoutFilter").value;
      const timeoutLabel = timeout === "1" ? " · 仅超时" : timeout === "0" ? " · 仅未超时" : "";
      const day = dateLabel();
      const period = day ? `${monthLabel()} · ${day}` : monthLabel();
      return `${period} · ${dimLabel} · ${quoter}${timeoutLabel}`;
    }

    function renderKpi(data) {
      const total = data.summary.reduce((s, r) => s + r.count, 0);
      const timeoutTotal = data.summary.reduce((s, r) => s + r.timeout, 0);
      const weightedAvg = data.summary.reduce((s, r) => s + r.avg * r.count, 0) / (total || 1);
      const rate = achieveRate(total, timeoutTotal);
      const dimLabel = currentDim === "fcl" ? "整柜" : "散货";
      const pass = rate >= ACHIEVE_TARGET;

      document.getElementById("kpiRow").innerHTML = `
        <div class="kpi">
          <div class="kpi-label">${dimLabel} · 当前查询有效询价</div>
          <div class="kpi-value">${total}</div>
          <div class="kpi-sub">${queryScopeText()}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">${dimLabel} · 当前查询超时票数</div>
          <div class="kpi-value ${timeoutTotal > 0 ? "warn" : "ok"}">${timeoutTotal}</div>
          <div class="kpi-sub">有效时长 &gt; ${SLA_MIN} min</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">${dimLabel} · 当前查询达成率</div>
          <div class="kpi-value ${kpiAchieveClass(rate)}">${rate.toFixed(1)}<span style="font-size:14px;font-weight:400">%</span></div>
          <div class="kpi-sub">考核目标 ≥ ${ACHIEVE_TARGET}%</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">${dimLabel} · 平均报价时长</div>
          <div class="kpi-value ${weightedAvg <= SLA_MIN ? "ok" : "warn"}">${weightedAvg.toFixed(1)}<span style="font-size:14px;font-weight:400"> min</span></div>
          <div class="kpi-sub">参考指标 · 报价员 ${data.summary.length} 人</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">${dimLabel} · 考核结果</div>
          <div class="kpi-value ${pass ? "ok" : "bad"}" style="font-size:22px">${pass ? "达标" : "未达标"}</div>
          <div class="kpi-sub">${pass ? "达成率 ≥ " + ACHIEVE_TARGET + "%" : "距达标差 " + (ACHIEVE_TARGET - rate).toFixed(1) + " 个百分点"}</div>
        </div>
      `;
    }

    function renderSummary(data) {
      const tbody = document.getElementById("summaryBody");
      const tfoot = document.getElementById("summaryFoot");
      const dimLabel = currentDim === "fcl" ? "整柜" : "散货";
      document.getElementById("summaryTitle").textContent = "当前查询 · 按报价员汇总";
      document.getElementById("dimHint2").textContent =
        `· ${queryScopeText()} · 点击有超时的报价员行，明细展开在对应行下方`;

      tbody.innerHTML = data.summary.map(row => {
        const rate = achieveRate(row.count, row.timeout);
        const bc = achieveBarClass(rate);
        const canDrill = row.timeout > 0;
        const isExpanded = expandedQuoter === row.name;
        const rowCls = [canDrill ? "row-drill" : "", isExpanded ? "row-expanded" : ""].filter(Boolean).join(" ");
        const nameCell = canDrill
          ? `<span class="link">${row.name}${isExpanded ? " ▾" : " ▸"}</span>`
          : `<span class="link-muted">${row.name}</span>`;
        const timeoutCell = canDrill
          ? `<span class="link">${row.timeout}</span>`
          : `${row.timeout}`;
        const clickAttr = canDrill ? `onclick="toggleDetail('${row.name}')"` : "";
        let html = `<tr class="${rowCls}" data-quoter="${row.name}" ${clickAttr}>
          <td>${nameCell}</td>
          <td class="num">${row.count}</td>
          <td class="num">${timeoutCell}</td>
          <td class="num"><strong>${rate.toFixed(1)}%</strong></td>
          <td class="num">${row.avg.toFixed(1)} min</td>
          <td>${assessBadge(rate)}</td>
          <td class="bar-cell">
            <span style="font-size:11px;color:var(--sub)">${rate.toFixed(1)}% / 目标${ACHIEVE_TARGET}%</span>
            <div class="bar-track"><div class="bar-fill ${bc}" style="width:${Math.min(rate, 100)}%"></div></div>
          </td>
        </tr>`;
        if (isExpanded) {
          html += buildInlineDetailRow(row.name);
        }
        return html;
      }).join("");

      const total = data.summary.reduce((s, r) => s + r.count, 0);
      const timeoutTotal = data.summary.reduce((s, r) => s + r.timeout, 0);
      const totalRate = achieveRate(total, timeoutTotal);
      tfoot.innerHTML = `<tr style="background:#fafafa;font-weight:600">
        <td>合计 / 整体</td>
        <td class="num">${total}</td>
        <td class="num">${timeoutTotal}</td>
        <td class="num">${totalRate.toFixed(1)}%</td>
        <td class="num">—</td>
        <td>${assessBadge(totalRate)}</td>
        <td class="bar-cell"><span style="font-size:11px">整体考核依据当前查询达成率</span></td>
      </tr>`;
    }

    function getTimeoutRows(name) {
      const allRows = MOCK[currentDim].details[name] || [];
      return allRows.filter(r => effectiveMin(r.raw, r.lunch) > SLA_MIN);
    }

    function buildInlineDetailRow(name) {
      const rows = getTimeoutRows(name);
      const dimLabel = currentDim === "fcl" ? "整柜" : "散货";
      const body = rows.map(r => {
        const eff = effectiveMin(r.raw, r.lunch);
        return `<tr>
          <td>${r.no}</td>
          <td>${r.type}</td>
          <td>${r.sales}</td>
          <td>${r.submit}</td>
          <td>${r.done}</td>
          <td class="num">${r.plans ?? 1}</td>
          <td class="num"><strong>${eff}</strong></td>
          <td class="num">${r.lunch || "—"}</td>
          <td><span class="badge badge-bad">超时</span></td>
        </tr>`;
      }).join("") || `<tr><td colspan="9" style="text-align:center;color:var(--sub)">暂无超时明细</td></tr>`;

      return `<tr class="inline-detail" data-detail-for="${name}">
        <td colspan="${SUMMARY_COLS}">
          <div class="inline-detail-inner">
            <div class="inline-detail-hd">
              <span><strong>${name}</strong> · ${dimLabel} · 超时询价 <strong>${rows.length}</strong> 票（&gt; ${SLA_MIN} min）</span>
              <button class="btn" type="button" style="height:26px;padding:0 10px;font-size:11px" onclick="event.stopPropagation();closeDetail()">收起</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>询价单号</th>
                    <th>业务类型</th>
                    <th>业务员</th>
                    <th>重提时间</th>
                    <th>全部方案提交时间</th>
                    <th class="num">报价方案数</th>
                    <th class="num">有效时长(min)</th>
                    <th class="num">扣除午休(min)</th>
                    <th>是否超时</th>
                  </tr>
                </thead>
                <tbody>${body}</tbody>
              </table>
            </div>
          </div>
        </td>
      </tr>`;
    }

    function toggleDetail(name) {
      const rows = getTimeoutRows(name);
      if (!rows.length) return;
      expandedQuoter = expandedQuoter === name ? null : name;
      renderSummary(getData());
    }

    function closeDetail() {
      expandedQuoter = null;
      renderSummary(getData());
    }

    function switchDim(dim) {
      currentDim = dim;
      document.querySelectorAll(".dim-tab").forEach(t => t.classList.toggle("active", t.dataset.dim === dim));
      closeDetail();
      refreshData();
    }

    function refreshData() {
      expandedQuoter = null;
      const data = getData();
      renderKpi(data);
      renderSummary(data);
    }

    refreshData();
  </script>
