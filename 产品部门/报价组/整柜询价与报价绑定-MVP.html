<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>询价与报价绑定 · MVP（V3.0）</title>
  <link rel="stylesheet" href="../../二期/ess-prototype-prd.css" />
  <style>
    :root {
      --header: #0b1f3a; --bg: #f0f2f5; --card: #fff;
      --line: #e8e8e8; --text: rgba(0,0,0,.85); --sub: rgba(0,0,0,.45);
      --blue: #1890ff; --req: #cf1322; --v3: #722ed1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13px; color: var(--text); background: var(--bg); }
    button, input, select { font: inherit; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .demo-bar {
      background: #f9f0ff; border-bottom: 1px solid #d3adf7;
      padding: 8px 14px; font-size: 12px; color: #531dab; line-height: 1.55;
    }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .top-header { background: var(--header); color: #fff; padding: 0 16px; height: 48px; display: flex; align-items: center; gap: 12px; }
    .top-header .tab { background: var(--bg); color: var(--text); padding: 0 12px; height: 48px; line-height: 48px; font-weight: 600; }

    .main { flex: 1; padding: 16px; max-width: 960px; margin: 0 auto; width: 100%; }
    .page-hd { margin-bottom: 12px; }
    .page-hd h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
    .page-hd p { margin: 0; font-size: 12px; color: var(--sub); line-height: 1.55; }

    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 2px;
      margin-bottom: 12px; overflow: hidden;
    }
    .sec-hd {
      padding: 8px 14px; background: #fafafa; border-bottom: 1px solid var(--line);
      font-weight: 600; font-size: 13px;
    }
    .sec-hd .hint { font-weight: 400; color: var(--sub); font-size: 11px; margin-left: 6px; }
    .sec-bd { padding: 14px 16px; }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; }
    @media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }
    .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
    .field input {
      width: 100%; height: 32px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 0 8px;
    }
    .field input[readonly], .field .readonly { background: #fafafa; color: var(--sub); }
    .field-ro-link { color: var(--blue); cursor: pointer; }
    .field.full { grid-column: 1 / -1; }

    .foot-actions {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px;
      border-top: 1px solid var(--line); background: #fafafa;
    }
    .btn {
      height: 32px; padding: 0 14px; border-radius: 2px; border: 1px solid #d9d9d9;
      background: #fff; cursor: pointer; text-decoration: none; color: var(--text);
      display: inline-flex; align-items: center;
    }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  </style>
</head>
<body data-fcl-nav="core-flow-v3">
  <div class="app">
    <div class="demo-bar">
      <a href="报价组-导航.html">← 报价组导航</a>
      ｜ <strong>整柜流程 V3.0</strong> · 原 V2.0 舱位管理侧栏「询价与报价绑定」区块已迁至本页；V2.0 订舱登记 / 完善提单侧栏<strong>不再包含</strong>此区块。
    </div>
    <header class="top-header">
      <div>腾信物流</div>
      <div class="tab">询价与报价绑定</div>
    </header>

    <main class="main">
      <div class="page-hd">
        <h1>询价与报价绑定</h1>
        <p>流程 7.2 · 四.1 → 四.2 衔接：报价完成后运单绑定报价，锁价/保舱等信息只读展示，供订舱放舱前核对。继续订舱请进入 <a href="仓位管理-订舱完善提单-整合-MVP.html">舱位管理 · V2.0</a>。</p>
      </div>

      <section class="card">
        <div class="sec-hd">基础信息 <span class="hint">运单只读</span></div>
        <div class="sec-bd">
          <div class="form-grid">
            <div class="field">
              <label>关联运单号</label>
              <input type="text" readonly class="readonly" value="RC266501" />
            </div>
            <div class="field">
              <label>客户代码</label>
              <input type="text" readonly class="readonly" value="CUST-FCL-001" />
            </div>
            <div class="field">
              <label>目的港派送方式</label>
              <input type="text" readonly class="readonly" value="PK2551 · 整柜直送" />
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="sec-hd">询价与报价绑定 <span class="hint">四.1→四.2</span></div>
        <div class="sec-bd">
          <div class="form-grid">
            <div class="field">
              <label>询价来源</label>
              <input type="text" readonly class="readonly" value="合作代理询价" />
            </div>
            <div class="field">
              <label>关联询价单</label>
              <input type="text" readonly class="readonly field-ro-link" id="inquiryLink" value="XJ202605230018" title="跳转询价详情" />
            </div>
            <div class="field">
              <label>关联报价单</label>
              <input type="text" readonly class="readonly field-ro-link" id="quoteLink" value="BJ202605230018" title="跳转报价详情" />
            </div>
            <div class="field">
              <label>是否锁价</label>
              <input type="text" readonly class="readonly" value="是（报价单带入）" />
            </div>
            <div class="field">
              <label>是否保舱</label>
              <input type="text" readonly class="readonly" value="否" />
            </div>
            <div class="field">
              <label>绑定运单号</label>
              <input type="text" readonly class="readonly" value="RC266501" />
            </div>
          </div>
        </div>
        <div class="foot-actions">
          <a class="btn" href="ESS整柜询价详情-MVP.html">打开询价详情</a>
          <a class="btn" href="ESS整柜报价详情-MVP.html">打开报价详情</a>
          <a class="btn btn-primary" href="仓位管理-订舱完善提单-整合-MVP.html">继续 · 舱位管理订舱</a>
        </div>
      </section>
    </main>
  </div>

  <div class="ess-prd-source" hidden aria-hidden="true" data-prd-href="整柜询价与报价绑定-MVP-PRD.html">
    <span class="ess-prd-chip">PRD · 询价与报价绑定（V3.0 独立页）</span>
  </div>
  <script src="../../二期/ess-prototype-prd.js"></script>
  <link rel="stylesheet" href="../../二期/ess-prototype-nav.css" />
  <script>
    document.getElementById("inquiryLink").addEventListener("click", function () {
      location.href = "ESS整柜询价详情-MVP.html";
    });
    document.getElementById("quoteLink").addEventListener("click", function () {
      location.href = "ESS整柜报价详情-MVP.html";
    });
  </script>
  <script src="fcl-core-flow-v3-nav.js" defer></script>
</body>
</html>
