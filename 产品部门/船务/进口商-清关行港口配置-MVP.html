<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清关行 · 港口配置（MVP）</title>
  <link rel="stylesheet" href="../../二期/ess-prototype-prd.css" />
  <style>
    :root {
      --bg: #f5f7fb; --card: #fff; --text: #111827; --sub: #6b7280;
      --line: #e5e7eb; --primary: #2563eb; --ok: #027a48; --bad: #b91c1c; --warn: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }
    .page-top {
      padding: 10px 16px; border-bottom: 1px solid var(--line); background: #fff;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    }
    .page-top a { color: var(--primary); text-decoration: none; font-size: 13px; }
    .page-main { padding: 16px; max-width: 1180px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .sub { margin: 0 0 12px; font-size: 13px; color: var(--sub); }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab {
      border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 6px 14px; font-size: 13px; cursor: pointer;
    }
    .tab.on { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; font-weight: 600; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    }
    .panel { display: none; }
    .panel.on { display: block; }
    .hint { margin: 0 0 10px; font-size: 12px; color: #0050b3; background: #e6f7ff; border: 1px solid #91d5ff; padding: 6px 10px; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: #f8fafc; font-weight: 600; white-space: nowrap; }
    .ports { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px; font-size: 12px;
      background: #fef2f2; color: var(--bad); border: 1px solid #fecaca;
    }
    .tag button {
      border: 0; background: none; color: inherit; cursor: pointer; padding: 0; line-height: 1;
    }
    .mail { font-size: 12px; color: var(--sub); }
    .add-row { display: flex; gap: 6px; margin-top: 6px; }
    .add-row input {
      height: 26px; border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; font-size: 12px;
    }
    .btn {
      height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 12px;
    }
    .btn-pri { background: var(--primary); border-color: var(--primary); color: #fff; }
    .cell { text-align: center !important; cursor: pointer; user-select: none; width: 72px; }
    .dot-a { color: var(--ok); font-weight: 700; }
    .dot-r { color: var(--bad); font-weight: 700; }
    .dot-n { color: #cbd5e1; }
    .chip-w { display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 11px; background: #fffbeb; color: var(--warn); }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #111827; color: #fff; padding: 8px 14px; border-radius: 6px;
      font-size: 13px; display: none; z-index: 20;
    }
    .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .bar input { height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; }
  </style>
</head>
<body>
  <div class="page-top">
    <a href="进口商管理-MVP.html">← 进口商管理</a>
    <a href="船务组-导航.html">船务导航</a>
    <a href="../关务组/关务组-导航.html">关务导航</a>
  </div>
  <main class="page-main">
    <h1>清关行 · 港口配置</h1>
    <p class="sub">授权只在本页点格子分配。</p>

    <div class="tabs">
      <button type="button" class="tab on" data-tab="brokers">清关行</button>
      <button type="button" class="tab" data-tab="auth">进口商授权</button>
    </div>

    <section class="card panel on" id="panel-brokers">
      <p class="hint">点港口标签可删。关关通：禁接港中转也不行。</p>
        <table>
          <thead>
          <tr><th>清关行</th><th>不接港口</th><th>对接邮箱</th></tr>
          </thead>
        <tbody id="brokerBody"></tbody>
        </table>
    </section>

    <section class="card panel" id="panel-auth">
      <p class="hint">点格子：未分配 → 授权 → 禁接。绑柜/绑提单只出授权行。</p>
      <div class="bar">
        <input id="qImp" placeholder="进口商" />
        <button type="button" class="btn" id="btnReset">重置</button>
        <button type="button" class="btn btn-pri" id="btnSave">保存</button>
        <span style="font-size:12px;color:var(--sub)">● 授权　✕ 禁接　· 未分配</span>
      </div>
        <table>
          <thead>
            <tr>
            <th>进口商</th><th>Bond</th>
            <th class="cell">精准</th><th class="cell">02B</th><th class="cell">赛因</th>
            <th class="cell">关关通</th><th class="cell">人人数智</th><th class="cell">帝成</th>
            </tr>
          </thead>
        <tbody id="authBody"></tbody>
        </table>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <div class="ess-prd-source" hidden aria-hidden="true" data-prd-href="进口商-清关行港口配置-MVP-PRD.html">
    <span class="ess-prd-chip">PRD · 清关行配置</span>
  </div>
  <script src="../../二期/ess-prototype-prd.js?v=aidock1"></script>
  <script>
(function () {
      var BROKERS = ["精准", "02B", "赛因", "关关通", "人人数智", "帝成"];
      var catalog = [
        {
          key: "精准",
          mail: "info@brokerac.com",
          ports: ["Detroit", "Seattle", "Houston", "Charleston", "Norfolk", "Miami"]
        },
        {
          key: "02B",
          mail: "lixian.l@pieschb.com",
          ports: ["Detroit", "Oakland", "Houston", "Seattle", "Boston"]
        },
        {
          key: "赛因",
          mail: "Bond@SineTrading.com",
          ports: [],
          note: "全美可接，达拉斯不建议"
        },
        {
          key: "关关通",
          mail: "team6a@ggt-world.com",
          ports: ["Detroit", "Seattle", "Charleston", "Boston"],
          note: "中转落到禁接港也不行"
        },
        {
          key: "人人数智",
          mail: "gillian@renrenshuzhi.com",
          ports: ["Detroit", "Dallas", "Seattle", "Miami"]
        },
        {
          key: "帝成",
          mail: "yiban@szshy.cn",
          ports: ["Detroit", "小港口和内陆港"]
        }
      ];
      var imps = [
        { name: "Pacific Trade Logistics LLC", bond: "正常", auth: ["精准", "02B"], refuse: [] },
        { name: "Westbay Trading Inc.", bond: "正常", auth: ["精准", "赛因"], refuse: [] },
        { name: "East Coast Import Co.", bond: "正常", auth: ["精准", "关关通"], refuse: ["02B"] },
        { name: "NINGBO BRIGHT LOGISTICS", bond: "正常", auth: ["赛因"], refuse: [] },
        { name: "STAR IMPORTER LLC", bond: "停用观察", auth: ["精准", "02B"], refuse: [] },
        { name: "VOISENON", bond: "停用", auth: [], refuse: ["精准", "02B"] },
        { name: "ACACIA", bond: "正常", auth: ["赛因", "关关通"], refuse: ["精准", "02B"] },
        { name: "RUICHENG", bond: "正常", auth: [], refuse: [] }
      ];

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.style.display = "block";
        setTimeout(function () { el.style.display = "none"; }, 1600);
      }

      function statusOf(imp, b) {
        if (imp.refuse.indexOf(b) >= 0) return "refuse";
        if (imp.auth.indexOf(b) >= 0) return "auth";
        return "none";
      }

      function setStatus(imp, b, st) {
        imp.auth = imp.auth.filter(function (x) { return x !== b; });
        imp.refuse = imp.refuse.filter(function (x) { return x !== b; });
        if (st === "auth") imp.auth.push(b);
        if (st === "refuse") imp.refuse.push(b);
      }

      function renderBrokers() {
        document.getElementById("brokerBody").innerHTML = catalog.map(function (c, i) {
          var tags = c.ports.map(function (p, j) {
            return "<span class='tag'>" + p + " <button type='button' data-del='" + i + "," + j + "'>×</button></span>";
          }).join("");
          if (c.note) tags += "<span class='mail'>（" + c.note + "）</span>";
          return "<tr>" +
            "<td><b>" + c.key + "</b></td>" +
            "<td><div class='ports'>" + tags + "</div>" +
            "<div class='add-row'><input placeholder='港口' data-port='" + i + "' /><button type='button' class='btn' data-add='" + i + "'>添加</button></div></td>" +
            "<td><input class='mail' style='width:100%;height:28px;border:1px solid var(--line);border-radius:4px;padding:0 8px' data-mail='" + i + "' value='" + c.mail + "' /></td>" +
            "</tr>";
        }).join("");
      }

      function renderAuth() {
    var q = (document.getElementById("qImp").value || "").trim().toLowerCase();
        var rows = imps.filter(function (imp) {
          return !q || imp.name.toLowerCase().indexOf(q) >= 0;
        });
        document.getElementById("authBody").innerHTML = rows.map(function (imp, idx) {
          var cells = BROKERS.map(function (b) {
            var st = statusOf(imp, b);
            var mark = st === "auth" ? "<span class='dot-a'>●</span>" : st === "refuse" ? "<span class='dot-r'>✕</span>" : "<span class='dot-n'>·</span>";
            return "<td class='cell' data-i='" + imps.indexOf(imp) + "' data-b='" + b + "'>" + mark + "</td>";
      }).join("");
          var bond = /停用/.test(imp.bond) ? "<span class='chip-w'>" + imp.bond + "</span>" : imp.bond;
          return "<tr><td><b>" + imp.name + "</b></td><td>" + bond + "</td>" + cells + "</tr>";
        }).join("") || "<tr><td colspan='8'>无匹配</td></tr>";
      }

      document.querySelector(".tabs").addEventListener("click", function (e) {
        var t = e.target.closest(".tab");
        if (!t) return;
        document.querySelectorAll(".tab").forEach(function (x) { x.classList.toggle("on", x === t); });
        document.querySelectorAll(".panel").forEach(function (x) {
          x.classList.toggle("on", x.id === "panel-" + t.getAttribute("data-tab"));
        });
      });

      document.getElementById("brokerBody").addEventListener("click", function (e) {
        var del = e.target.getAttribute("data-del");
        if (del) {
          var p = del.split(",");
          catalog[+p[0]].ports.splice(+p[1], 1);
          renderBrokers();
          return;
        }
        var add = e.target.getAttribute("data-add");
        if (add == null) return;
        var inp = document.querySelector("input[data-port='" + add + "']");
        var v = (inp && inp.value || "").trim();
        if (!v) { toast("请填写港口"); return; }
        catalog[+add].ports.push(v);
        renderBrokers();
      });
      document.getElementById("brokerBody").addEventListener("change", function (e) {
        var i = e.target.getAttribute("data-mail");
        if (i == null) return;
        catalog[+i].mail = e.target.value.trim();
      });

      document.getElementById("authBody").addEventListener("click", function (e) {
        var td = e.target.closest("td.cell");
        if (!td) return;
        var imp = imps[+td.getAttribute("data-i")];
        var b = td.getAttribute("data-b");
        var cur = statusOf(imp, b);
        var next = cur === "none" ? "auth" : cur === "auth" ? "refuse" : "none";
        setStatus(imp, b, next);
        renderAuth();
      });
      document.getElementById("qImp").oninput = renderAuth;
      document.getElementById("btnReset").onclick = function () {
    document.getElementById("qImp").value = "";
        renderAuth();
      };
      document.getElementById("btnSave").onclick = function () { toast("已保存"); };

      renderBrokers();
      renderAuth();
})();
  </script>
</body>
</html>
