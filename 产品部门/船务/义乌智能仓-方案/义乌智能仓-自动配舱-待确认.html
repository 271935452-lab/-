<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>义乌智能仓 · 自动配舱待确认</title>
  <link rel="stylesheet" href="../ship-review-common.css" />
  <style>
    :root {
      --bg: #f0f2f5; --card: #fff; --line: #e8e8e8;
      --header: #0b1f3a; --sidebar: #001529;
      --text: rgba(0,0,0,.85); --sub: rgba(0,0,0,.45); --blue: #1890ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif; font-size: 13px;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .page { max-width: 960px; margin: 0 auto; padding: 14px 16px 48px; }
    .hero, .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 6px;
      padding: 14px 16px; margin-bottom: 12px;
    }
    .hero h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    .hero p, .desc { margin: 0; font-size: 12px; color: var(--sub); line-height: 1.65; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; line-height: 1.55; }
    th { background: #fafafa; font-weight: 600; }
    td.no { width: 36px; font-weight: 700; color: #003a8c; white-space: nowrap; }
    .foot { text-align: center; font-size: 11px; color: var(--sub); }

    html, body { height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .top-header {
      background: var(--header); color: #fff; display: flex; align-items: center;
      min-height: 48px; padding: 0 14px; gap: 10px; flex-shrink: 0;
    }
    .logo { font-weight: 600; }
    .nav-tab {
      margin-left: 8px; padding: 0 12px; height: 48px; line-height: 48px;
      background: var(--bg); color: var(--text); font-weight: 600;
    }
    .body-wrap { flex: 1; display: flex; min-height: 0; }
    .sidebar {
      width: 208px; flex-shrink: 0; background: var(--sidebar); color: rgba(255,255,255,.78);
      padding: 8px 0; overflow: auto;
    }
    .side-item { display: block; padding: 9px 16px; color: inherit; text-decoration: none; }
    .side-item:hover { background: rgba(255,255,255,.08); color: #fff; text-decoration: none; }
    .side-item.active { background: rgba(24,144,255,.28); color: #fff; }
    .main { flex: 1; min-width: 0; overflow: auto; }
    .page { max-width: none !important; margin: 0 !important; padding: 12px 14px 40px !important; }
  </style>
</head>
<body>
  <header class="top-header">
    <div class="logo">船务</div>
    <div class="nav-tab">自动配舱待确认</div>
  </header>
  <div class="body-wrap">
    <nav class="sidebar" id="shipReviewSidebar"></nav>
    <main class="main">
  <div class="page">
    <header class="hero">
      <h1>义乌智能仓 · 自动配舱待确认</h1>
      <p>还没拍板。已确认的已写进 <a href="义乌智能仓-自动配舱-方案确认.html">自动配舱方案</a>。</p>
    </header>
    <section class="card">
      <table>
        <thead><tr><th></th><th>待确认</th><th>说明</th></tr></thead>
        <tbody>
          <tr>
            <td class="no">1</td>
            <td>人工补货队列用完后，要不要系统自动从待配池再抽票补满。</td>
            <td>队列指按渠道预留的小货：2.5～3.5 方一批、单票单件一批。用掉之后是自动回补，还是人手工加。</td>
          </tr>
          <tr>
            <td class="no">2</td>
            <td>装前换柜：「柜子到现场」用哪个字段判断。</td>
            <td>后续要加字段。定之前原型可先人工勾选「已到场」演示。</td>
          </tr>
        </tbody>
      </table>
    </section>
    <p class="foot">义乌智能仓 · 自动配舱待确认 · 2026-11-02</p>
  </div>
    </main>
  </div>
  <script src="../ship-review-nav.js"></script>
  <script>renderShipReviewNav("stow-open");</script>
</body>
</html>
