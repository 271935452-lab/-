<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>部门进仓数据 · 旁支</title>
  <link rel="stylesheet" href="../../二期/ess-prototype-prd.css" />
  <style>
    :root {
      --header: #0b1f3a; --header-tab: #132d52; --sidebar: #001529;
      --bg: #f0f2f5; --card: #fff; --line: #e8e8e8;
      --text: rgba(0,0,0,.85); --sub: rgba(0,0,0,.45); --blue: #1890ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 13px; color: var(--text); background: var(--bg);
    }
    button, input, select { font: inherit; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .top-header {
      background: var(--header); color: #fff; display: flex; min-height: 48px;
    }
    .logo {
      width: 48px; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.06); font-size: 11px; color: #94a3b8;
    }
    .nav-tabs { display: flex; flex: 1; overflow-x: auto; }
    .nav-tab {
      padding: 0 16px; display: flex; align-items: center; gap: 6px;
      background: var(--header-tab); border: none; color: rgba(255,255,255,.75);
      cursor: pointer; white-space: nowrap; border-right: 1px solid rgba(255,255,255,.06);
    }
    .nav-tab.active { background: var(--bg); color: var(--text); font-weight: 600; }
    .header-right {
      display: flex; align-items: center; gap: 12px; padding: 0 14px;
      font-size: 12px; color: rgba(255,255,255,.7);
    }
    .header-right input {
      height: 26px; border: 0; border-radius: 2px; padding: 0 8px; width: 140px;
    }
    .branch-bar {
      padding: 6px 12px; font-size: 12px; background: #fff7e6; color: #ad6800;
      border-bottom: 1px solid #ffe58f;
    }
    .body-wrap { display: flex; flex: 1; min-height: 0; }
    .sidebar {
      width: 56px; background: var(--sidebar); color: rgba(255,255,255,.65);
      padding: 8px 0; font-size: 10px; text-align: center;
    }
    .side-ico { padding: 10px 0; }
    .side-ico.on { color: #fff; background: rgba(24,144,255,.25); }
    .side-ico b { display: block; font-size: 14px; margin-bottom: 2px; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .proto-bar {
      padding: 6px 12px; font-size: 12px; background: #e6f7ff; color: #0050b3;
      border-bottom: 1px solid #91d5ff;
    }
    .proto-bar a { margin-left: 10px; }
    .filter-panel {
      background: #fff; border-bottom: 1px solid var(--line); padding: 10px 12px;
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px;
    }
    .filter-actions { display: flex; gap: 8px; }
    .fi label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
    .fi label .new {
      color: #cf1322; font-size: 10px; font-weight: 700; margin-left: 4px;
    }
    .fi input, .fi select {
      height: 32px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 0 8px;
      min-width: 160px; background: #fff;
    }
    .date-range { display: flex; align-items: center; gap: 4px; }
    .date-range input { min-width: 130px; }
    .date-range span { color: var(--sub); }
    .btn {
      height: 32px; padding: 0 14px; border: 1px solid #d9d9d9; border-radius: 2px;
      background: #fff; cursor: pointer;
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-primary:hover { color: #fff; }
    .table-wrap { flex: 1; overflow: auto; background: #fff; }
    table.grid { border-collapse: collapse; font-size: 12px; min-width: 1100px; width: 100%; }
    table.grid th, table.grid td {
      border: 1px solid #f0f0f0; padding: 6px 8px; text-align: right; white-space: nowrap;
    }
    table.grid th { background: #fafafa; font-weight: 600; text-align: center; }
    table.grid th.stub, table.grid td.stub { text-align: left; position: sticky; left: 0; background: #fff; z-index: 1; }
    table.grid th.stub { background: #fafafa; z-index: 2; }
    table.grid thead .col-search { padding: 4px; }
    table.grid thead .col-search input {
      width: 100%; height: 24px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 0 6px;
      text-align: left;
    }
    table.grid tr.total td { font-weight: 700; background: #fafafa; }
    table.grid td.num { font-variant-numeric: tabular-nums; }
    .pager {
      padding: 8px 12px; background: #fff; border-top: 1px solid var(--line);
      font-size: 12px; color: var(--sub);
    }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: rgba(0,0,0,.78); color: #fff; padding: 8px 14px; border-radius: 4px;
      opacity: 0; transition: .2s; pointer-events: none; z-index: 2000;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-header">
      <div class="logo">ESS</div>
      <div class="nav-tabs">
        <button type="button" class="nav-tab">控制台</button>
        <button type="button" class="nav-tab active">部门进仓数据</button>
        <button type="button" class="nav-tab" onclick="location.href='海外对接组-主单跟进-MVP.html'">主单跟进</button>
        <button type="button" class="nav-tab" onclick="location.href='海外对接组-卡派跟进新-MVP.html'">卡派跟进(新)</button>
      </div>
      <div class="header-right">
        <input placeholder="菜单搜索" />
        <span>IT(BT0022)</span>
        <a href="海外对接组-导航.html#s-branch" style="color:#91d5ff">海外组 · 旁支</a>
      </div>
    </header>
    <div class="branch-bar">旁支 · 本期不做。现网「部门进仓数据」筛选新增 <strong>派送方式</strong>（部门右侧）。改数仍走查询。</div>
    <div class="body-wrap">
      <aside class="sidebar">
        <div class="side-ico"><b>⌂</b>控制台</div>
        <div class="side-ico"><b>箱</b>仓储</div>
        <div class="side-ico on"><b>进</b>进仓</div>
        <div class="side-ico"><b>◎</b>海外</div>
      </aside>
      <main class="main">
        <div class="proto-bar">
          对齐现网部门进仓数据 · 筛区在「部门」右侧加 <strong>派送方式</strong>
          <a href="海外对接组-部门进仓数据-MVP-PRD.html">分册 PRD</a>
          <a href="海外对接组-导航.html">返回海外对接组导航</a>
          <a href="海外对接组-导航.html#s-branch">海外对接组 · 旁支</a>
        </div>
        <section class="filter-panel">
          <div class="filter-actions">
            <button type="button" class="btn btn-primary" id="btnQuery">查询数据</button>
            <button type="button" class="btn" id="btnReset">重置</button>
          </div>
          <div class="fi">
            <label>到货时间</label>
            <div class="date-range">
              <input type="date" id="qFrom" value="2026-07-28" />
              <span>~</span>
              <input type="date" id="qTo" value="2026-08-28" />
            </div>
          </div>
          <div class="fi">
            <label>到货仓库</label>
            <select id="qWh">
              <option value="">请选择到货仓库</option>
              <option>厦门仓</option>
              <option>台州仓</option>
              <option>义乌仓</option>
              <option>中山仓</option>
              <option>深圳仓</option>
              <option>宁波仓</option>
            </select>
          </div>
          <div class="fi">
            <label>部门</label>
            <select id="qDept">
              <option value="">请选择部门</option>
              <option>中山分公司</option>
              <option>义乌分公司</option>
              <option>北京分公司</option>
              <option>厦门分公司</option>
              <option>深圳分公司</option>
              <option>宁波分公司</option>
              <option>上海分公司</option>
              <option>青岛分公司</option>
            </select>
          </div>
          <div class="fi">
            <label>派送方式 <span class="new">NEW</span></label>
            <select id="qMethod">
              <option value="">请选择派送方式</option>
              <option>快递派</option>
              <option>卡派</option>
              <option>自提</option>
              <option>FBA派</option>
              <option>整柜直送</option>
            </select>
          </div>
        </section>
        <div class="table-wrap">
          <table class="grid" id="grid"></table>
        </div>
        <div class="pager" id="pager">共 0 票</div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="ess-prd-source" hidden aria-hidden="true" data-prd-href="海外对接组-部门进仓数据-MVP-PRD.html" data-prd-anchor="s-logic">
    <span class="ess-prd-chip">PRD · 部门进仓数据</span>
  </div>
  <script src="../../二期/ess-prototype-prd.js"></script>
  <script>
(function () {
  var BRANCHES = ["中山分公司", "义乌分公司", "北京分公司", "厦门分公司", "深圳分公司", "宁波分公司", "上海分公司", "青岛分公司"];
  var COLS = ["华东同行客服", "华南客户", "厦门仓", "台州仓", "义乌仓", "中山仓", "深圳仓", "宁波仓"];
  var METHODS = ["快递派", "卡派", "自提", "FBA派", "整柜直送"];
  var WH_COLS = { "厦门仓": "厦门仓", "台州仓": "台州仓", "义乌仓": "义乌仓", "中山仓": "中山仓", "深圳仓": "深圳仓", "宁波仓": "宁波仓" };
  var seed = [
    [12, 8, 36, 4, 9, 41, 7, 3],
    [6, 3, 11, 22, 48, 5, 4, 2],
    [18, 9, 7, 2, 4, 3, 6, 1],
    [4, 2, 55, 6, 8, 5, 3, 2],
    [9, 14, 8, 3, 6, 7, 29, 4],
    [5, 4, 6, 8, 7, 2, 5, 21],
    [11, 7, 9, 5, 6, 4, 8, 3],
    [3, 2, 4, 3, 5, 2, 3, 6]
  ];
  /* 每格拆成 5 种派送方式，合计=seed */
  var CELLS = [];
  BRANCHES.forEach(function (b, i) {
    COLS.forEach(function (c, j) {
      var total = seed[i][j];
      var parts = [0.38, 0.28, 0.14, 0.12, 0.08].map(function (p, k) {
        return k === 4 ? 0 : Math.round(total * p);
      });
      parts[4] = Math.max(0, total - parts[0] - parts[1] - parts[2] - parts[3]);
      METHODS.forEach(function (m, k) {
        CELLS.push({ branch: b, col: c, method: m, qty: parts[k] });
      });
    });
  });

  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove("show"); }, 1600);
  }
  function filtered() {
    var wh = $("qWh").value, dept = $("qDept").value, method = $("qMethod").value;
    return CELLS.filter(function (r) {
      if (dept && r.branch !== dept) return false;
      if (method && r.method !== method) return false;
      if (wh && r.col !== WH_COLS[wh]) return false;
      return true;
    });
  }
  function render() {
    var rows = filtered();
    var map = {};
    rows.forEach(function (r) {
      var k = r.branch + "\t" + r.col;
      map[k] = (map[k] || 0) + r.qty;
    });
    var branches = BRANCHES.filter(function (b) { return ! $("qDept").value || $("qDept").value === b; });
    var cols = COLS.filter(function (c) { return !$("qWh").value || c === $("qWh").value; });
    var head = "<thead><tr><th class='stub'>分公司</th>" + cols.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "<th>合计</th></tr>";
    head += "<tr><th class='stub col-search'><input placeholder='搜索分公司' id='qBranchKw' /></th>" +
      cols.map(function (_, i) { return "<th class='col-search'><input data-col='" + i + "' /></th>"; }).join("") +
      "<th class='col-search'></th></tr></thead>";
    var grand = 0;
    var colSum = cols.map(function () { return 0; });
    var body = "<tbody>" + branches.map(function (b) {
      var line = 0;
      var tds = cols.map(function (c, ci) {
        var n = map[b + "\t" + c] || 0;
        line += n; colSum[ci] += n;
        return "<td class='num'>" + (n || "") + "</td>";
      }).join("");
      grand += line;
      return "<tr><td class='stub'>" + b + "</td>" + tds + "<td class='num'><b>" + line + "</b></td></tr>";
    }).join("");
    body += "<tr class='total'><td class='stub'>合计</td>" + colSum.map(function (n) { return "<td class='num'>" + n + "</td>"; }).join("") +
      "<td class='num'>" + grand + "</td></tr></tbody>";
    $("grid").innerHTML = head + body;
    $("pager").textContent = "共 " + grand + " 票" + ($("qMethod").value ? " · 派送方式=" + $("qMethod").value : "");
    var kw = $("qBranchKw");
    if (kw) kw.addEventListener("input", function () {
      var v = kw.value.trim();
      document.querySelectorAll("table.grid tbody tr").forEach(function (tr) {
        if (tr.classList.contains("total")) return;
        tr.style.display = !v || tr.querySelector(".stub").textContent.indexOf(v) >= 0 ? "" : "none";
      });
    });
  }
  $("btnQuery").onclick = function () { render(); toast("已按条件查询"); };
  $("btnReset").onclick = function () {
    $("qFrom").value = "2026-07-28"; $("qTo").value = "2026-08-28";
    $("qWh").value = ""; $("qDept").value = ""; $("qMethod").value = "";
    render(); toast("已重置");
  };
  $("qWh").onchange = $("qDept").onchange = $("qMethod").onchange = render;
  render();
})();
  </script>
</body>
</html>
