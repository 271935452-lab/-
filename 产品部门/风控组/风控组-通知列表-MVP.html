<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的通知 · 风控组</title>
  <link rel="stylesheet" href="../../二期/ess-prototype-prd.css" />
  <style>
    :root {
      --bg: #f0f2f5; --line: #e8e8e8; --text: rgba(0,0,0,.85);
      --sub: rgba(0,0,0,.45); --blue: #1890ff; --orange: #fa8c16;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Microsoft YaHei","PingFang SC",Arial,sans-serif;
      font-size: 12px; color: var(--text); background: #eef1f6;
    }
    a { color: var(--blue); text-decoration: none; }
    .topbar {
      height: 40px; background: #001529; color: #fff;
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
    }
    .topbar .logo { font-weight: 700; font-size: 14px; white-space: nowrap; }
    .topbar .nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; }
    .topbar .nav a {
      color: rgba(255,255,255,.72); padding: 0 10px; height: 40px;
      display: inline-flex; align-items: center; white-space: nowrap; font-size: 12px;
    }
    .topbar .nav a.on { color: #fff; font-weight: 600; background: var(--orange); }
    .topbar .right { margin-left: auto; color: rgba(255,255,255,.65); white-space: nowrap; }
    .layout { display: flex; min-height: calc(100vh - 40px); }
    .sider {
      width: 168px; background: #001529; color: rgba(255,255,255,.75);
      padding: 8px 0; flex: none;
    }
    .sider .g { padding: 8px 16px 4px; font-size: 11px; color: rgba(255,255,255,.45); }
    .sider a { display: block; padding: 8px 16px; color: rgba(255,255,255,.75); font-size: 12px; }
    .sider a.on { background: #1890ff; color: #fff; }
    .main { flex: 1; min-width: 0; padding: 10px 12px 24px; overflow: auto; }
    .badge {
      display: inline-block; padding: 0 5px; border-radius: 2px; font-size: 10px;
      font-weight: 700; line-height: 16px; vertical-align: middle; margin-left: 4px;
    }
    .badge.new { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 2px; }
    .filters {
      display: grid; grid-template-columns: 280px 1fr auto;
      gap: 10px; padding: 10px 12px; align-items: end; border-bottom: 1px solid var(--line);
    }
    .fi label { display: block; color: var(--sub); margin-bottom: 2px; font-size: 11px; }
    .fi select, .fi input {
      width: 100%; height: 28px; border: 1px solid #d9d9d9; border-radius: 2px;
      padding: 0 8px; font: inherit;
    }
    .acts {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px;
      border-bottom: 1px solid var(--line); align-items: center;
    }
    .btn {
      height: 28px; padding: 0 12px; border: 1px solid #d9d9d9; background: #fff;
      border-radius: 2px; font: inherit; cursor: pointer; white-space: nowrap;
    }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.dark { background: #096dd9; border-color: #096dd9; color: #fff; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .status-tabs {
      display: flex; gap: 0; padding: 0 8px; border-bottom: 1px solid var(--line);
      background: #fafafa;
    }
    .st {
      border: none; background: transparent; padding: 10px 14px; cursor: pointer;
      font: inherit; color: var(--sub); white-space: nowrap; border-bottom: 2px solid transparent;
    }
    .st.on { color: var(--orange); font-weight: 600; border-bottom-color: var(--orange); background: #fff; }
    .table-wrap { overflow: auto; max-height: calc(100vh - 320px); }
    table.grid {
      width: 100%; border-collapse: collapse; min-width: 1200px; font-size: 11px;
    }
    table.grid th, table.grid td {
      border: 1px solid #f0f0f0; padding: 6px 8px; text-align: left; vertical-align: middle;
    }
    table.grid th {
      background: #fafafa; position: sticky; top: 0; z-index: 2; font-weight: 600;
    }
    table.grid th .filter-row { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
    table.grid th input.filter {
      width: 100%; min-width: 60px; height: 22px; border: 1px solid #e8e8e8;
      border-radius: 2px; padding: 0 4px; font: inherit; font-weight: 400;
    }
    table.grid tr.unread td { background: #fffbe6; }
    table.grid tr:nth-child(even):not(.unread) td { background: #fcfcfc; }
    .tag {
      display: inline-block; padding: 0 5px; border-radius: 2px; font-size: 10px; border: 1px solid;
    }
    .tag.ok { color: #389e0d; background: #f6ffed; border-color: #b7eb8f; }
    .tag.warn { color: #d46b08; background: #fff7e6; border-color: #ffd591; }
    .tag.gray { color: #8c8c8c; background: #f5f5f5; border-color: #d9d9d9; }
    .tag.blue { color: #096dd9; background: #e6f7ff; border-color: #91d5ff; }
    .foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-top: 1px solid var(--line); color: var(--sub);
    }
    .pager { display: flex; gap: 6px; align-items: center; }
    .pager select, .pager input {
      height: 24px; border: 1px solid #d9d9d9; border-radius: 2px; font: inherit;
    }
    .empty { padding: 48px 12px; text-align: center; color: #8c8c8c; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #111827; color: #fff; padding: 10px 16px; border-radius: 6px;
      font-size: 12px; display: none; z-index: 99;
    }
    .detail-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 80;
      display: none; align-items: center; justify-content: center; padding: 12px;
    }
    .detail-mask.open { display: flex; }
    .detail-modal {
      width: min(560px, 96vw); background: #fff; border-radius: 2px;
      box-shadow: 0 8px 28px rgba(0,0,0,.18);
    }
    .detail-modal-hd {
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
    }
    .detail-modal-hd h3 { margin: 0; font-size: 15px; }
    .detail-modal-bd { padding: 14px 16px; font-size: 12px; line-height: 1.65; }
    .detail-modal-bd dl { margin: 0; display: grid; grid-template-columns: 88px 1fr; gap: 8px 12px; }
    .detail-modal-bd dt { color: var(--sub); }
    .detail-modal-ft {
      padding: 10px 16px; border-top: 1px solid var(--line);
      display: flex; gap: 8px; justify-content: flex-end;
    }
    .page-tip {
      margin: 0 0 8px; padding: 8px 12px; background: #fff; border: 1px solid var(--line);
      border-radius: 2px; color: var(--sub); font-size: 11px; line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">腾信物流</div>
    <div class="nav">
      <a href="风控组-导航.html">← 返回导航</a>
      <a href="#">控制台</a>
      <a href="#">运单管理</a>
      <a href="#">客户管理</a>
      <a href="风控组-查货操作-AI识图品名识别-原型.html">查货操作</a>
      <a class="on" href="#">我的通知</a>
    </div>
    <div class="right">风控 · 双通道通知列表 · IT(BT0022)</div>
  </div>

  <div class="layout">
    <aside class="sider">
      <div class="g">消息</div>
      <a class="on" href="#">我的通知 <span class="badge new">NEW</span></a>
      <div class="g">风控</div>
      <a href="风控组-导航.html">本组导航</a>
      <a href="风控组-查货操作-AI识图品名识别-原型.html">查货操作</a>
      <a href="风控组-品名库-合规标记-MVP.html">品名库</a>
      <a href="风控组-操作查货率报表-MVP.html">查货率报表</a>
    </aside>

    <div class="main">
      <p class="page-tip">
        对齐现网「我的待办」布局。查货操作完成<strong>产品确认 / 扣件 / 添加费用 / 附加服务 / 扣件放行</strong>后，同步写入<strong>企微私聊 + 系统消息</strong>，在本列表统一查看与标记已读。
      </p>

      <div class="panel">
        <div class="filters">
          <div class="fi">
            <label>通知类型</label>
            <select id="qType">
              <option value="">请选择通知类型</option>
              <option>产品确认</option>
              <option>查货扣件</option>
              <option>查货扣件放行</option>
              <option>添加费用</option>
              <option>附加服务变更</option>
              <option>扣货风险告知</option>
            </select>
          </div>
          <div></div>
          <div style="display:flex;gap:6px;justify-content:flex-end">
            <button type="button" class="btn" id="btnReset">数据重置</button>
          </div>
        </div>

        <div class="acts">
          <button type="button" class="btn primary" id="btnSearch">查询数据</button>
          <button type="button" class="btn dark" id="btnDetail">查看详情</button>
          <button type="button" class="btn primary" id="btnBatchRead">批量标记已读</button>
          <button type="button" class="btn" id="btnBatchIgnore">批量忽略</button>
        </div>

        <div class="status-tabs" id="statusTabs">
          <button type="button" class="st on" data-st="未读">未读<span class="n" id="cntUnread">(0)</span></button>
          <button type="button" class="st" data-st="已读">已读<span class="n" id="cntRead">(0)</span></button>
          <button type="button" class="st" data-st="抄送">抄送<span class="n" id="cntCc">(0)</span></button>
        </div>

        <div class="table-wrap">
          <table class="grid">
            <thead>
              <tr>
                <th style="width:36px"><input type="checkbox" id="chkAll" /></th>
                <th style="width:48px">序号</th>
                <th>通知单号<input class="filter" id="fNo" placeholder="筛选" /></th>
                <th>阅读状态<input class="filter" id="fStatus" placeholder="筛选" /></th>
                <th>通知类型<input class="filter" id="fType" placeholder="筛选" /></th>
                <th>通知内容<input class="filter" id="fContent" placeholder="筛选" /></th>
                <th>通知时间<input class="filter" id="fTime" placeholder="筛选" /></th>
                <th>运单号<input class="filter" id="fWay" placeholder="筛选" /></th>
                <th>通知渠道</th>
                <th>操作人<input class="filter" id="fOp" placeholder="筛选" /></th>
                <th style="width:120px">操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

        <div class="foot">
          <span>共 <b id="totalN">0</b> 条</span>
          <div class="pager">
            <select id="pageSize"><option>20条/页</option><option selected>100条/页</option></select>
            <button type="button" class="btn" disabled>‹</button>
            <span>1</span>
            <button type="button" class="btn" disabled>›</button>
            <span>前往</span>
            <input type="number" value="1" min="1" style="width:40px" />
            <span>页</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="detail-mask" id="detailMask" aria-hidden="true">
    <div class="detail-modal" role="dialog">
      <div class="detail-modal-hd">
        <h3>通知详情</h3>
        <button type="button" class="btn" id="detailClose">关闭</button>
      </div>
      <div class="detail-modal-bd" id="detailBody"></div>
      <div class="detail-modal-ft">
        <button type="button" class="btn" id="detailMarkRead">标记已读</button>
        <button type="button" class="btn primary" id="detailOk">知道了</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var STORAGE_KEY = "fk_notify_list_v1";
    var filterSt = "未读";
    var detailId = null;

    var SEED = [
      {
        id: "NT202608180001", status: "未读", cc: false, type: "产品确认",
        content: "已确认「运动服装 / Sportswear」→ 产品已确认 · 已通知客服/业务（1条快捷语）",
        at: "2026-08-17 23:40:00", waybill: "MTTY0805-9", channels: "企微私聊 + 系统消息",
        operator: "风控确认", wxTo: "业务员/客服", sysTo: "站内消息中心"
      },
      {
        id: "NT202608180002", status: "未读", cc: false, type: "添加费用",
        content: "费用已写入 2 票 · 多品名费30/个 → 成本+应收 · 通知：超品名费手动加收",
        at: "2026-08-17 18:22:11", waybill: "HZBZ0805-1", channels: "企微私聊 + 系统消息",
        operator: "风控确认", wxTo: "业务员/客服", sysTo: "站内消息中心"
      },
      {
        id: "NT202608180003", status: "已读", cc: false, type: "查货扣件放行",
        content: "查货扣件放行 1 票 · 客户已补资料，同意放行",
        at: "2026-08-17 16:05:33", waybill: "QYWL0805-9", channels: "企微私聊 + 系统消息",
        operator: "风控确认", wxTo: "业务员/客服", sysTo: "站内消息中心"
      },
      {
        id: "NT202608180004", status: "抄送", cc: true, type: "附加服务变更",
        content: "附加服务已更新 ×3 票 · 增加2项 · 费用已同步",
        at: "2026-08-17 14:30:00", waybill: "—", channels: "系统消息",
        operator: "风控确认", wxTo: "—", sysTo: "站内消息中心（抄送客服主管）"
      }
    ];

    function loadList() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length) return parsed;
        }
      } catch (e) {}
      return SEED.slice();
    }

    function saveList(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    var NOTIFY_LIST = loadList();

    function toast(msg) {
      var el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(el._t);
      el._t = setTimeout(function () { el.style.display = "none"; }, 2000);
    }

    function statusTag(s) {
      if (s === "未读") return '<span class="tag warn">未读</span>';
      if (s === "已读") return '<span class="tag ok">已读</span>';
      if (s === "抄送") return '<span class="tag blue">抄送</span>';
      if (s === "已忽略") return '<span class="tag gray">已忽略</span>';
      return s;
    }

    function tabStatus(row) {
      if (row.cc) return "抄送";
      return row.status === "已忽略" ? "已读" : row.status;
    }

    function filtered() {
      var qType = document.getElementById("qType").value;
      var fNo = (document.getElementById("fNo").value || "").trim().toLowerCase();
      var fStatus = (document.getElementById("fStatus").value || "").trim();
      var fType = (document.getElementById("fType").value || "").trim();
      var fContent = (document.getElementById("fContent").value || "").trim().toLowerCase();
      var fTime = (document.getElementById("fTime").value || "").trim();
      var fWay = (document.getElementById("fWay").value || "").trim().toLowerCase();
      var fOp = (document.getElementById("fOp").value || "").trim();

      return NOTIFY_LIST.filter(function (r) {
        if (filterSt === "抄送") {
          if (!r.cc) return false;
        } else if (tabStatus(r) !== filterSt) {
          return false;
        }
        if (qType && r.type !== qType) return false;
        if (fNo && r.id.toLowerCase().indexOf(fNo) < 0) return false;
        if (fStatus && r.status.indexOf(fStatus) < 0 && !(r.cc && fStatus.indexOf("抄") >= 0)) return false;
        if (fType && r.type.indexOf(fType) < 0) return false;
        if (fContent && (r.content || "").toLowerCase().indexOf(fContent) < 0) return false;
        if (fTime && r.at.indexOf(fTime) < 0) return false;
        if (fWay && (r.waybill || "").toLowerCase().indexOf(fWay) < 0) return false;
        if (fOp && (r.operator || "").indexOf(fOp) < 0) return false;
        return true;
      });
    }

    function updateCounts() {
      var unread = NOTIFY_LIST.filter(function (r) { return !r.cc && r.status === "未读"; }).length;
      var read = NOTIFY_LIST.filter(function (r) { return !r.cc && r.status === "已读"; }).length;
      var cc = NOTIFY_LIST.filter(function (r) { return r.cc; }).length;
      document.getElementById("cntUnread").textContent = "(" + unread + ")";
      document.getElementById("cntRead").textContent = "(" + read + ")";
      document.getElementById("cntCc").textContent = "(" + cc + ")";
    }

    function render() {
      var rows = filtered();
      updateCounts();
      document.getElementById("totalN").textContent = rows.length;
      var tb = document.getElementById("tbody");
      if (!rows.length) {
        tb.innerHTML = '<tr><td colspan="11" class="empty">暂无数据</td></tr>';
        return;
      }
      tb.innerHTML = rows.map(function (r, i) {
        var st = r.cc ? "抄送" : r.status;
        return '<tr data-id="' + r.id + '" class="' + (r.status === "未读" && !r.cc ? "unread" : "") + '">' +
          '<td><input type="checkbox" class="row-chk" /></td>' +
          "<td>" + (i + 1) + "</td>" +
          "<td><a class=\"link\" data-open=\"" + r.id + "\">" + r.id + "</a></td>" +
          "<td>" + statusTag(st) + "</td>" +
          "<td>" + r.type + "</td>" +
          "<td title=\"" + (r.content || "").replace(/"/g, "&quot;") + "\">" + (r.content || "—") + "</td>" +
          "<td>" + r.at + "</td>" +
          "<td>" + (r.waybill ? ('<a class="link" href="风控组-查货操作-AI识图品名识别-原型.html">' + r.waybill + "</a>") : "—") + "</td>" +
          "<td>" + (r.channels || "—") + "</td>" +
          "<td>" + (r.operator || "—") + "</td>" +
          '<td><button type="button" class="btn" style="height:22px;padding:0 6px;font-size:11px" data-open="' + r.id + '">详情</button> ' +
          (r.status === "未读" && !r.cc ? ('<button type="button" class="btn" style="height:22px;padding:0 6px;font-size:11px" data-read="' + r.id + '">已读</button>') : "") +
          "</td></tr>";
      }).join("");
    }

    function pickedIds() {
      var ids = [];
      document.querySelectorAll("#tbody tr").forEach(function (tr) {
        var chk = tr.querySelector(".row-chk");
        if (chk && chk.checked) ids.push(tr.getAttribute("data-id"));
      });
      return ids;
    }

    function findById(id) {
      return NOTIFY_LIST.filter(function (r) { return r.id === id; })[0];
    }

    function markRead(ids) {
      ids.forEach(function (id) {
        var r = findById(id);
        if (r && r.status === "未读" && !r.cc) r.status = "已读";
      });
      saveList(NOTIFY_LIST);
      render();
    }

    function markIgnore(ids) {
      ids.forEach(function (id) {
        var r = findById(id);
        if (r && !r.cc) r.status = "已忽略";
      });
      saveList(NOTIFY_LIST);
      render();
    }

    function openDetail(id) {
      var r = findById(id);
      if (!r) return;
      detailId = id;
      document.getElementById("detailBody").innerHTML =
        "<dl>" +
        "<dt>通知单号</dt><dd>" + r.id + "</dd>" +
        "<dt>阅读状态</dt><dd>" + (r.cc ? "抄送" : r.status) + "</dd>" +
        "<dt>通知类型</dt><dd>" + r.type + "</dd>" +
        "<dt>通知内容</dt><dd>" + (r.content || "—") + "</dd>" +
        "<dt>通知时间</dt><dd>" + r.at + "</dd>" +
        "<dt>运单号</dt><dd>" + (r.waybill || "—") + "</dd>" +
        "<dt>企微推送</dt><dd>" + (r.wxTo || "业务员/客服") + "</dd>" +
        "<dt>系统消息</dt><dd>" + (r.sysTo || "站内消息中心") + "</dd>" +
        "<dt>操作人</dt><dd>" + (r.operator || "—") + "</dd>" +
        "</dl>";
      document.getElementById("detailMask").classList.add("open");
      document.getElementById("detailMarkRead").hidden = !!(r.cc || r.status !== "未读");
    }

    function closeDetail() {
      document.getElementById("detailMask").classList.remove("open");
      detailId = null;
    }

    document.getElementById("statusTabs").addEventListener("click", function (e) {
      var st = e.target.closest(".st");
      if (!st) return;
      document.querySelectorAll(".st").forEach(function (x) { x.classList.remove("on"); });
      st.classList.add("on");
      filterSt = st.getAttribute("data-st") || "";
      render();
    });

    ["fNo", "fStatus", "fType", "fContent", "fTime", "fWay", "fOp"].forEach(function (id) {
      document.getElementById(id).addEventListener("input", render);
    });
    document.getElementById("qType").addEventListener("change", render);
    document.getElementById("btnSearch").onclick = render;
    document.getElementById("btnReset").onclick = function () {
      document.getElementById("qType").value = "";
      ["fNo", "fStatus", "fType", "fContent", "fTime", "fWay", "fOp"].forEach(function (id) {
        document.getElementById(id).value = "";
      });
      filterSt = "未读";
      document.querySelectorAll(".st").forEach(function (x) {
        x.classList.toggle("on", x.getAttribute("data-st") === "未读");
      });
      render();
      toast("已重置筛选");
    };

    document.getElementById("chkAll").onchange = function () {
      var on = document.getElementById("chkAll").checked;
      document.querySelectorAll("#tbody .row-chk").forEach(function (c) { c.checked = on; });
    };

    document.getElementById("tbody").addEventListener("click", function (e) {
      var read = e.target.closest("[data-read]");
      if (read) {
        markRead([read.getAttribute("data-read")]);
        toast("已标记已读");
        return;
      }
      var open = e.target.closest("[data-open]");
      if (open) openDetail(open.getAttribute("data-open"));
    });

    document.getElementById("btnDetail").onclick = function () {
      var ids = pickedIds();
      if (ids.length !== 1) { toast("请勾选 1 条通知后查看详情"); return; }
      openDetail(ids[0]);
    };

    document.getElementById("btnBatchRead").onclick = function () {
      var ids = pickedIds();
      if (!ids.length) { toast("请先勾选通知"); return; }
      markRead(ids);
      toast("已批量标记已读 ×" + ids.length);
    };

    document.getElementById("btnBatchIgnore").onclick = function () {
      var ids = pickedIds();
      if (!ids.length) { toast("请先勾选通知"); return; }
      markIgnore(ids);
      toast("已批量忽略 ×" + ids.length);
    };

    document.getElementById("detailClose").onclick = closeDetail;
    document.getElementById("detailOk").onclick = closeDetail;
    document.getElementById("detailMarkRead").onclick = function () {
      if (detailId) markRead([detailId]);
      closeDetail();
      toast("已标记已读");
    };

    render();
  </script>
</body>
</html>
